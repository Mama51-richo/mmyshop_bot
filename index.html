<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>soYam cosmo · Mini App</title>
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #0b0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* main phone frame */
    .app-frame {
      max-width: 400px;
      width: 100%;
      background: #f8f5f0;
      border-radius: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 0 2px #d4af37 inset;
      overflow: hidden;
      position: relative;
      padding: 16px 12px 20px;
      transition: background 0.2s;
    }

    /* header brand */
    .brand-crown {
      text-align: center;
      margin-bottom: 10px;
      position: relative;
    }
    .brand-crown .logo-symbol {
      font-size: 42px;
      font-weight: 700;
      font-family: 'Cormorant Garamond', serif;
      color: #1e1a16;
      letter-spacing: 0.18em;
      background: linear-gradient(145deg, #d4af37, #b8952a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 2px 8px rgba(212, 175, 55, 0.2);
      line-height: 1;
    }
    .brand-crown .sub-brand {
      font-size: 15px;
      font-weight: 500;
      color: #3d2e1b;
      letter-spacing: 2px;
      margin-top: -4px;
      background: #e3d5c0;
      display: inline-block;
      padding: 0 12px;
      border-radius: 30px;
      font-family: 'Montserrat', sans-serif;
      -webkit-text-fill-color: #3d2e1b;
    }
    .brand-crown .amharic {
      font-size: 16px;
      font-weight: 400;
      color: #5a4a34;
      margin-top: 2px;
      letter-spacing: 1px;
    }
    .brand-crown .address-mini {
      font-size: 9px;
      font-weight: 400;
      color: #6f5e48;
      letter-spacing: 0.4px;
      background: rgba(255, 248, 235, 0.6);
      padding: 2px 12px;
      border-radius: 40px;
      display: inline-block;
      margin-top: 6px;
      backdrop-filter: blur(2px);
      border: 1px solid #d4af3740;
    }

    /* language row */
    .lang-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 8px;
      background: #2b241d;
      padding: 6px 8px;
      border-radius: 60px;
      margin: 8px 0 12px;
    }
    .lang-chip {
      font-size: 9px;
      font-weight: 600;
      color: #e6dccb;
      background: #3f352b;
      padding: 3px 10px;
      border-radius: 40px;
      letter-spacing: 0.3px;
      border: 1px solid #d4af3740;
      transition: 0.2s;
      cursor: default;
    }
    .lang-chip.active {
      background: #d4af37;
      color: #1a150f;
      border-color: #d4af37;
    }

    /* social row */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 6px 0 16px;
    }
    .social-icon {
      color: #3d2e1b;
      font-size: 22px;
      transition: 0.2s;
      opacity: 0.8;
      text-decoration: none;
    }
    .social-icon:hover { opacity: 1; transform: scale(1.05); }

    /* main content area */
    .portal-container {
      background: #fcf9f5;
      border-radius: 28px;
      padding: 16px 12px;
      box-shadow: inset 0 1px 6px rgba(0,0,0,0.03);
      min-height: 400px;
      transition: all 0.2s;
      border: 1px solid #e9dfd1;
    }

    /* tabs / navigation */
    .nav-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid #e2d4c2;
      padding-bottom: 10px;
    }
    .nav-tab {
      font-size: 10px;
      font-weight: 600;
      background: transparent;
      border: none;
      padding: 6px 12px;
      border-radius: 40px;
      color: #5c4b35;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.3px;
      font-family: 'Montserrat', sans-serif;
    }
    .nav-tab.active {
      background: #d4af37;
      color: #1f1a14;
    }
    .nav-tab i { margin-right: 4px; }

    /* role switcher (owner only) */
    .role-switcher {
      display: flex;
      gap: 8px;
      background: #eaddd0;
      padding: 8px 10px;
      border-radius: 60px;
      margin-bottom: 16px;
      justify-content: center;
    }
    .role-btn {
      background: transparent;
      border: 1px solid transparent;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 11px;
      font-family: 'Montserrat', sans-serif;
      color: #2d241c;
      cursor: pointer;
      transition: 0.15s;
    }
    .role-btn.active {
      background: #1a150f;
      color: #f0e6d8;
      border-color: #d4af37;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* product grid */
    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }
    .product-card {
      background: white;
      border-radius: 20px;
      padding: 10px 8px 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.02);
      border: 1px solid #ede5d8;
      transition: 0.15s;
      text-align: center;
    }
    .product-card .img-placeholder {
      background: #e9dfd1;
      border-radius: 16px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6f5e48;
      font-size: 22px;
      margin-bottom: 6px;
    }
    .product-card .p-name {
      font-size: 11px;
      font-weight: 600;
      color: #1e1710;
      letter-spacing: 0.2px;
    }
    .product-card .p-price {
      font-size: 13px;
      font-weight: 700;
      color: #b8952a;
      margin: 2px 0 6px;
    }
    .btn-add {
      background: #1a150f;
      border: none;
      color: #f0e6d8;
      font-size: 10px;
      padding: 4px 12px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      font-family: 'Montserrat', sans-serif;
    }
    .btn-add:hover { background: #d4af37; color: #1a150f; }

    /* seller / owner cards */
    .stat-card {
      background: #f3ede6;
      border-radius: 20px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-left: 4px solid #d4af37;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .stat-card h4 {
      font-size: 12px;
      font-weight: 600;
      color: #2d241c;
      display: flex;
      justify-content: space-between;
    }
    .stat-card .badge {
      background: #1a150f;
      color: #f0e6d8;
      padding: 0 10px;
      border-radius: 40px;
      font-size: 9px;
    }
    .flex-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .flex-row .pill {
      background: white;
      border-radius: 60px;
      padding: 4px 12px;
      font-size: 10px;
      border: 1px solid #d4af3740;
    }
    .action-btn {
      background: #d4af37;
      border: none;
      padding: 10px 16px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 12px;
      color: #1a150f;
      width: 100%;
      cursor: pointer;
      transition: 0.15s;
      font-family: 'Montserrat', sans-serif;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }
    .action-btn.secondary {
      background: #2b241d;
      color: #f0e6d8;
    }
    .action-btn.danger {
      background: #9f3a2b;
      color: white;
    }

    /* owner management */
    .mgmt-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    .mgmt-row input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 60px;
      border: 1px solid #d0c0ac;
      background: white;
      font-size: 10px;
      font-family: 'Montserrat', sans-serif;
      min-width: 80px;
    }
    .mgmt-row button {
      background: #1a150f;
      border: none;
      color: #f0e6d8;
      padding: 8px 16px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 10px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
    }

    .footer-note {
      font-size: 8px;
      color: #6f5e48;
      text-align: center;
      margin-top: 16px;
      opacity: 0.6;
      letter-spacing: 0.3px;
    }

    /* hidden utility */
    .hidden { display: none !important; }

    .mt-2 { margin-top: 12px; }
    .text-gold { color: #b8952a; }
    .bg-dark { background: #1a150f; color: #f0e6d8; border-radius: 60px; padding: 4px 12px; }
  </style>
</head>
<body>
<div class="app-frame" id="appFrame">

  <!-- BRAND CROWN -->
  <div class="brand-crown">
    <div class="logo-symbol">SY</div>
    <div class="sub-brand">soYam cosmo</div>
    <div class="amharic">ሶያም ኮስሞቲክስ</div>
    <div class="address-mini">
      <i class="fas fa-map-pin" style="color:#b8952a;"></i> Betel Bldg, G.Floor · Addis Ababa
      <i class="fas fa-phone-alt" style="margin-left:6px;color:#b8952a;"></i> +251 91 909 6451
    </div>
  </div>

  <!-- LANGUAGE ROW -->
  <div class="lang-row">
    <span class="lang-chip active">English</span>
    <span class="lang-chip">አማርኛ</span>
    <span class="lang-chip">ትግርኛ</span>
    <span class="lang-chip">Oromiffa</span>
    <span class="lang-chip">Gurage</span>
    <span class="lang-chip">Soomaali</span>
  </div>

  <!-- SOCIAL ROW -->
  <div class="social-row">
    <a href="#" class="social-icon"><i class="fab fa-tiktok"></i></a>
    <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
    <a href="#" class="social-icon"><i class="fab fa-whatsapp"></i></a>
  </div>

  <!-- PORTAL CONTAINER -->
  <div class="portal-container" id="portalContainer">
    <!-- dynamic content rendered by js -->
    <div id="portalContent"></div>
  </div>

  <div class="footer-note">
    <i class="fas fa-shield-alt" style="color:#d4af37;"></i> secured · role backend
  </div>
</div>

<script>
  (function() {
    // --------------------------------------------------------------
    // BACKEND SIMULATION (in-memory)
    // --------------------------------------------------------------
    const DB = {
      users: [
        { id: 1, telegram_user_id: '999999999', telegram_username: 'mama51R', roles: ['OWNER', 'SELLER'], store_id: 'STORE001', account_status: 'ACTIVE' },
        { id: 2, telegram_user_id: '888888888', telegram_username: 'silencer01m', roles: ['SELLER'], store_id: 'STORE001', account_status: 'ACTIVE' },
        { id: 3, telegram_user_id: '111111111', telegram_username: 'buyer_demo', roles: ['BUYER'], store_id: null, account_status: 'ACTIVE' },
        { id: 4, telegram_user_id: '777777777', telegram_username: 'driver_abebe', roles: ['DRIVER'], store_id: 'STORE001', account_status: 'ACTIVE' }
      ],
      products: [
        { id: 101, name: 'Gold Serum', category: 'Skincare', price: 850, stock: 12, image: '✨' },
        { id: 102, name: 'Velvet Cream', category: 'Makeup', price: 420, stock: 8, image: '🧴' },
        { id: 103, name: 'Oud Fragrance', category: 'Fragrance', price: 1250, stock: 5, image: '🌸' },
        { id: 104, name: 'Detergent Plus', category: 'Detergent', price: 180, stock: 30, image: '🧺' }
      ],
      orders: [
        { id: 'ORD-1001', status: 'PENDING', total: 1270, buyer: 'buyer_demo' }
      ]
    };

    // current session (simulate telegram user)
    let currentTelegramUser = {
      id: '999999999',   // change to '888888888' for seller, '111111111' for buyer, '777777777' for driver
      username: 'mama51R',
      first_name: 'Rahel'
    };

    // --------------------------------------------------------------
    // HELPER: get user from DB
    // --------------------------------------------------------------
    function getUserByTelegramId(tgId) {
      return DB.users.find(u => u.telegram_user_id === tgId) || null;
    }

    // --------------------------------------------------------------
    // DETERMINE ROLES & ACTIVE PORTAL
    // --------------------------------------------------------------
    function getSession(tgId) {
      const user = getUserByTelegramId(tgId);
      if (!user) {
        // default buyer
        return { authorized_roles: ['BUYER'], active_portal: 'BUYER', user: null, store_id: null };
      }
      let roles = user.roles || ['BUYER'];
      // if owner has seller role too
      let activePortal = roles.includes('OWNER') ? 'OWNER' : (roles.includes('SELLER') ? 'SELLER' : (roles.includes('DRIVER') ? 'DRIVER' : 'BUYER'));
      // if only owner, but can switch
      return { authorized_roles: roles, active_portal: activePortal, user, store_id: user.store_id };
    }

    // --------------------------------------------------------------
    // RENDER ENGINE
    // --------------------------------------------------------------
    function renderApp() {
      const container = document.getElementById('portalContent');
      const tgId = currentTelegramUser.id;
      const session = getSession(tgId);
      const roles = session.authorized_roles;
      let portal = session.active_portal;

      // if owner and active portal is seller, show seller UI but with owner switcher
      const isOwner = roles.includes('OWNER');
      const isSeller = roles.includes('SELLER');
      const isDriver = roles.includes('DRIVER');
      const isBuyer = !isOwner && !isSeller && !isDriver; // fallback

      // determine display
      let displayPortal = portal;
      if (isOwner && portal === 'OWNER') displayPortal = 'OWNER';
      else if (isOwner && portal === 'SELLER') displayPortal = 'SELLER';
      else if (isSeller) displayPortal = 'SELLER';
      else if (isDriver) displayPortal = 'DRIVER';
      else displayPortal = 'BUYER';

      // ---- BUILD HTML ----
      let html = '';

      // ---- ROLE SWITCHER (only for owner) ----
      if (isOwner) {
        const isActiveOwner = (displayPortal === 'OWNER');
        const isActiveSeller = (displayPortal === 'SELLER');
        html += `<div class="role-switcher">
          <button class="role-btn ${isActiveOwner ? 'active' : ''}" data-portal="OWNER">👑 Owner Portal</button>
          <button class="role-btn ${isActiveSeller ? 'active' : ''}" data-portal="SELLER">🏪 Seller Portal</button>
        </div>`;
      }

      // ---- PORTAL CONTENT ----
      if (displayPortal === 'OWNER') {
        html += renderOwnerPortal();
      } else if (displayPortal === 'SELLER') {
        html += renderSellerPortal();
      } else if (displayPortal === 'DRIVER') {
        html += renderDriverPortal();
      } else {
        html += renderBuyerPortal();
      }

      container.innerHTML = html;

      // attach event listeners for role switcher
      document.querySelectorAll('.role-btn[data-portal]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const newPortal = this.dataset.portal;
          const sessionNow = getSession(currentTelegramUser.id);
          if (sessionNow.authorized_roles.includes('OWNER') && (newPortal === 'OWNER' || newPortal === 'SELLER')) {
            // update active portal (simulate backend)
            sessionNow.active_portal = newPortal;
            renderApp();
          }
        });
      });

      // additional listener for add product etc (demo)
      attachDemoListeners();
    }

    // --------------------------------------------------------------
    // RENDER FUNCTIONS
    // --------------------------------------------------------------
    function renderBuyerPortal() {
      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-size:16px; font-weight:600; color:#1a150f;">🛍️ Buyer</span>
          <span class="bg-dark" style="font-size:9px;">${currentTelegramUser.username}</span>
        </div>
        <div class="nav-tabs">
          <button class="nav-tab active"><i class="fas fa-th"></i> All</button>
          <button class="nav-tab">Skincare</button>
          <button class="nav-tab">Makeup</button>
          <button class="nav-tab">Fragrance</button>
          <button class="nav-tab">Detergent</button>
        </div>
        <div class="product-grid">
      `;
      DB.products.forEach(p => {
        html += `
          <div class="product-card">
            <div class="img-placeholder">${p.image}</div>
            <div class="p-name">${p.name}</div>
            <div class="p-price">ETB ${p.price}</div>
            <button class="btn-add" data-product-id="${p.id}"><i class="fas fa-plus"></i> Add</button>
          </div>
        `;
      });
      html += `</div>
        <div style="margin-top:14px; background:#ede5d8; border-radius:60px; padding:10px; text-align:center; font-size:11px; font-weight:500;">
          <i class="fas fa-camera" style="color:#b8952a;"></i> Can't find a product? Upload Photo or Name
        </div>
        <div style="margin-top:12px; display:flex; gap:6px; flex-wrap:wrap;">
          <span class="pill" style="background:#d4af37; color:#1a150f;">📦 In-Person</span>
          <span class="pill">🚚 Delivery</span>
          <span class="pill"><i class="fas fa-qrcode"></i> Scan QR</span>
        </div>
      `;
      return html;
    }

    function renderSellerPortal() {
      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-size:16px; font-weight:600; color:#1a150f;">🏪 Seller Hub</span>
          <span class="bg-dark" style="font-size:9px;">${currentTelegramUser.username}</span>
        </div>
        <div class="stat-card">
          <h4>📋 Pending Orders <span class="badge">3</span></h4>
          <div class="flex-row">
            <span class="pill">🟡 ORD-1001</span>
            <span class="pill">🟡 ORD-1004</span>
          </div>
        </div>
        <div class="stat-card" style="border-left-color:#2b241d;">
          <h4>💳 Verify Payment <span class="badge">#1024</span></h4>
          <div style="background:white; border-radius:16px; padding:8px; margin:6px 0; border:1px dashed #b8952a;">
            <i class="fas fa-receipt"></i> receipt_slip.png
          </div>
          <button class="action-btn" style="width:auto; padding:6px 18px;">✓ Verify Payment</button>
        </div>
        <div style="display:flex; gap:10px; margin:12px 0;">
          <button class="action-btn secondary" style="flex:1;"><i class="fas fa-camera"></i> SCAN ITEM QR</button>
          <button class="action-btn" style="flex:1; background:#2b241d; color:#f0e6d8;">🚛 Assign Driver</button>
        </div>
        <div class="stat-card" style="border-left-color:#6f5e48;">
          <h4>🚚 Logistics Dispatch</h4>
          <div style="font-size:10px; color:#3d2e1b;">Abebe · 🛵 to Bole · ETA 12min</div>
        </div>
      `;
      return html;
    }

    function renderOwnerPortal() {
      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-size:16px; font-weight:600; color:#1a150f;">👑 Owner Command</span>
          <span class="bg-dark" style="font-size:9px;">${currentTelegramUser.username}</span>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;">
          <div style="background:#1a150f; padding:12px; border-radius:20px; color:#f0e6d8;">
            <div style="font-size:10px; opacity:0.7;">Revenue</div>
            <div style="font-size:18px; font-weight:700;">ETB 24,850</div>
          </div>
          <div style="background:#2b241d; padding:12px; border-radius:20px; color:#f0e6d8;">
            <div style="font-size:10px; opacity:0.7;">Stock Value</div>
            <div style="font-size:18px; font-weight:700;">ETB 18,200</div>
          </div>
        </div>
        <div style="background:#eaddd0; border-radius:20px; padding:10px; margin-bottom:12px;">
          <div style="font-size:10px; font-weight:600;">📈 Weekly trend <span style="float:right;">+12%</span></div>
          <div style="height:30px; background: #d0c0ac; border-radius:40px; margin:6px 0; display:flex; align-items:center; padding:0 4px;">
            <span style="background:#d4af37; height:14px; width:70%; border-radius:40px;"></span>
            <span style="background:#b8952a; height:14px; width:30%; border-radius:40px; margin-left:2px;"></span>
          </div>
        </div>
        <div class="stat-card" style="border-left-color:#9f3a2b;">
          <h4>⚠️ Inventory Alerts</h4>
          <div style="font-size:11px; color:#9f3a2b;">Oud Fragrance · 5 left (low)</div>
          <div style="font-size:11px;">Velvet Cream · 8 left</div>
        </div>
        <div style="background:#f3ede6; border-radius:20px; padding:10px;">
          <div style="display:flex; justify-content:space-between; font-size:10px; font-weight:600;">
            <span>Staff Mgmt</span>
            <button class="action-btn" style="width:auto; padding:2px 14px; font-size:9px;">+ Add Seller</button>
          </div>
          <div style="margin-top:6px;">
            <div style="display:flex; justify-content:space-between; background:white; border-radius:40px; padding:4px 10px; margin-bottom:4px;">
              <span>@silencer01m</span>
              <span style="color:#1a8a4a;">● active</span>
              <span style="color:#9f3a2b; cursor:pointer;">revoke</span>
            </div>
          </div>
        </div>
        <button class="action-btn secondary" style="margin-top:12px;"><i class="fas fa-lock"></i> Close Daily Transactions</button>
      `;
      return html;
    }

    function renderDriverPortal() {
      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">

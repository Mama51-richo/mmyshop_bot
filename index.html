<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#24130d">
<title>soYam cosmo — Telegram Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{--brown:#26150f;--brown2:#4a2a1e;--gold:#c9a45b;--gold2:#e6cf96;--cream:#fbf7f1;--paper:#fffdf9;--ink:#211914;--muted:#766b62;--line:#eadfd3;--green:#16724a;--amber:#b97800;--red:#a52b2b;--shadow:0 7px 22px rgba(55,31,19,.09)}
*{box-sizing:border-box}html,body{margin:0;background:#eee7df;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{overflow-x:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{width:100%;max-width:760px;margin:auto;min-height:100vh;background:var(--cream);box-shadow:0 0 35px #0001}
.hero{background:linear-gradient(145deg,#24130d,#573126);color:#fff;padding:16px 12px 13px;text-align:center}.brandmark{width:53px;height:53px;margin:0 auto 6px;display:grid;place-items:center;border:1px solid var(--gold2);border-radius:17px;background:#25140e}.brandmark svg{width:42px;height:42px}.hero h1{margin:0;font-family:Georgia,serif;font-size:24px}.hero h2{font-size:11px;color:#ead8bc;margin:3px 0}.hero p{margin:2px 0;color:#d8c7b8;font-size:9px}
.langbar{display:flex;gap:5px;overflow-x:auto;padding:7px 9px;border-bottom:1px solid var(--line);background:#fff}.langbar button{flex:0 0 auto;white-space:nowrap;background:#f5eee6;padding:5px 8px;border-radius:15px;font-size:9px}.langbar button.active{background:var(--brown);color:#fff}
.social{display:flex;justify-content:center;gap:6px;padding:7px;background:#fff}.social a{width:29px;height:29px;border-radius:50%;background:#f3ebe2;display:grid;place-items:center;color:var(--brown);text-decoration:none;font-weight:800;font-size:10px}
.promo{margin:8px 10px 10px;padding:13px;border-radius:17px;background:linear-gradient(135deg,#29160f,#4d2b20);color:#fff;box-shadow:var(--shadow)}.promo small{color:#e1c99b;font-size:8px}.promo h3{margin:3px 0;font-size:15px}.promo span{font-size:10px;color:#eaded4}
.section{padding:0 10px 14px}.cats{display:flex;gap:5px;overflow-x:auto;padding:1px 0 8px}.cats button{white-space:nowrap;padding:6px 9px;border-radius:15px;background:#f1e9df;font-size:9px}.cats button.active{background:var(--brown);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff;box-shadow:var(--shadow);min-width:0}.product-img{height:112px;background:radial-gradient(circle at 50% 30%,#fff,#eee2d5);display:grid;place-items:center}.card-body{padding:8px}.card h4{margin:0 0 3px;font-size:12px}.price{font-weight:800;color:var(--brown);font-size:11px}.muted{font-size:8px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}.qty{display:flex;align-items:center;gap:4px;margin-top:6px}.qty button{width:26px;height:26px;border-radius:8px;background:#f0e8de;font-size:11px}
.primary,.gold,.danger{border-radius:9px;padding:8px 10px;font-size:10px}.primary{background:var(--brown);color:#fff}.gold{background:var(--gold);color:#21150e}.danger{background:#f8e1e1;color:var(--red)}.full{width:100%}
.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.bottom button{padding:7px 2px;background:#fff;font-size:8px;color:#675b52}.bottom button.active{color:var(--brown);font-weight:800}
.view{padding-bottom:8px}.panel{margin:8px 10px;padding:11px;border:1px solid var(--line);border-radius:15px;background:var(--paper);box-shadow:var(--shadow)}.panel h3{margin:0 0 8px;font-size:14px}.metricgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.metric{padding:9px;border:1px solid var(--line);border-radius:11px;background:#fff}.metric b{display:block;font-size:16px}.badge{display:inline-block;padding:3px 6px;border-radius:14px;font-size:8px;font-weight:800;white-space:nowrap}.ok{background:#dff2e9;color:var(--green)}.pending{background:#fff0cc;color:var(--amber)}.bad{background:#f9dddd;color:var(--red)}
.table{width:100%;border-collapse:collapse;font-size:8px}.table th,.table td{padding:6px 3px;border-bottom:1px solid var(--line);text-align:left}.input{width:100%;padding:8px;border:1px solid #d9cec2;border-radius:8px;background:#fff;font-size:10px}.formgrid{display:grid;gap:7px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.scanner{height:195px;border-radius:15px;background:#17110e;color:#fff;display:grid;place-items:center;text-align:center}.scanner .frame{width:145px;height:145px;border:2px solid var(--gold);border-radius:16px}.modal{position:fixed;inset:0;background:#0008;z-index:100;display:grid;align-items:end}.sheet{background:#fff;border-radius:21px 21px 0 0;max-height:88vh;overflow:auto;padding:15px;max-width:760px;width:100%;margin:auto}.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#24130d;color:#fff;padding:8px 13px;border-radius:18px;z-index:200;font-size:9px}
.login{min-height:100vh;display:grid;place-items:center;padding:17px;background:linear-gradient(145deg,#24130d,#5a3325)}.loginbox{max-width:440px;width:100%;background:#fff;border-radius:23px;padding:21px;text-align:center}.rolecards{display:grid;gap:8px;margin-top:13px}.rolecard{padding:12px;border:1px solid var(--line);border-radius:14px;text-align:left;background:#fff}.rolecard strong{display:block;font-size:13px}.rolecard span{font-size:9px;color:var(--muted)}
.toolbar{display:flex;gap:5px;overflow-x:auto;padding:7px 9px;border-bottom:1px solid var(--line);background:#fff}.toolbar button{white-space:nowrap;background:#f2ebe2;padding:6px 8px;border-radius:8px;font-size:8px}.toolbar button.active{background:var(--brown);color:#fff}
.kpi-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:8px 10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px;min-width:0}.kpi b{display:block;font-size:12px}.kpi span{font-size:7px;color:var(--muted)}
.progress{height:5px;background:#eee4d9;border-radius:8px;overflow:hidden;margin-top:5px}.progress i{display:block;height:100%;background:var(--gold);border-radius:8px}.quickgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.quick{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 3px;text-align:center;font-size:8px}.statline{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--line)}.statline:last-child{border-bottom:0}.reportcard{display:grid;grid-template-columns:1fr auto;gap:4px;padding:7px 0;border-bottom:1px solid var(--line);font-size:9px}.owner-head,.seller-head{background:linear-gradient(145deg,#24130d,#4d2a1e);color:#fff;margin:8px 10px 0;border-radius:15px;padding:11px}.seller-head{margin:0;border-radius:0}.owner-head small{color:#d9c39d;font-size:7px}.owner-head b{font-size:11px}.product-visual{width:35px;height:35px;border-radius:10px;background:#f3e8dc;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.chart{height:120px;display:flex;align-items:end;gap:4px;padding:6px}.bar{flex:1;background:var(--gold);border-radius:5px 5px 2px 2px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.metricgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.product-img{height:130px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* =========================================================
   soYam cosmo — single-file Telegram Mini App prototype
   Frontend + local mock backend/data layer.
   Production: replace MockAPI methods with secure server APIs.
   ========================================================= */
function brandLogo(){return `<div class="brandmark" aria-label="soYam Cosmo logo"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#c9a45b" stroke-width="2"/><path d="M28 62C35 47 40 36 50 29C60 36 65 47 72 62" fill="none" stroke="#e6cf96" stroke-width="4" stroke-linecap="round"/><path d="M38 61C43 51 46 45 50 40C54 45 57 51 62 61" fill="none" stroke="#fff6dc" stroke-width="3" stroke-linecap="round"/><text x="50" y="78" text-anchor="middle" fill="#fff6dc" font-size="13" font-family="Georgia" font-weight="700">SY</text></svg></div>`}
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

const DB_KEY="soyam_cosmo_db_v1";
const SESSION_KEY="soyam_session_v1";
const seed={
 users:[
  {id:1,telegram_user_id:"999999999",telegram_username:"mama51R",first_name:"Rahel",phone:"+251920353460",roles:["OWNER","SELLER"],permissions:["*"],store_id:"STORE001",account_status:"ACTIVE"},
  {id:2,telegram_user_id:"987654321",telegram_username:"silencer01m",first_name:"Seller",phone:"+251948479301",roles:["BUYER"],permissions:["BUY"],store_id:"STORE001",account_status:"ACTIVE"},
  {id:3,telegram_user_id:"555555555",telegram_username:"driver01",first_name:"Driver",phone:"+251900000000",roles:["BUYER"],permissions:["BUY"],store_id:"STORE001",account_status:"ACTIVE"}
 ],
 stores:[{id:"STORE001",name:"SoYam Cosmo",address:"Betel Building, Ground Floor, Addis Ababa, Ethiopia",phone:"+251919096451"}],
 categories:["All","Skincare","Makeup","Fragrance","Haircare","Detergent"],
 products:[
  {id:"P001",name:"Luxury Face Cream",category:"Skincare",price:650,stock:24,emoji:"🧴",cost:390},
  {id:"P002",name:"Hydrating Lotion",category:"Skincare",price:500,stock:38,emoji:"🧴",cost:300},
  {id:"P003",name:"Beauty Soap",category:"Detergent",price:180,stock:76,emoji:"🧼",cost:90},
  {id:"P004",name:"Fresh Fragrance",category:"Fragrance",price:900,stock:15,emoji:"🌸",cost:540},
  {id:"P005",name:"Hair Care Oil",category:"Haircare",price:420,stock:31,emoji:"💧",cost:250},
  {id:"P006",name:"Premium Makeup",category:"Makeup",price:780,stock:12,emoji:"💄",cost:470}
 ],
 orders:[],transactions:[],requests:[],deliveries:[],invitations:[],audit:[],
 dailyLedger:{date:new Date().toISOString().slice(0,10),status:"OPEN",cash:0,bank:0,telebirr:0}
};
function loadDB(){try{return JSON.parse(localStorage.getItem(DB_KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
let db=loadDB();
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
const MockAPI={
 async login(){
  const tgUser=tg?.initDataUnsafe?.user || null;
  const telegramId=tgUser?.id?.toString() || "";
  const username=(tgUser?.username || localStorage.getItem("demoTelegramUsername") || "").replace(/^@/,"");
  const isOwner=username.toLowerCase()==="mama51r";
  let u=db.users.find(x=>x.telegram_user_id===telegramId || (x.telegram_username||"").toLowerCase()===username.toLowerCase());

  if(isOwner){
   if(!u){
    u={id:Date.now(),telegram_user_id:telegramId,telegram_username:"mama51R",first_name:tgUser?.first_name||"Owner",phone:"",roles:["OWNER","SELLER"],permissions:["*"],store_id:"STORE001",account_status:"ACTIVE"};
    db.users.push(u); saveDB();
   }else{
    u.telegram_username="mama51R";
    u.roles=["OWNER","SELLER"];
    u.permissions=["*"];
    u.account_status="ACTIVE";
    if(telegramId) u.telegram_user_id=telegramId;
    saveDB();
   }
   return u;
  }

  return {
   id:u?.id || Date.now(),
   telegram_user_id:telegramId || u?.telegram_user_id || "",
   telegram_username:username || tgUser?.username || "customer",
   first_name:tgUser?.first_name || u?.first_name || "Customer",
   phone:u?.phone || "",
   roles:["BUYER"],
   permissions:["BUY"],
   store_id:"STORE001",
   account_status:"ACTIVE"
  };
 },
 products:()=>db.products,
 saveProduct(p){db.products.push(p);saveDB();return p},
 addOrder(o){o.id="SOYAM-"+String(Date.now()).slice(-8);db.orders.push(o);saveDB();return o},
 addTransaction(t){db.transactions.push(t);saveDB();return t},
 audit(action,detail){db.audit.push({action,detail,at:new Date().toISOString()});saveDB()}
};

let state={user:null,portal:null,view:"home",category:"All",cart:[],search:""};

const money=n=>"ETB "+Number(n||0).toLocaleString("en-US");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function toast(m){let x=document.createElement("div");x.className="toast";x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function audit(a,d){MockAPI.audit(a,d)}

async function boot(){
 state.user=await MockAPI.login();
 if(state.user.account_status!=="ACTIVE"){renderRevoked();return}

 // @mama51R gets the opening portal switch menu.
 // Everyone else goes directly to Buyer Portal.
 const isOwner=(state.user.telegram_username||"").toLowerCase()==="mama51r";
 if(isOwner && state.user.roles.includes("OWNER")){
   renderPortalSelector();
 }else{
   state.portal="BUYER";
   state.view="home";
   render();
 }
}
function renderPortalSelector(){
 document.getElementById("root").innerHTML=`<div class="login"><div class="loginbox">
 ${brandLogo()}<h1>Welcome back, Owner</h1><p>How would you like to continue?</p>
 <div class="rolecards">
  <button class="rolecard" onclick="choosePortal('OWNER')"><strong>👑 Owner Portal</strong><span>Manage SoYam</span></button>
  <button class="rolecard" onclick="choosePortal('SELLER')"><strong>🏪 Seller Portal</strong><span>Manage your store</span></button>
 </div>
 <p class="muted" style="margin-top:16px">Authorized Telegram account: @${esc(state.user.telegram_username)}</p>
 </div></div>`;
}
function choosePortal(p){
 const isOwner=(state.user.telegram_username||"").toLowerCase()==="mama51r";
 if((p==="OWNER"||p==="SELLER")&&!isOwner){toast("Owner access only");state.portal="BUYER";state.view="home";render();return}
 if(p==="OWNER"&&!state.user.roles.includes("OWNER")){toast("Portal not authorized");return}
 if(p==="SELLER"&&!state.user.roles.includes("SELLER")){toast("Portal not authorized");return}
 state.portal=p;state.view="home";audit("PORTAL_SWITCHED",p);render()
}
function renderRevoked(){document.getElementById("root").innerHTML=`<div class="login"><div class="loginbox"><div style="font-size:50px">⛔</div><h2>Access Revoked</h2><p>Your access has been revoked by the Owner.</p><button class="primary full" onclick="demoBuyer()">Return to Storefront</button></div></div>`}
function demoBuyer(){localStorage.setItem("demoTelegramId","000000000");location.reload()}
function header(){
 return `<header class="hero">${brandLogo()}<h1>soYam cosmo</h1><h2>ሶያም ኮስሞΤΙΚΣ · COSMETICS & BEAUTY</h2><p>🇪🇹 Ethiopia · Addis Ababa · Betel Building, Ground Floor</p><p>+251 91 909 6451 · <a style="color:#e6c77d" href="https://www.google.com/maps/search/?api=1&query=Betel+Building+Addis+Ababa" target="_blank">📍 Location</a></p></header>
 <div class="langbar">${["EN","አማ","ትግ","ORO","GUR","SOM"].map((x,i)=>`<button class="${i===0?"active":""}" onclick="toast('${x} selected')">${x}</button>`).join("")}</div>
 <div class="social"><a href="https://www.tiktok.com/" target="_blank">TT</a><a href="https://www.facebook.com/" target="_blank">f</a><a href="https://wa.me/251919096451" target="_blank">WA</a></div>`;
}
function bottom(items){
 return `<nav class="bottom">${items.map(([id,icon,label])=>`<button class="${state.view===id?"active":""}" onclick="go('${id}')">${icon}<br>${label}</button>`).join("")}</nav>`;
}
function go(v){state.view=v;render()}
function render(){if(state.portal==="BUYER")renderBuyer();else if(state.portal==="SELLER")renderSeller();else if(state.portal==="DRIVER")renderDriver();else renderOwner()}
function productCard(p){
 const inCart=state.cart.find(x=>x.id===p.id)?.qty||0;
 return `<article class="card"><div class="product-img">${p.emoji}</div><div class="card-body">
 <div class="muted">${esc(p.category)}</div><h4>${esc(p.name)}</h4><div class="row"><span class="price">${money(p.price)}</span><span class="muted">${p.stock} in stock</span></div>
 <div class="qty"><button onclick="changeCart('${p.id}',-1)">−</button><b>${inCart}</b><button onclick="changeCart('${p.id}',1)">+</button><button class="primary" style="margin-left:auto;padding:8px 10px" onclick="changeCart('${p.id}',1)">Add</button></div>
 </div></article>`;
}
function renderBuyer(){
 let body="";
 if(state.view==="home"){body=`<div class="panel" style="margin-top:12px"><div class="row"><div><small class="muted">PREMIUM BEAUTY MARKETPLACE</small><h2 style="margin:4px 0">Everything Beauty. One Place.</h2></div><span style="font-size:28px">✦</span></div><div class="formgrid"><input class="input" placeholder="🔎 Search cosmetics, soaps, creams..." oninput="state.search=this.value;render()"></div></div><div class="promo"><small>WEEKLY PROMOTION</small><h3>New Arrivals This Week!</h3><span>Premium beauty essentials: detergents, soaps, creams & more.</span></div><div class="section"><div class="cats">${db.categories.map(c=>`<button class="${state.category===c?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("")}</div><div class="grid">${filteredProducts().map(productCard).join("")}</div></div>`}
 else if(state.view==="cart") body=buyerCart();
 else if(state.view==="orders") body=buyerOrders();
 else if(state.view==="requests") body=buyerRequests();
 else if(state.view==="profile") body=buyerProfile();
 document.getElementById("root").innerHTML=`<div class="app">${header()}<main class="view">${body}</main>${bottom([["home","⌂","Home"],["cart","🛒","Cart"],["orders","▣","Orders"],["requests","?","Requests"],["profile","●","Profile"]])}</div>`;
}
function filteredProducts(){return db.products.filter(p=>(state.category==="All"||p.category===state.category)&&(!state.search||p.name.toLowerCase().includes(state.search.toLowerCase())))}
function setCat(c){state.category=c;render()}
function changeCart(id,d){
 let p=db.products.find(x=>x.id===id), item=state.cart.find(x=>x.id===id);
 if(d>0 && (!item||item.qty<p.stock)){if(item)item.qty++;else state.cart.push({id,qty:1})}
 if(d<0&&item){item.qty--;if(item.qty<=0)state.cart=state.cart.filter(x=>x.id!==id)}
 render();toast(d>0?"Added to cart":"Cart updated")
}
function buyerCart(){
 let items=state.cart.map(x=>({...x,p:db.products.find(p=>p.id===x.id)}));let total=items.reduce((s,x)=>s+x.qty*x.p.price,0);
 return `<div class="panel"><h3>🛒 Your Cart</h3>${items.length?items.map(x=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${x.p.emoji} ${esc(x.p.name)} × ${x.qty}</span><b>${money(x.qty*x.p.price)}</b></div>`).join(""):`<p class="muted">Your cart is empty.</p>`}<div class="row" style="margin-top:14px"><b>Total</b><strong>${money(total)}</strong></div>${items.length?`<div class="actions"><button class="primary full" onclick="checkout()">Checkout</button></div>`:""}</div>`;
}
function checkout(){
 let items=state.cart.map(x=>({product_id:x.id,quantity:x.qty,unit_price:db.products.find(p=>p.id===x.id).price}));
 let total=items.reduce((s,x)=>s+x.quantity*x.unit_price,0);
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="checkoutModal"><div class="sheet"><h3>Checkout</h3><p>Choose fulfillment.</p><div class="actions"><button class="primary" onclick="placeOrder('IN_PERSON',${total})">🏬 In-Person</button><button class="gold" onclick="deliveryForm(${total})">🛵 Delivery</button></div><button class="full" style="margin-top:10px;padding:10px" onclick="closeModal()">Cancel</button></div></div>`);
}
function deliveryForm(total){
 document.querySelector(".sheet").innerHTML=`<h3>Delivery Details</h3><div class="formgrid"><input class="input" id="custName" placeholder="Full name"><input class="input" id="custPhone" placeholder="Phone number"><textarea class="input" id="dropoff" placeholder="Drop-off location"></textarea><input class="input" id="deliveryFee" type="number" placeholder="Delivery fee"></div><button class="primary full" style="margin-top:12px" onclick="submitDelivery(${total})">Request Delivery Quote</button>`;
}
function submitDelivery(total){
 let fee=Number(document.getElementById("deliveryFee").value||0), items=state.cart.map(x=>({product_id:x.id,quantity:x.qty,unit_price:db.products.find(p=>p.id===x.id).price}));
 let o=MockAPI.addOrder({buyer:state.user.telegram_user_id,buyer_name:document.getElementById("custName").value,buyer_phone:document.getElementById("custPhone").value,dropoff:document.getElementById("dropoff").value,items,total:total+fee,delivery_fee:fee,fulfillment:"DELIVERY",payment_status:"PENDING",status:"PENDING",created_at:new Date().toISOString()});
 state.cart=[];closeModal();audit("DELIVERY_REQUEST",o.id);toast("Delivery quote requested: "+o.id);state.view="orders";render();
}
function placeOrder(type,total){
 let items=state.cart.map(x=>({product_id:x.id,quantity:x.qty,unit_price:db.products.find(p=>p.id===x.id).price}));
 for(const x of items){let p=db.products.find(p=>p.id===x.product_id);if(p.stock<x.quantity){toast("Insufficient stock");return}p.stock-=x.quantity}
 let o=MockAPI.addOrder({buyer:state.user.telegram_user_id,items,total,fulfillment:type,payment_status:"PAID",status:"COMPLETED",created_at:new Date().toISOString()});
 MockAPI.addTransaction({order_id:o.id,type:"SALE",amount:total,status:"OWNER_PENDING",created_at:new Date().toISOString()});
 db.dailyLedger.cash+=total;saveDB();state.cart=[];closeModal();audit("SALE_COMPLETED",o.id);toast("Sale completed: "+o.id);state.view="orders";render();
}
function buyerOrders(){
 let os=db.orders.filter(o=>o.buyer===state.user.telegram_user_id);

function scanner(){
 return `<div class="panel"><h3>📷 Scan & Verify</h3>
 <div class="scan-mode">
  <button id="itemScanBtn" class="primary active" onclick="setScanMode('ITEM')">📦 Item QR / Barcode</button>
  <button id="orderScanBtn" class="primary" onclick="setScanMode('ORDER')">🧾 Customer Order QR</button>
 </div>
 <div class="scanner"><div><div class="frame"></div><p id="scanHint">Point camera at product QR / barcode</p><small>Camera hardware integration point</small></div></div>
 <input class="input" id="barcode" style="margin-top:10px" placeholder="Demo input: P001 or SOYAM-ORDER-ID">
 <button class="primary full" style="margin-top:10px" onclick="startPhoneScanner()">📷 Open Phone Camera</button><button class="gold full" style="margin-top:6px" onclick="lookupBarcode()">⌕ Lookup Code</button><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden onchange="handleCameraFile(event)">
 <div id="scanResult" class="scan-result"></div></div>`
}
let scanMode="ITEM";
function setScanMode(mode){
 scanMode=mode;
 document.getElementById("itemScanBtn").classList.toggle("active",mode==="ITEM");
 document.getElementById("orderScanBtn").classList.toggle("active",mode==="ORDER");
 document.getElementById("scanHint").textContent=mode==="ITEM"?"Point camera at product QR / barcode":"Point camera at customer's Order ID / QR";
 document.getElementById("barcode").placeholder=mode==="ITEM"?"Demo input: P001":"Demo input: SOYAM-ORDER-ID";
}
async function startPhoneScanner(){
 const input=document.getElementById("cameraInput");
 try{
  if(navigator.mediaDevices?.getUserMedia){const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});stream.getTracks().forEach(t=>t.stop());}
 }catch(e){}
 input?.click();
}
function handleCameraFile(e){if(e.target.files?.[0])toast("Camera image captured. QR/barcode decoding can be connected to a production decoder.");}

function lookupBarcode(){
 let code=document.getElementById("barcode").value.trim();
 if(scanMode==="ORDER"){
  let o=db.orders.find(x=>x.id===code);
  document.getElementById("scanResult").innerHTML=o?
   `<div class="panel"><h3>🧾 ${esc(o.id)}</h3><p><b>Order:</b> ${money(o.total)} · ${o.fulfillment}</p><p><b>Payment:</b> ${o.payment_status}</p><p><b>Status:</b> ${o.status}</p>
   <div class="actions">${o.payment_status==="SUBMITTED"?`<button class="primary" onclick="verifyPayment('${o.id}')">✓ Verify Payment</button>`:""}${o.fulfillment==="IN_PERSON"?`<button class="gold" onclick="confirmPickup('${o.id}')">Confirm Pickup</button>`:""}</div></div>`
   :`<div class="panel"><p>Order QR/ID not found in this store.</p></div>`;
  return;
 }
 let p=db.products.find(x=>x.id===code);
 document.getElementById("scanResult").innerHTML=p?
  `<div class="panel"><div class="row"><div><h3>${p.emoji} ${esc(p.name)}</h3><p>${p.category} · ${money(p.price)} · Stock ${p.stock}</p></div><div class="preview">${p.emoji}</div></div>
  <button class="primary full" onclick="addScannedItem('${p.id}')">Add to Checkout Basket</button></div>`
  :`<div class="panel"><p><b>External lookup required.</b></p><p class="muted">The documented production flow checks the internal catalog first; if no match exists, the backend calls an external retail barcode dictionary and injects product title, category and primary image into the registration form.</p><button class="gold" onclick="externalLookupDemo('${esc(code)}')">Run External Lookup Demo</button></div>`;
}

 let p={id:"P"+String(Date.now()).slice(-6),name,category:cat,price:Math.round(cost*1.67),stock:qty,emoji:"🧴",cost};

function showAuthorizedUser(){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="userModal"><div class="sheet"><h3>＋ Add Authorized User</h3><div class="formgrid"><input class="input" id="auId" placeholder="Telegram User ID"><input class="input" id="auUsername" placeholder="Telegram Username"><input class="input" id="auName" placeholder="Name"><input class="input" id="auPhone" placeholder="Phone"><select class="input" id="auRole"><option>SELLER</option><option>DRIVER</option></select><select class="input"><option>STORE001 — SoYam Cosmetics</option></select><button class="primary full" onclick="saveAuthorizedUser()">SAVE USER</button><button class="danger full" onclick="document.getElementById('userModal').remove()">DISCARD</button></div></div></div>`)}
function saveAuthorizedUser(){let u={id:Date.now(),telegram_user_id:document.getElementById('auId').value.trim(),telegram_username:document.getElementById('auUsername').value.trim().replace(/^@/,''),first_name:document.getElementById('auName').value.trim(),phone:document.getElementById('auPhone').value.trim(),roles:[document.getElementById('auRole').value],permissions:[document.getElementById('auRole').value==="SELLER"?"SELL":"DELIVERY"],store_id:"STORE001",account_status:"ACTIVE"};if(!u.telegram_user_id||!u.telegram_username){toast("Telegram ID and username required");return}db.users.push(u);saveDB();audit("AUTHORIZED_USER_ADDED",u.telegram_username);document.getElementById('userModal').remove();toast("Authorized user saved");render()}
function toggleUser(id){let u=db.users.find(x=>x.id===id);u.account_status=u.account_status==="ACTIVE"?"SUSPENDED":"ACTIVE";saveDB();audit("USER_STATUS_CHANGED",u.telegram_username);toast("User status changed");render()}
function createInvite(){let username=document.getElementById("inviteUser").value;let code="SOYAM-SELLER-"+Math.random().toString(36).slice(2,7).toUpperCase();db.invitations.push({code,username,status:"PENDING"});saveDB();audit("SELLER_INVITATION_CREATED",code);alert("Invitation: "+code);render()}
function ownerOrders(){return `<div class="panel"><h3>All Orders</h3><table class="table"><thead><tr><th>ID</th><th>Type</th><th>Total</th><th>Status</th></tr></thead><tbody>${db.orders.slice().reverse().map(o=>`<tr><td>${o.id}</td><td>${o.fulfillment}</td><td>${money(o.total)}</td><td>${o.status}</td></tr>`).join("")||"<tr><td colspan=4>No orders</td></tr>"}</tbody></table></div>`}
function ownerAudit(){return `<div class="panel"><h3>Daily Financial Audit</h3><div class="metricgrid"><div class="metric"><span class="muted">Cash</span><b>${money(db.dailyLedger.cash)}</b></div><div class="metric"><span class="muted">Bank</span><b>${money(db.dailyLedger.bank)}</b></div><div class="metric"><span class="muted">Telebirr</span><b>${money(db.dailyLedger.telebirr)}</b></div><div class="metric"><span class="muted">Ledger</span><b>${db.dailyLedger.status}</b></div></div><h4>Transactions</h4>${db.transactions.slice().reverse().map(t=>`<p><b>${t.order_id}</b> · ${money(t.amount)} · <span class="badge pending">${t.status}</span></p>`).join("")||"<p class='muted'>No transactions.</p>"}</div><div class="panel"><h3>Audit Log</h3>${db.audit.slice().reverse().slice(0,30).map(a=>`<p class="muted">${a.at} · <b>${a.action}</b> · ${esc(a.detail)}</p>`).join("")}</div>`}
function ownerReports(){let revenue=db.transactions.reduce((s,t)=>s+(t.type==="SALE"?t.amount:0),0);return `<div class="panel"><h3>Reports & Analytics</h3><div style="height:180px;display:flex;align-items:end;gap:10px">${[35,65,45,80,60,95,75].map((x,i)=>`<div style="flex:1;height:${x}%;background:#c9a45b;border-radius:8px 8px 0 0" title="Day ${i+1}"></div>`).join("")}</div><p><b>Revenue:</b> ${money(revenue)}</p><p class="muted">Production analytics can be connected to the backend reporting service.</p></div>`}
function ownerSettings(){return `<div class="panel"><h3>Platform Settings</h3><p>Store: SoYam Cosmo</p><p>Location: Betel Building, Ground Floor, Addis Ababa</p><p>Phone: +251919096451</p><p>Master Owner: @mama51R</p><button class="danger" onclick="if(confirm('Reset demo database?')){localStorage.removeItem(DB_KEY);location.reload()}">Reset Demo Data</button></div>`}
function closeDay(){if(db.dailyLedger.status==="CLOSED"){toast("Ledger already closed");return}if(confirm("Close and lock today's transactions?")){db.dailyLedger.status="CLOSED";saveDB();audit("DAILY_LEDGER_CLOSED",db.dailyLedger.date);toast("Daily transactions locked");render()}}
function closeModal(){document.getElementById("checkoutModal")?.remove()}
window.go=go;window.choosePortal=choosePortal;window.setCat=setCat;window.changeCart=changeCart;window.checkout=checkout;window.deliveryForm=deliveryForm;window.submitDelivery=submitDelivery;window.placeOrder=placeOrder;window.closeModal=closeModal;window.uploadProof=uploadProof;window.track=track;window.submitRequest=submitRequest;window.verifyPayment=verifyPayment;window.rejectPayment=rejectPayment;window.lookupBarcode=lookupBarcode;window.offerRequest=offerRequest;window.assignDriver=assignDriver;window.updateDelivery=updateDelivery;window.scanOrder=scanOrder;window.toggleUser=toggleUser;window.createInvite=createInvite;window.closeDay=closeDay;window.demoBuyer=demoBuyer;window.setScanMode=setScanMode;window.lookupBarcode=lookupBarcode;window.addScannedItem=addScannedItem;window.externalLookupDemo=externalLookupDemo;window.confirmPickup=confirmPickup;window.showAddStock=showAddStock;window.previewStockImage=previewStockImage;window.openStockScanner=openStockScanner;window.saveStock=saveStock;window.editStock=editStock;window.closeStockModal=closeStockModal;window.showAuthorizedUser=showAuthorizedUser;window.saveAuthorizedUser=saveAuthorizedUser;
boot();
</script>

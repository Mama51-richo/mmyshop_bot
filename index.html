<script>
// ============================================================
// CONFIGURATION

const OWNER_USERNAME = 'RAHM34';

// ============================================================

const ALLOWED_USERS = {

// ============================================================

const LANGUAGES = [

const TRANSLATIONS = {

    am:{nav_home:'መነሻ',nav_search:'ፈልግ',nav_orders:'ትዕዛዞች',nav_wishlist:'የተመረጡ',nav_profile:'መገለጫ'},
    om:{nav_home:'Mana',nav_search:'Barbaadi',nav_orders:'Ajajoota',nav_wishlist:'Waan Filatame',nav_profile:'Proofaayilii'},
    ti:{nav_home:'ቤት',nav_search:'ድለይ',nav_orders:'ትእዛዛት',nav_wishlist:'ተመሪጾም',nav_profile:'መገለጺ'},
    gu:{nav_home:'ቤት',nav_search:'ፈልግ',nav_orders:'ትእዛዝ',nav_wishlist:'ተመራጭ',nav_profile:'መገለጫ'}
};

// ============================================================

let currentLanguage = 'en';
let currentUser = {id:1, username:'Guest', role:'buyer'};
let notifications = [];

let wishlist = [];

let pendingOrder = null;
let isOwner = false;
let isSeller = false;
let stockHistory = [];
let dailySales = [];

// ============================================================
// PRODUCTS
// ============================================================
const products = [
    {id:1,name:'Amber Oud Perfume',price:'1,500 ETB',buyPrice:1200,stock:10,image:'https://images.unsplash.com/photo-1594035910387-fea4773a4610?w=200&h=200&fit=crop',category:'Fragrances',badge:'NEW',qrCode:'SOYAM-P001',stockId:'STK-001'},
    {id:2,name:'Rose Body Lotion',price:'800 ETB',buyPrice:600,stock:5,image:'https://images.unsplash.com/photo-1563453392212-326f5e854473?w=200&h=200&fit=crop',category:'Skincare',badge:'BEST',qrCode:'SOYAM-P002',stockId:'STK-002'},
    {id:3,name:'Face Serum',price:'1,200 ETB',buyPrice:900,stock:3,image:'https://images.unsplash.com/photo-1570194065650-d99fb4adec17?w=200&h=200&fit=crop',category:'Skincare',badge:'',qrCode:'SOYAM-P003',stockId:'STK-003'},
    {id:4,name:'Lipstick Set',price:'2,000 ETB',buyPrice:1500,stock:8,image:'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=200&h=200&fit=crop',category:'Makeup',badge:'NEW',qrCode:'SOYAM-P004',stockId:'STK-004'},
    {id:5,name:"Men's Grooming",price:'1,800 ETB',buyPrice:1300,stock:4,image:'https://images.unsplash.com/photo-1571875257727-256c39da42af?w=200&h=200&fit=crop',category:"Men's",badge:'',qrCode:'SOYAM-P005',stockId:'STK-005'},
    {id:6,name:'Baby Care Set',price:'1,200 ETB',buyPrice:850,stock:6,image:'https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?w=200&h=200&fit=crop',category:'Baby',badge:'LOW',qrCode:'SOYAM-P006',stockId:'STK-006'}
];

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ============================================================
// ROLE DETECTION — @mama51R can access both Owner & Seller
// ============================================================
function detectUserRole() {
    const username = tg.initDataUnsafe?.user?.username || '';
    const urlParams = new URLSearchParams(window.location.search);
    const roleParam = urlParams.get('role');

    // Check if user is allowed for owner (now includes mama51R)
    if (ALLOWED_USERS.owner.includes(username) || ALLOWED_USERS.owner.includes(username.toLowerCase())) {
        isOwner = true;
        isSeller = false;
        return 'owner';
    }
    // Check if user is allowed for seller
    if (ALLOWED_USERS.seller.includes(username) || ALLOWED_USERS.seller.includes(username.toLowerCase())) {
        isSeller = true;
        isOwner = false;
        return 'seller';
    }
    // URL override for testing
    if (roleParam === 'owner' && ALLOWED_USERS.owner.includes(username)) {
        isOwner = true; isSeller = false; return 'owner';
    }
    if (roleParam === 'seller' && ALLOWED_USERS.seller.includes(username)) {
        isSeller = true; isOwner = false; return 'seller';
    }

    isOwner = false;
    isSeller = false;
    return 'buyer';
}

// ============================================================
// UNIQUE ID GENERATOR
// ============================================================
function generateUniqueId(prefix) {
    const timestamp = Date.now().toString(36);
    const random = Math.random().toString(36).substring(2, 6);
    return prefix + '-' + timestamp + '-' + random;
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    const savedLang = localStorage.getItem('soyam_lang') || 'en';
    setLanguage(savedLang);

    const detectedRole = detectUserRole();
    currentUser.role = detectedRole;
    currentUser.username = tg.initDataUnsafe?.user?.username || 'Guest';

    updateRoleUI();

    if (tg.colorScheme === 'dark') {
        document.body.classList.add('dark-theme');
    }

    navigateTo('home');

    document.getElementById('languageBtn').addEventListener('click', function() {
        openModal('languageModal');
        renderLanguageList();
    });

    document.querySelectorAll('.modal').forEach(function(modal) {
        modal.addEventListener('click', function(e) {
            if (e.target === modal) modal.classList.remove('visible');
        });
    });

    addNotification('✨ Welcome to soYam Cosmo!', 'success');
    addNotification('👤 Role: ' + currentUser.role.toUpperCase(), 'info');

    // Sample orders
    orders.push({
        id: generateUniqueId('ORD'),
        product: 'Amber Oud Perfume',
        price: '1,500 ETB',
        status: 'pending',
        date: new Date().toISOString().split('T')[0],
        type: 'Reservation',
        timer: 21600,
        qrCode: 'SOYAM-P001',
        customer: 'Abebe K.',
        tracking: 'SOYAM-TRK-001'
    });
});

// ============================================================
// ROLE SWITCH — @mama51R can switch between Owner & Seller
// ============================================================
function openRoleSwitch() {
    const modal = document.getElementById('roleSwitchModal');
    const container = document.getElementById('roleSwitchList');
    
    const roles = [
        {role:'buyer', icon:'👤', name:'Buyer', desc:'Browse products, place orders, track deliveries'},
        {role:'seller', icon:'🛍️', name:'Seller', desc:'Manage orders, scan QR, process deliveries'},
        {role:'owner', icon:'👑', name:'Owner', desc:'Full control: payments, stock, analytics'}
    ];

    container.innerHTML = roles.map(r => `
        <div class="role-option ${currentUser.role === r.role ? 'active' : ''}" onclick="switchRole('${r.role}')">
            <span class="role-icon">${r.icon}</span>
            <div class="role-info">
                <div class="role-name">${r.name}</div>
                <div class="role-desc">${r.desc}</div>
            </div>
            ${currentUser.role === r.role ? '✅' : ''}
        </div>
    `).join('');

    openModal('roleSwitchModal');
}

function switchRole(role) {
    const username = tg.initDataUnsafe?.user?.username || '';
    
    // Check if user is allowed for this role
    if (role === 'owner' && !ALLOWED_USERS.owner.includes(username) && !ALLOWED_USERS.owner.includes(username.toLowerCase())) {
        showToast('⚠️ You are not authorized to access Owner portal', 'error');
        return;
    }
    if (role === 'seller' && !ALLOWED_USERS.seller.includes(username) && !ALLOWED_USERS.seller.includes(username.toLowerCase())) {
        showToast('⚠️ You are not authorized to access Seller portal', 'error');
        return;
    }

    currentUser.role = role;
    isOwner = (role === 'owner');
    isSeller = (role === 'seller');
    updateRoleUI();
    closeModal('roleSwitchModal');
    showToast('👤 Switched to ' + role.charAt(0).toUpperCase() + role.slice(1), 'success');
    navigateTo('home');
}

// ============================================================
// UPDATE ROLE UI
// ============================================================
function updateRoleUI() {
    const labels = { buyer: 'Buyer', seller: 'Seller', owner: 'Owner' };
    const dots = { buyer: 'buyer', seller: 'seller', owner: 'owner' };
    document.getElementById('roleLabelHeader').textContent = labels[currentUser.role] || 'Buyer';
    document.getElementById('roleDot').className = 'role-dot ' + (dots[currentUser.role] || 'buyer');
}

// ============================================================
// LANGUAGE
// ============================================================
function setLanguage(code) {
    currentLanguage = code;
    localStorage.setItem('soyam_lang', code);
    const langData = LANGUAGES.find(l => l.code === code);
    if (langData) {
        document.getElementById('currentFlag').textContent = langData.flag;
        document.getElementById('currentLang').textContent = langData.name.substring(0, 2).toUpperCase();
    }
    document.querySelectorAll('[data-key]').forEach(function(el) {
        const key = el.dataset.key;
        if (TRANSLATIONS[code] && TRANSLATIONS[code][key]) {
            el.textContent = TRANSLATIONS[code][key];
        }
    });
}

function selectLanguage(code) {
    setLanguage(code);
    closeModal('languageModal');
    showToast('🌍 Language: ' + LANGUAGES.find(l => l.code === code).name, 'success');
    const currentPage = document.querySelector('.nav-item.active');
    if (currentPage) navigateTo(currentPage.dataset.page);
}

function renderLanguageList() {
    const container = document.getElementById('languageList');
    container.innerHTML = LANGUAGES.map(function(lang) {
        return `
            <div class="lang-item" onclick="selectLanguage('${lang.code}')">
                <span class="lang-flag">${lang.flag}</span>
                <div>
                    <div class="lang-name">${lang.name}</div>
                    <div class="lang-native">${lang.code.toUpperCase()}</div>
                </div>
                ${currentLanguage === lang.code ? '<span class="lang-check">✅</span>' : ''}
            </div>
        `;
    }).join('');
}

// ============================================================
// NAVIGATION
// ============================================================
function navigateTo(pageName) {
    document.querySelectorAll('.nav-item').forEach(function(item) {
        item.classList.toggle('active', item.dataset.page === pageName);
    });
    const container = document.getElementById('page-container');
    container.querySelectorAll('.page').forEach(function(p) { p.remove(); });
    const page = document.createElement('div');
    page.className = 'page active';
    page.id = 'page-' + pageName;

    if (pageName === 'seller' && currentUser.role !== 'seller' && currentUser.role !== 'owner') {
        page.innerHTML = renderAccessDenied('Seller Dashboard', 'Only sellers can access this page.');
    } else if (pageName === 'admin' && currentUser.role !== 'owner') {
        page.innerHTML = renderAccessDenied('Owner Dashboard', 'Only the owner can access this page.');
    } else {
        switch (pageName) {
            case 'home': page.innerHTML = renderHome(); break;
            case 'search': page.innerHTML = renderSearch(); break;
            case 'orders': page.innerHTML = renderOrders(); break;
            case 'wishlist': page.innerHTML = renderWishlist(); break;
            case 'profile': page.innerHTML = renderProfile(); break;
            default: page.innerHTML = '<p>Page not found</p>';
        }
    }

    container.appendChild(page);
    document.querySelectorAll('[data-key]').forEach(function(el) {
        const key = el.dataset.key;
        if (TRANSLATIONS[currentLanguage] && TRANSLATIONS[currentLanguage][key]) {
            el.textContent = TRANSLATIONS[currentLanguage][key];
        }
    });
}

function renderAccessDenied(title, message) {
    return `
        <div class="access-denied">
            <div class="icon">🚫</div>
            <h3>${title}</h3>
            <p>${message}</p>
            <button class="btn-primary" style="margin-top:10px;width:auto;padding:6px 16px;font-size:11px;" onclick="navigateTo('home')">🏠 Go Home</button>
        </div>
    `;
}

    `;

    if (currentUser.role === 'owner') {
        html += renderOwnerPanel();
    } else if (currentUser.role === 'seller') {
        html += renderSellerPanel();
    } else {
        // Buyer portal
        html += `
            <div class="category-scroll">
                ${categories.map(cat => `<button class="category-chip" onclick="filterCategory('${cat}')">${cat}</button>`).join('')}
                <button class="category-chip active" onclick="filterCategory('all')">✨ All</button>

            <div class="section-header">
                <div class="section-title">✨ <span class="highlight">Products</span></div>
            </div>
            <div class="product-grid" id="allProducts">
                ${products.slice(0, 6).map(p => renderProductCard(p)).join('')}
            </div>
            <div style="margin-top:12px;padding:12px;background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-color);">

function renderProductCard(p) {
    const stockClass = p.stock > 5 ? 'stock-in' : p.stock > 0 ? 'stock-low' : 'stock-out';
    const stockText = p.stock > 5 ? 'In Stock' : p.stock > 0 ? 'Low' : 'Out';
    const badgeHtml = p.badge ? `<span class="product-badge badge-${p.badge.toLowerCase()}">${p.badge}</span>` : '';
    return `
        <div class="product-card">
            <div class="image-wrapper" onclick="openProductBuyer(${p.id})">
                <img src="${p.image}" alt="${p.name}" class="product-image" loading="lazy" />
                ${badgeHtml}
            </div>
            <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="product-price">${p.price}</div>
                <div class="product-stock ${stockClass}">${stockText} (${p.stock})</div>
                <div class="product-quick-actions">
                    <button class="btn-scan-order" onclick="openProductBuyer(${p.id})">📷 Order</button>
                    <button class="btn-wish" onclick="addToWishlist(${p.id})">❤️</button>
                </div>
            </div>
        </div>
    `;
}

// ============================================================
// BUYER PRODUCT CLICK - Auto proceed to order
// ============================================================
function openProductBuyer(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;
    if (product.stock <= 0) {
        showToast('❌ Out of stock!', 'error');
        return;
    }
    startOrderWorkflow(id);
}

// ============================================================
// ORDER WORKFLOW
// ============================================================
function startOrderWorkflow(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    if (product.stock <= 0) {
        showToast('❌ Out of stock!', 'error');
        return;
    }
    
    pendingOrder = { 
        product: product, 
        step: 1,
        deliveryType: 'reservation',
        paymentMethod: 'telebirr',
        deliveryCost: 0,
        totalPrice: product.price
    };
    openModal('orderWorkflowModal');
    renderWorkflowStep();
}

function renderWorkflowStep() {
    if (!pendingOrder) return;
    const container = document.getElementById('workflowContent');
    const step = pendingOrder.step;
    const product = pendingOrder.product;

    const steps = ['Select', 'Delivery', 'Pay', 'Confirm'];
    let stepHtml = `
        <div class="workflow-steps">
            ${steps.map((s, i) => `
                <div class="workflow-step ${i + 1 < step ? 'done' : i + 1 === step ? 'active' : ''}">
                    <div class="step-circle">${i + 1}</div>
                    <div class="step-label">${s}</div>
                </div>
            `).join('')}
        </div>
    `;

    let contentHtml = '';
    switch (step) {
        case 1:
            contentHtml = `
                <div style="text-align:center;">
                    <img src="${product.image}" style="width:100px;height:100px;border-radius:12px;object-fit:cover;margin-bottom:6px;" />
                    <h3 style="font-size:16px;">${product.name}</h3>
                    <p style="font-size:18px;font-weight:700;color:var(--primary);">${product.price}</p>
                    <p style="font-size:11px;color:var(--warm-gray);">Stock: ${product.stock} available</p>
                    <button class="btn-primary" style="margin-top:10px;font-size:12px;padding:8px;" onclick="pendingOrder.step=2;renderWorkflowStep();">Continue →</button>
                </div>
            `;
            break;
        case 2:
            contentHtml = `
                <div style="padding:4px 0;">
                    <p style="font-weight:600;font-size:13px;margin-bottom:6px;">Select Delivery Type</p>
                    <div class="delivery-option">
                        <button class="${pendingOrder.deliveryType === 'reservation' ? 'active' : ''}" onclick="setDeliveryType('reservation')">🏪 In-Person<br><small>Pickup at store</small></button>
                        <button class="${pendingOrder.deliveryType === 'delivery' ? 'active' : ''}" onclick="setDeliveryType('delivery')">🚚 Delivery<br><small>Door to door</small></button>
                    </div>
                    
                    ${pendingOrder.deliveryType === 'delivery' ? `
                        <p style="font-size:11px;color:var(--warm-gray);margin:6px 0;">📍 Delivery fee: <strong>200 ETB</strong></p>
                    ` : `
                        <p style="font-size:11px;color:var(--warm-gray);margin:6px 0;">⏱️ Reservation: 6-hour hold</p>
                    `}
                    
                    <p style="font-weight:600;font-size:13px;margin:12px 0 6px;">Total: <span style="font-size:22px;font-weight:700;color:var(--primary);">${pendingOrder.totalPrice}</span></p>
                    
                    <button class="btn-primary" style="margin-top:10px;font-size:12px;padding:8px;" onclick="pendingOrder.step=3;renderWorkflowStep();">Continue to Payment →</button>
                </div>
            `;
            break;
        case 3:
            contentHtml = `
                <div style="padding:4px 0;">
                    <p style="font-weight:600;font-size:13px;margin-bottom:6px;">💳 Select Payment Method</p>
                    <div class="payment-method">
                        <button class="${pendingOrder.paymentMethod === 'telebirr' ? 'active' : ''}" onclick="setPaymentMethod('telebirr')">📱 Telebirr</button>
                        <button class="${pendingOrder.paymentMethod === 'cbe' ? 'active' : ''}" onclick="setPaymentMethod('cbe')">🏦 CBE</button>
                        <button class="${pendingOrder.paymentMethod === 'cash' ? 'active' : ''}" onclick="setPaymentMethod('cash')">💰 Cash</button>
                    </div>
                    
                    <div style="background:var(--bg-primary);border-radius:var(--radius-sm);padding:12px;margin:8px 0;">
                        <p style="font-size:11px;color:var(--warm-gray);">📱 Telebirr: +${OWNER_PHONE}</p>
                        <p style="font-size:11px;color:var(--warm-gray);">🏦 CBE: 1000123456789</p>
                    </div>
                    
                    <label style="font-weight:600;font-size:11px;display:block;margin-top:8px;">Enter Payment Reference *</label>
                    <div class="payment-ref-input">
                        <input type="text" id="paymentRefInput" placeholder="e.g. TBR-12345" />
                        <button onclick="submitPaymentReference()">Submit</button>
                    </div>
                    <button class="btn-secondary" style="margin-top:4px;font-size:10px;padding:4px;" onclick="pendingOrder.step=2;renderWorkflowStep();">← Back</button>
                </div>
            `;
            break;
        case 4:
            const orderId = pendingOrder.orderId || 'PENDING';
            contentHtml = `
                <div style="text-align:center;padding:4px 0;">
                    <div style="font-size:48px;margin-bottom:4px;">✅</div>
                    <h3 style="font-size:16px;">Order Placed!</h3>
                    <p style="font-size:11px;color:var(--warm-gray);">Your order has been submitted successfully.</p>
                    <div style="background:var(--bg-primary);border-radius:var(--radius-sm);padding:10px;margin:8px 0;text-align:left;font-size:11px;">
                        <p><strong>Product:</strong> ${product.name}</p>
                        <p><strong>Price:</strong> ${pendingOrder.totalPrice}</p>
                        <p><strong>Delivery:</strong> ${pendingOrder.deliveryType === 'reservation' ? 'In-Person Pickup' : 'Delivery'}</p>
                        <p><strong>🆔 Order ID:</strong> ${orderId}</p>
                        ${pendingOrder.deliveryType === 'delivery' ? `<p><strong>📦 Tracking:</strong> ${pendingOrder.tracking || 'SOYAM-' + String(Math.floor(1000+Math.random()*9000))}</p>` : ''}
                    </div>
                    <button class="btn-primary" onclick="closeOrderWorkflow();navigateTo('orders');" style="font-size:12px;padding:8px;">📦 View Orders</button>
                </div>
            `;
            break;
    }

    container.innerHTML = stepHtml + contentHtml;
    document.getElementById('workflowTitle').textContent = '🛒 ' + (step === 4 ? 'Order Confirmed' : 'Place Order');
}

function setDeliveryType(type) {
    pendingOrder.deliveryType = type;
    if (type === 'delivery') {
        pendingOrder.deliveryCost = 200;
        const priceNum = parseInt(pendingOrder.product.price.replace(/[^0-9]/g, ''));
        pendingOrder.totalPrice = (priceNum + 200).toLocaleString() + ' ETB';
    } else {
        pendingOrder.deliveryCost = 0;
        pendingOrder.totalPrice = pendingOrder.product.price;
    }
    renderWorkflowStep();
}

function setPaymentMethod(method) {
    pendingOrder.paymentMethod = method;
    renderWorkflowStep();
}

function submitPaymentReference() {
    const ref = document.getElementById('paymentRefInput').value.trim();
    if (!ref) {
        showToast('⚠️ Please enter payment reference', 'error');
        return;
    }
    
    const orderId = generateUniqueId('ORD');
    pendingOrder.orderId = orderId;
    pendingOrder.paymentRef = ref;
    pendingOrder.step = 4;
    pendingOrder.tracking = 'SOYAM-' + String(Math.floor(1000 + Math.random() * 9000));

    const product = pendingOrder.product;
    const newOrder = {
        id: orderId,
        product: product.name,
        price: pendingOrder.totalPrice,
        status: 'waiting-payment',
        date: new Date().toISOString().split('T')[0],
        type: pendingOrder.deliveryType === 'reservation' ? 'Reservation' : 'Delivery',
        tracking: pendingOrder.tracking,
        qrCode: product.qrCode,
        paymentRef: ref,
        customer: currentUser.username || 'Customer',
        deliveryType: pendingOrder.deliveryType,
        completionCode: generateUniqueId('COMP')
    };
    orders.unshift(newOrder);

    addNotification('💰 Payment pending: ' + product.name + ' (🆔 ' + orderId + ')', 'warning');
    addNotification('📦 New order: ' + product.name + ' (🆔 ' + orderId + ')', 'info');
    addCustomerRequest(product.name, currentUser.username || 'Customer', 'Order #' + orderId + ' | Ref: ' + ref, product.qrCode);

    renderWorkflowStep();
    showToast('✅ Order placed! (🆔 ' + orderId + ')', 'success');
}

function closeOrderWorkflow() {
    pendingOrder = null;
    closeModal('orderWorkflowModal');
}

// SELLER ACTIONS
// ============================================================
function sellerConfirmPayment(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (order) {
        order.status = 'approved';
        const product = products.find(p => p.name === order.product);
        if (product && product.stock > 0) {
            product.stock--;
            const priceNum = parseInt(order.price.replace(/[^0-9]/g, ''));
            dailySales.push({
                date: new Date().toISOString().split('T')[0],
                product: order.product,
                sellPrice: priceNum,
                buyPrice: product.buyPrice || 0,
                profit: priceNum - (product.buyPrice || 0)
            });
        }
        showToast('✅ Payment confirmed for ' + order.product, 'success');
        addNotification('💰 Payment confirmed: ' + order.product + ' (🆔 ' + orderId + ')', 'success');
        navigateTo('home');
    }
}

function sellerStartDelivery(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (order) {
        order.status = 'delivering';
        showToast('🚚 Delivery started for ' + order.product, 'success');
        addNotification('🚚 Delivery started: ' + order.product + ' (🆔 ' + orderId + ')', 'info');
        navigateTo('home');
    }
}

function sellerCompleteDelivery(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (order) {
        order.status = 'delivered';
        showToast('✅ Delivery completed for ' + order.product, 'success');
        addNotification('✅ Delivery completed: ' + order.product + ' (🆔 ' + orderId + ')', 'success');
        navigateTo('home');
    }
}

function addProductManually() {
    const name = prompt('📦 Enter product name:');
    if (!name) return;
    const price = prompt('💰 Enter selling price (ETB):');
    if (!price) return;
    const buyPrice = prompt('💰 Enter buying price (ETB):');
    if (!buyPrice) return;
    const stock = prompt('📦 Enter initial stock quantity:');
    if (!stock) return;

    const newProduct = {
        id: products.length + 1,
        name: name,
        price: price + ' ETB',
        buyPrice: parseInt(buyPrice),
        stock: parseInt(stock),
        image: 'https://images.unsplash.com/photo-1594035910387-fea4773a4610?w=200&h=200&fit=crop',
        category: 'Other',
        badge: 'NEW',
        qrCode: 'SOYAM-P' + String(products.length + 1).padStart(3, '0'),
        stockId: 'STK-' + String(products.length + 1).padStart(3, '0')
    };
    products.push(newProduct);
    showToast('✅ Product added: ' + name, 'success');
    addNotification('📦 New product added: ' + name, 'success');
    navigateTo('home');
}

function removeProduct() {
    const names = products.map((p, i) => (i+1) + '. ' + p.name).join('\n');
    const choice = prompt('📦 Select product to remove:\n' + names + '\n\nEnter number:');
    if (!choice) return;
    const index = parseInt(choice) - 1;
    if (index >= 0 && index < products.length) {
        const removed = products.splice(index, 1)[0];
        showToast('❌ Removed: ' + removed.name, 'error');
        addNotification('❌ Product removed: ' + removed.name, 'error');
        navigateTo('home');
    } else {
        showToast('❌ Invalid selection', 'error');
    }
}

    const order = orders.find(o => o.id === orderId);
    if (order) {
        order.status = 'cancelled';
        showToast('❌ Payment rejected for ' + order.product, 'error');
        addNotification('❌ Payment rejected: ' + order.product + ' (🆔 ' + orderId + ')', 'error');
        navigateTo('home');
    }
}

// QR SCANNERS
// ============================================================
function openRealScanner() {
    const scanner = document.getElementById('qrScanner');
    scanner.classList.remove('hidden');
    const video = document.getElementById('qrVideo');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                setTimeout(function() {
                    const scannedQR = 'SOYAM-P001';
                    handleQRScanned(scannedQR);
                    closeScanner();
                }, 2500);
            })
            .catch(function(err) {
                showToast('❌ Camera access denied.', 'error');
                closeScanner();
            });
    } else {
        showToast('❌ Camera not supported.', 'error');
        closeScanner();
    }
}

function handleQRScanned(qrData) {
    const product = products.find(p => p.qrCode === qrData);
    if (product) {
        showToast('✅ Product found: ' + product.name + ' | ' + product.price, 'success');
        if (pendingOrder) {
            pendingOrder.product = product;
            pendingOrder.step = 3;
            renderWorkflowStep();
        }
        addNotification('📷 QR Scanned: ' + product.name + ' (🆔 ' + product.qrCode + ')', 'info');
    } else {
        showToast('❌ Product not found for QR: ' + qrData, 'error');
    }
}

function openGallery() {
    document.getElementById('galleryInput').click();
}

function handleGalleryImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    showToast('📷 Image uploaded! Analyzing...', 'info');
    setTimeout(function() {
        const randomProduct = products[Math.floor(Math.random() * products.length)];
        handleQRScanned(randomProduct.qrCode);
        closeScanner();
    }, 1500);
    event.target.value = '';
}

function closeScanner() {
    document.getElementById('qrScanner').classList.add('hidden');
    const video = document.getElementById('qrVideo');
    if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
    }
}

// ============================================================
// SELLER QR SCANNER - Sell product
// ============================================================
function openSellerQRScanner() {
    const scanner = document.getElementById('qrScanner');
    scanner.classList.remove('hidden');

    const video = document.getElementById('qrVideo');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                setTimeout(function() {
                    const scannedQR = 'SOYAM-P001';
                    const product = products.find(p => p.qrCode === scannedQR);
                    if (product) {
                        if (product.stock <= 0) {
                            showToast('❌ Product out of stock!', 'error');
                            closeScanner();
                            return;
                        }
                        const confirmSale = confirm('🛒 Sell: ' + product.name + '\nPrice: ' + product.price + '\nStock: ' + product.stock + '\n\nConfirm sale?');
                        if (confirmSale) {
                            product.stock--;
                            const priceNum = parseInt(product.price.replace(/[^0-9]/g, ''));
                            dailySales.push({
                                date: new Date().toISOString().split('T')[0],
                                product: product.name,
                                sellPrice: priceNum,
                                buyPrice: product.buyPrice || 0,
                                profit: priceNum - (product.buyPrice || 0)
                            });
                            const orderId = generateUniqueId('ORD');
                            orders.push({
                                id: orderId,
                                product: product.name,
                                price: product.price,
                                status: 'delivered',
                                date: new Date().toISOString().split('T')[0],
                                type: 'In-Store Sale',
                                qrCode: product.qrCode,
                                customer: 'Walk-in Customer'
                            });
                            showToast('✅ Sold: ' + product.name, 'success');
                            addNotification('🛒 In-store sale: ' + product.name + ' (🆔 ' + orderId + ')', 'success');
                        }
                    }
                    closeScanner();
                }, 3000);
            })
            .catch(function(err) {
                showToast('❌ Camera access denied.', 'error');
                closeScanner();
            });
    } else {
        showToast('❌ Camera not supported.', 'error');
        closeScanner();
    }
}

// ============================================================
// OWNER QR SCANNER - Register stock with QR
// ============================================================
function openOwnerQRScanner() {
    const scanner = document.getElementById('qrScanner');
    scanner.classList.remove('hidden');

    const video = document.getElementById('qrVideo');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                setTimeout(function() {
                    const scannedQR = 'SOYAM-P001';
                    const product = products.find(p => p.qrCode === scannedQR);
                    if (product) {
                        const buyPrice = parseInt(prompt('💰 Enter buying price for: ' + product.name +
                            '\nCurrent selling price: ' + product.price +
                            '\nEnter buy price (ETB):'));
                        if (buyPrice > 0) {
                            product.buyPrice = buyPrice;
                            const stockToAdd = parseInt(prompt('📦 Enter quantity to add:'));
                            if (stockToAdd > 0) {
                                product.stock += stockToAdd;
                                stockHistory.push({
                                    stockId: generateUniqueId('STK'),
                                    product: product.name,
                                    buyPrice: buyPrice,
                                    quantity: stockToAdd,
                                    date: new Date().toISOString().split('T')[0],
                                    totalCost: buyPrice * stockToAdd
                                });
                                showToast('✅ Stock updated: ' + product.name + ' (Buy: ' + buyPrice +
                                    ' ETB, +' + stockToAdd + ')', 'success');
                                addNotification('📦 Stock registered: ' + product.name + ' (Buy: ' +
                                    buyPrice + ' ETB, +' + stockToAdd + ')', 'success');
                            }
                        }
                    } else {
                        const name = prompt('📦 New product detected! Enter product name:');
                        if (name) {
                            const price = prompt('💰 Enter selling price (ETB):');
                            if (price) {
                                const buyPrice = prompt('💰 Enter buying price (ETB):');
                                if (buyPrice) {
                                    const stock = prompt('📦 Enter quantity:');
                                    if (stock) {
                                        const newProduct = {
                                            id: products.length + 1,
                                            name: name,
                                            price: price + ' ETB',
                                            buyPrice: parseInt(buyPrice),
                                            stock: parseInt(stock),
                                            image: 'https://images.unsplash.com/photo-1594035910387-fea4773a4610?w=200&h=200&fit=crop',
                                            category: 'Other',
                                            badge: 'NEW',
                                            qrCode: 'SOYAM-P' + String(products.length + 1).padStart(3, '0'),
                                            stockId: 'STK-' + String(products.length + 1).padStart(3, '0')
                                        };
                                        products.push(newProduct);
                                        showToast('✅ New product added: ' + name, 'success');
                                        addNotification('📦 New product registered via QR: ' + name, 'success');
                                    }
                                }
                            }
                        }
                    }
                    closeScanner();
                }, 3000);
            })
            .catch(function(err) {
                showToast('❌ Camera access denied.', 'error');
                closeScanner();
            });
    } else {
        showToast('❌ Camera not supported.', 'error');
        closeScanner();
    }
}

function renderSearch() {
    return `
        <div style="position:sticky;top:0;background:var(--bg-primary);padding:4px 0 10px;z-index:10;">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search products..." oninput="performSearch(this.value)" />
        </div>
        <div id="searchResults">
            <div class="empty-state"><div class="empty-icon">🔍</div><h3>Search Products</h3><p>Find your perfect beauty match ✨</p></div>
        </div>
    `;
}

function performSearch(query) {
    const container = document.getElementById('searchResults');
    if (!query.trim()) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><h3>Search Products</h3><p>Find your perfect beauty match ✨</p></div>`;
        return;
    }
    const results = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()) || p.category.toLowerCase().includes(query.toLowerCase()));
    if (results.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">😕</div><h3>No results found</h3><p>Try a different search term</p></div>`;
        return;
    }
    container.innerHTML = `<h3 style="margin:6px 0;font-size:13px;">${results.length} results found</h3><div class="product-grid">${results.slice(0,6).map(p => renderProductCard(p)).join('')}</div>`;
}

// ============================================================
// ORDERS
// ============================================================
function renderOrders() {

    }
    const statusMap = { pending:'status-pending', approved:'status-approved', delivering:'status-delivering', delivered:'status-delivered', cancelled:'status-cancelled', 'waiting-payment':'status-waiting-payment' };
    const statusLabels = { pending:'⏳ Pending', approved:'✅ Approved', delivering:'🚚 Delivering', delivered:'✅ Delivered', cancelled:'❌ Cancelled', 'waiting-payment':'💳 Waiting Payment' };
    return `
        <div class="section-header"><div class="section-title">📦 <span class="highlight">My Orders</span></div></div>
        <div style="display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px;">

            <button class="category-chip" onclick="filterOrders('waiting-payment')">💳 Payment</button>
            <button class="category-chip" onclick="filterOrders('pending')">⏳ Pending</button>
            <button class="category-chip" onclick="filterOrders('delivering')">🚚 Delivering</button>
            <button class="category-chip" onclick="filterOrders('delivered')">✅ Delivered</button>
        </div>
        <div id="ordersList">
            ${orders.map(o => `
                <div class="order-card" style="border-left-color:${o.status === 'waiting-payment' ? '#FF6F00' : o.status === 'delivered' ? '#2E7D32' : 'var(--primary)'};">
                    <div class="order-top">
                        <div>
                            <div class="order-product">${o.product}</div>
                            <div class="order-meta">${o.type} • ${o.date} • 🆔 ${o.id}</div>
                            ${o.tracking ? `<div class="order-meta" style="font-size:9px;">📦 ${o.tracking}</div>` : ''}
                            ${o.completionCode ? `<div class="order-meta" style="font-size:9px;color:var(--primary);">🔑 ${o.completionCode}</div>` : ''}
                        </div>
                        <span class="status-badge ${statusMap[o.status] || 'status-pending'}">${statusLabels[o.status] || o.status}</span>
                    </div>
                    <div class="order-price">${o.price}</div>
                    ${o.status === 'delivering' ? `
                        <div class="tracking-status">
                            <div class="status-item"><div class="circle done"></div><span class="label done">Order</span></div>
                            <div class="status-item"><div class="circle done"></div><span class="label done">Payment</span></div>
                            <div class="status-item"><div class="circle active"></div><span class="label active">Delivery</span></div>
                            <div class="status-item"><div class="circle"></div><span class="label">Received</span></div>
                        </div>
                    ` : o.status === 'delivered' ? `
                        <div class="tracking-status">
                            <div class="status-item"><div class="circle done"></div><span class="label done">Order</span></div>
                            <div class="status-item"><div class="circle done"></div><span class="label done">Payment</span></div>
                            <div class="status-item"><div class="circle done"></div><span class="label done">Delivery</span></div>
                            <div class="status-item"><div class="circle done"></div><span class="label done">Received ✅</span></div>
                        </div>
                    ` : `
                        <div class="tracking-status">
                            <div class="status-item"><div class="circle done"></div><span class="label done">Order</span></div>
                            <div class="status-item"><div class="circle ${o.status === 'waiting-payment' ? 'active' : 'done'}"></div><span class="label ${o.status === 'waiting-payment' ? 'active' : 'done'}">Payment</span></div>
                            <div class="status-item"><div class="circle"></div><span class="label">Delivery</span></div>
                            <div class="status-item"><div class="circle"></div><span class="label">Received</span></div>
                        </div>
                    `}
                    <div class="order-actions">
                        ${o.status === 'waiting-payment' ? `<button class="btn-success" onclick="showToast('✅ Payment confirmed!', 'success')">Confirm</button>` : ''}
                        ${o.status === 'delivering' ? `<button class="btn-success" onclick="confirmDelivery('${o.id}')">✅ Confirm Received</button>` : ''}
                        ${o.status === 'delivered' ? `<button class="btn-secondary" style="padding:3px 10px;font-size:9px;" onclick="showToast('📦 Order completed!', 'info')">📦 Completed</button>` : ''}
                        ${o.tracking ? `<button class="btn-secondary" style="padding:3px 10px;font-size:9px;" onclick="showToast('📍 ${o.tracking}', 'info')">📍 Track</button>` : ''}
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

function filterOrders(status) {
    const items = document.querySelectorAll('#ordersList > .order-card');
    items.forEach(item => {
        const badge = item.querySelector('.status-badge');
        if (status === 'all' || (badge && badge.textContent.includes(status))) {
            item.style.display = 'block';
        } else {
            item.style.display = 'none';
        }
    });
    showToast('📋 Filtered: ' + status, 'info');
}

function confirmDelivery(orderId) {
    const order = orders.find(o => o.id === orderId);
    if (order) {
        order.status = 'delivered';
        showToast('✅ Delivery confirmed! Order completed.', 'success');
        addNotification('✅ Delivery confirmed: ' + order.product + ' (🆔 ' + orderId + ')', 'success');
        navigateTo('orders');
    }
}

// WISHLIST
// ============================================================
function renderWishlist() {
    if (wishlist.length === 0) {
        return `<div class="section-header"><div class="section-title">❤️ <span class="highlight">Wishlist</span></div></div><div class="empty-state"><div class="empty-icon">❤️</div><h3>Your wishlist is empty.</h3></div>`;
    }
    return `<div class="section-header"><div class="section-title">❤️ <span class="highlight">Wishlist</span></div></div><div class="product-grid">${wishlist.slice(0,6).map(p => renderProductCard(p)).join('')}</div>`;
}

function addToWishlist(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    if (wishlist.find(p => p.id === productId)) {
        showToast('❤️ Already in wishlist!', 'info');
        return;
    }
    wishlist.push(product);
    showToast('❤️ Added to wishlist!', 'success');
    addNotification('❤️ Wishlist: ' + product.name, 'info');
}

// ============================================================
function addCustomerRequest(product, customer, detail, qrCode) {
    const reqId = generateUniqueId('REQ');
    customerRequests.unshift({
        id: reqId,
        product: product,
        customer: customer,
        detail: detail,
        qrCode: qrCode,
        time: new Date().toLocaleTimeString(),
        read: false
    });
    addNotification('📝 New request: ' + product + ' from ' + customer + ' (🆔 ' + reqId + ')', 'info');
}

function openRequestModal() {
    closeModal('productModal');
    openModal('requestModal');
}

function submitRequest() {
    const name = document.getElementById('reqName').value.trim();
    const qty = document.getElementById('reqQty').value.trim();
    const notes = document.getElementById('reqNotes').value.trim();
    const fileInput = document.getElementById('reqImageInput');
    const file = fileInput.files[0];

    if (!name || !qty) {
        showToast('⚠️ Please fill in product name and quantity', 'error');
        return;
    }

    let imageInfo = file ? ' 📷 Image attached' : '';
    const reqId = generateUniqueId('REQ');
    showToast('✅ Request submitted! (🆔 ' + reqId + ')', 'success');
    addNotification('📝 New request: ' + name + ' (Qty: ' + qty + ') (🆔 ' + reqId + ')' + imageInfo, 'info');
    addCustomerRequest(name, currentUser.username || 'Customer', 'Qty: ' + qty + (notes ? ' • ' + notes : '') + imageInfo, 'N/A');

    closeModal('requestModal');
    document.getElementById('reqName').value = '';
    document.getElementById('reqQty').value = '';
    document.getElementById('reqNotes').value = '';
    document.getElementById('reqImageInput').value = '';
}

// ============================================================
// CATEGORY FILTER
// ============================================================
function filterCategory(category) {
    const container = document.getElementById('allProducts');
    if (!container) return;
    const filtered = category === 'all' ? products : products.filter(p => p.category === category);
    container.innerHTML = filtered.slice(0, 6).map(p => renderProductCard(p)).join('');
    document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.category-chip').forEach(c => {
        if (c.textContent === category || (category === 'all' && c.textContent === '✨ All')) {
            c.classList.add('active');
        }
    });
    showToast('📂 Showing: ' + (category === 'all' ? 'All Products' : category), 'info');
}

// ============================================================
// NOTIFICATIONS
// ============================================================
function addNotification(message, type) {
    const id = generateUniqueId('NOTIF');
    notifications.unshift({
        id: id,
        message: message,
        type: type || 'info',
        time: new Date().toLocaleTimeString(),
        read: false
    });
    updateNotifBadge();
}

function updateNotifBadge() {
    const badge = document.getElementById('notifBadge');
    const count = notifications.filter(n => !n.read).length;
    if (count > 0) {
        badge.textContent = count;
        badge.classList.remove('hidden');
    } else {
        badge.classList.add('hidden');
    }
}

function toggleNotifications() {
    const modal = document.getElementById('notifModal');
    modal.classList.toggle('visible');
    if (modal.classList.contains('visible')) {
        const container = document.getElementById('notifList');
        if (notifications.length === 0) {
            container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔔</div><h3>No notifications</h3></div>`;
        } else {
            container.innerHTML = notifications.map(n => `
                <div class="notif-item">
                    <div class="notif-id">🆔 ${n.id}</div>
                    <div>${n.message}</div>
                    <div class="notif-detail">${n.time}</div>
                </div>
            `).join('');
        }
        notifications.forEach(n => n.read = true);
        updateNotifBadge();
    }
}

// ============================================================
// TOAST
// ============================================================
function showToast(message, type) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast visible ' + (type || 'info');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('visible'), 3000);
}

// ============================================================
// DARK MODE
// ============================================================
function toggleDarkMode() {
    document.body.classList.toggle('dark-theme');
    showToast('🌙 Dark mode ' + (document.body.classList.contains('dark-theme') ? 'enabled' : 'disabled'), 'info');
    const currentPage = document.querySelector('.nav-item.active');
    if (currentPage) navigateTo(currentPage.dataset.page);
}

    document.getElementById(id).classList.add('visible');
}
function closeModal(id) {
    document.getElementById(id).classList.remove('visible');
}

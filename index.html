<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soYam cosmo — Mini App</title>
    <!-- Google Fonts for Editorial Luxury Aesthetics -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-primary: #121212;
            --color-bg-surface: #1E1E1E;
            --color-brand-gold: #D4AF37;
            --color-brand-gold-muted: rgba(212, 175, 55, 0.2);
            --color-accent-chocolate: #3D2314;
            --color-text-luxury: #F5E6D3;
            --color-text-muted: #A0A0A0;
            --color-status-active: #10B981;
            --color-status-pending: #F59E0B;
            --color-status-danger: #EF4444;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Montserrat', sans-serif;
            --border-gold: 1px solid rgba(212, 175, 55, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg-primary);
            color: var(--color-text-luxury);
            font-family: var(--font-sans);
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* ------------------ COMMON GLOBAL COMPONENTS ------------------ */
        .brand-crown {
            text-align: center;
            padding: 24px 16px;
            background: linear-gradient(180deg, var(--color-accent-chocolate) 0%, var(--color-bg-primary) 100%);
            border-bottom: var(--border-gold);
        }

        .brand-logo-emblem {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--color-brand-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-family: var(--font-serif);
            font-size: 28px;
            font-weight: bold;
            color: var(--color-brand-gold);
            background-color: var(--color-bg-surface);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .brand-title {
            font-family: var(--font-serif);
            font-size: 32px;
            letter-spacing: 0.18em;
            text-transform: lowercase;
            color: var(--color-brand-gold);
            margin-bottom: 2px;
        }

        .brand-amharic {
            font-size: 16px;
            font-weight: 500;
            color: var(--color-text-luxury);
            margin-bottom: 6px;
            letter-spacing: 0.05em;
        }

        .brand-subtitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--color-text-muted);
            margin-bottom: 12px;
        }

        .brand-tagline {
            font-size: 12px;
            font-style: italic;
            color: var(--color-brand-gold);
            max-width: 280px;
            margin: 0 auto;
        }

        .standardized-address {
            padding: 12px 16px;
            background-color: var(--color-bg-surface);
            border-bottom: var(--border-gold);
            font-size: 11px;
            text-align: center;
            line-height: 1.6;
            color: var(--color-text-luxury);
        }

        .address-link {
            color: var(--color-brand-gold);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 6px;
            font-weight: bold;
        }

        .language-bar {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 8px;
            background-color: #161616;
            border-bottom: var(--border-gold);
            gap: 16px;
            justify-content: center;
        }

        .language-bar::-webkit-scrollbar {
            display: none;
        }

        .lang-chip {
            font-size: 11px;
            color: var(--color-text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .lang-chip.active {
            color: var(--color-brand-gold);
            font-weight: 600;
        }

        .social-redirects-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 12px;
            background-color: var(--color-bg-primary);
            border-bottom: var(--border-gold);
        }

        .social-icon {
            color: var(--color-text-muted);
            font-size: 18px;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .social-icon:hover {
            color: var(--color-brand-gold);
        }

        /* ------------------ PORTAL STRUCTURE ------------------ */
        .portal-view {
            display: none;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .portal-view.active {
            display: block;
        }

        /* ------------------ BASE ELEMENT STYLE ------------------ */
        h2 {
            font-family: var(--font-serif);
            font-size: 24px;
            color: var(--color-brand-gold);
            margin-bottom: 16px;
            letter-spacing: 0.05em;
        }

        .card {
            background-color: var(--color-bg-surface);
            border: var(--border-gold);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .btn {
            background-color: transparent;
            border: 1px solid var(--color-brand-gold);
            color: var(--color-brand-gold);
            padding: 12px 20px;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
        }

        .btn:active {
            background-color: var(--color-brand-gold);
            color: var(--color-bg-primary);
        }

        .btn-success {
            border-color: var(--color-status-active);
            color: var(--color-status-active);
        }

        .btn-success:active {
            background-color: var(--color-status-active);
            color: white;
        }

        .btn-danger {
            border-color: var(--color-status-danger);
            color: var(--color-status-danger);
        }

        .btn-danger:active {
            background-color: var(--color-status-danger);
            color: white;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-muted);
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            background-color: #121212;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 4px;
            padding: 10px;
            color: var(--color-text-luxury);
            font-family: var(--font-sans);
            font-size: 13px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--color-brand-gold);
        }

        /* ------------------ INTRO IDENTITY ROUTER ------------------ */
        #identity-router-screen {
            padding: 40px 20px;
            text-align: center;
        }

        .selector-box {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ------------------ PORTAL: BUYER ------------------ */
        .promo-block {
            background: linear-gradient(135deg, var(--color-accent-chocolate) 0%, #1a0f0a 100%);
            border: var(--border-gold);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .category-tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 4px;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background-color: var(--color-bg-surface);
            border: 1px solid rgba(212, 175, 55, 0.1);
            color: var(--color-text-muted);
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
        }

        .tab-btn.active {
            border-color: var(--color-brand-gold);
            color: var(--color-brand-gold);
            background-color: rgba(212,175,55,0.05);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product-card {
            background-color: var(--color-bg-surface);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-img-dummy {
            width: 100%;
            aspect-ratio: 1;
            background-color: #151515;
            border-radius: 4px;

<style>
:root{--brown:#24130d;--brown2:#3a2118;--gold:#c9a45b;--cream:#f7f1e8;--white:#fff;--ink:#201914;--muted:#786d65;--green:#16724a;--amber:#b97800;--red:#a52b2b;--line:#e7ddd0;--shadow:0 10px 30px rgba(36,19,13,.10)}
*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 40px #00000012}.hidden{display:none!important}.hero{background:linear-gradient(145deg,#24130d,#513023);color:#fff;padding:28px 18px 22px;text-align:center}.logo{width:62px;height:62px;border:1px solid #c9a45b;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:#e6c77d;font-weight:800;font-size:22px}.hero h1{margin:0;font-family:Georgia,serif;font-size:29px}.hero h2{font-size:15px;font-weight:500;color:#ead8bc;margin:6px 0}.hero p{margin:4px 0;color:#d8c7b8;font-size:12px}.langbar{display:flex;gap:6px;overflow:auto;padding:10px 12px;border-bottom:1px solid var(--line)}.langbar button{white-space:nowrap;background:#f6efe5;padding:7px 10px;border-radius:20px;font-size:11px}.langbar button.active{background:var(--brown);color:#fff}.social{display:flex;justify-content:center;gap:10px;padding:12px}.social a{width:38px;height:38px;border-radius:50%;background:#f4ede4;display:grid;place-items:center;color:var(--brown);text-decoration:none;font-weight:700}.promo{margin:8px 14px 14px;padding:17px;border-radius:18px;background:linear-gradient(135deg,#29160f,#4a2a1e);color:white}.promo small{color:#d9c39d}.promo h3{margin:5px 0}.section{padding:0 14px 18px}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.cats button{white-space:nowrap;padding:9px 12px;border-radius:20px;background:#f3ece3}.cats button.active{background:var(--brown);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}.product-img{height:145px;background:linear-gradient(145deg,#eee2d5,#f9f7f3);display:grid;place-items:center;font-size:44px}.card-body{padding:12px}.card h4{margin:0 0 4px;font-size:14px}.price{font-weight:800;color:var(--brown)}.muted{font-size:11px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.qty{display:flex;align-items:center;gap:8px;margin-top:9px}.qty button{width:30px;height:30px;border-radius:9px;background:#f0e8de}.primary{background:var(--brown);color:#fff;border-radius:11px;padding:11px 14px}.gold{background:var(--gold);color:#21150e;border-radius:11px;padding:11px 14px}.danger{background:#f8e1e1;color:var(--red);border-radius:10px;padding:9px}.full{width:100%}.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.bottom button{padding:10px 3px;background:#fff;font-size:10px;color:#675b52}.bottom button.active{color:var(--brown);font-weight:800}.view{padding-bottom:12px}.panel{margin:12px 14px;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}.panel h3{margin:0 0 12px}.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.metric b{display:block;font-size:20px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700}.ok{background:#dff2e9;color:var(--green)}.pending{background:#fff0cc;color:var(--amber)}.bad{background:#f9dddd;color:var(--red)}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left}.input{width:100%;padding:11px;border:1px solid #d9cec2;border-radius:10px;background:#fff}.formgrid{display:grid;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.scanner{height:240px;border-radius:18px;background:#17110e;color:#fff;display:grid;place-items:center;text-align:center}.scanner .frame{width:180px;height:180px;border:2px solid var(--gold);border-radius:18px}.modal{position:fixed;inset:0;background:#0008;z-index:100;display:grid;align-items:end}.sheet{background:#fff;border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;padding:18px;max-width:720px;width:100%;margin:auto}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#24130d;color:#fff;padding:10px 16px;border-radius:20px;z-index:200;font-size:12px}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#24130d,#5a3325)}.loginbox{max-width:460px;width:100%;background:#fff;border-radius:28px;padding:26px;text-align:center}.rolecards{display:grid;gap:12px;margin-top:18px}.rolecard{padding:18px;border:1px solid var(--line);border-radius:18px;text-align:left;background:#fff}.rolecard strong{display:block;font-size:17px}.toolbar{display:flex;gap:8px;overflow:auto;padding:12px 14px;border-bottom:1px solid var(--line)}.toolbar button{white-space:nowrap;background:#f2ebe2;padding:9px 12px;border-radius:10px}.toolbar button.active{background:var(--brown);color:#fff}.spin{min-height:100vh;display:grid;place-items:center;color:var(--muted);font-size:13px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.metricgrid{grid-template-columns:repeat(4,1fr)}}
</style>

<div id="root"><div class="spin">Loading soYam cosmo…</div></div>
<script>
/* =========================================================
   soYam cosmo — Telegram Mini App frontend.
   Talks to the real backend in /server.js — no localStorage.
   ========================================================= */

/* soYam cosmo — SINGLE-FILE STANDALONE EDITION
   Combines the supplied frontend + seed data into one HTML file.
   Data is persisted in localStorage for this browser/device.
   Telegram WebApp SDK is retained; no Node/Express backend is required.
*/
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#24130d")}catch(e){}}

const SEED_DB = {"users": [{"id": 1, "telegram_user_id": "999999999", "telegram_username": "mama51R", "first_name": "Rahel", "phone": "+251920353460", "roles": ["OWNER", "SELLER"], "store_id": "STORE001", "account_status": "ACTIVE", "created_at": "2026-01-01T00:00:00.000Z"}, {"id": 2, "telegram_user_id": "987654321", "telegram_username": "silencer01m", "first_name": "Seller", "phone": "+251948479301", "roles": ["SELLER"], "store_id": "STORE001", "account_status": "ACTIVE", "created_at": "2026-01-01T00:00:00.000Z"}, {"id": 3, "telegram_user_id": "555555555", "telegram_username": "driver01", "first_name": "Driver", "phone": "+251900000000", "roles": ["DRIVER"], "store_id": "STORE001", "account_status": "ACTIVE", "created_at": "2026-01-01T00:00:00.000Z"}], "stores": [{"id": "STORE001", "name": "SoYam Cosmo", "address": "Betel Building, Ground Floor, Addis Ababa, Ethiopia", "phone": "+251919096451"}], "categories": ["All", "Skincare", "Makeup", "Fragrance", "Haircare", "Detergent"], "products": [{"id": "P001", "name": "Luxury Face Cream", "category": "Skincare", "price": 650, "stock": 24, "emoji": "🧴", "cost": 390}, {"id": "P002", "name": "Hydrating Lotion", "category": "Skincare", "price": 500, "stock": 38, "emoji": "🧴", "cost": 300}, {"id": "P003", "name": "Beauty Soap", "category": "Detergent", "price": 180, "stock": 76, "emoji": "🧼", "cost": 90}, {"id": "P004", "name": "Fresh Fragrance", "category": "Fragrance", "price": 900, "stock": 15, "emoji": "🌸", "cost": 540}, {"id": "P005", "name": "Hair Care Oil", "category": "Haircare", "price": 420, "stock": 31, "emoji": "💧", "cost": 250}, {"id": "P006", "name": "Premium Makeup", "category": "Makeup", "price": 780, "stock": 12, "emoji": "💄", "cost": 470}], "orders": [], "transactions": [], "requests": [], "deliveries": [], "invitations": [], "audit": [], "dailyLedger": {"date": null, "status": "OPEN", "cash": 0, "bank": 0, "telebirr": 0}};
const DB_KEY="soyam_cosmo_single_file_v1";
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadDB(){
  try{const x=JSON.parse(localStorage.getItem(DB_KEY)); if(x&&x.users&&x.products)return x}catch(e){}
  const x=clone(SEED_DB); x.dailyLedger.date=new Date().toISOString().slice(0,10); return x;
}
let DB=loadDB();
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(DB))}
function getDemoId(){
 let id=sessionStorage.getItem("demoTelegramId");
 if(!id){
   const tid=tg?.initDataUnsafe?.user?.id;
   id=tid?String(tid):prompt("Choose demo account:\n999999999 = Owner + Seller\n987654321 = Seller\n555555555 = Driver\nAny other ID = Buyer","999999999")||"buyer-"+Date.now();
   sessionStorage.setItem("demoTelegramId",id)
 }
 return id;
}
function currentUser(){
 const id=tg?.initDataUnsafe?.user?.id?String(tg.initDataUnsafe.user.id):getDemoId();
 let u=DB.users.find(x=>x.telegram_user_id===id);
 if(!u){
   u={id:Date.now(),telegram_user_id:id,telegram_username:(tg?.initDataUnsafe?.user?.username||"buyer"),first_name:(tg?.initDataUnsafe?.user?.first_name||"Buyer"),phone:"",roles:["BUYER"],store_id:"STORE001",account_status:"ACTIVE",created_at:new Date().toISOString()};
   DB.users.push(u); saveDB();
 }
 return u;
}
function okRole(u,roles){return roles.some(r=>u.roles.includes(r))}
function uid(prefix,list){return prefix+"-"+String(Date.now())+"-"+Math.floor(Math.random()*1000)}
function fail(msg){toast(msg);throw new Error(msg)}
function localApi(method,path,body){
 const u=currentUser();
 if(u.account_status!=="ACTIVE") fail("Your access has been revoked.");
 let m=method.toUpperCase(), p=path.split("?")[0], b=body||{};
 if(m==="GET"&&p==="/api/me") return clone(u);
 if(m==="GET"&&p==="/api/store") return {store:clone(DB.stores[0]),categories:clone(DB.categories)};
 if(m==="GET"&&p==="/api/products") return clone(DB.products);
 if(m==="POST"&&p==="/api/products"){
   if(!okRole(u,["OWNER","SELLER"])) fail("FORBIDDEN");
   const x={id:b.id||uid("P",DB.products),name:b.name||"New Product",category:b.category||"Other",price:Number(b.price||0),stock:Number(b.stock||0),emoji:b.emoji||"📦",cost:Number(b.cost||0)};
   DB.products.push(x);DB.audit.push({action:"PRODUCT_CREATED",detail:x.id,at:new Date().toISOString()});saveDB();return clone(x);
 }
 if(m==="PATCH"&&p.startsWith("/api/products/")&&!p.includes("/lookup/")){
   if(!okRole(u,["OWNER","SELLER"])) fail("FORBIDDEN");
   const id=p.split("/").pop(), x=DB.products.find(q=>q.id===id);if(!x)fail("NOT_FOUND");
   Object.assign(x,b);DB.audit.push({action:"PRODUCT_UPDATED",detail:id,at:new Date().toISOString()});saveDB();return clone(x);
 }
 if(m==="GET"&&p.startsWith("/api/products/lookup/")){
   const code=decodeURIComponent(p.split("/").pop());const x=DB.products.find(q=>q.id===code||q.barcode===code);if(!x)fail("NOT_FOUND");return clone(x);
 }
 if(m==="GET"&&p==="/api/orders"){
   return clone(okRole(u,["OWNER","SELLER"])?DB.orders:okRole(u,["DRIVER"])?DB.orders.filter(o=>o.driver_id===u.telegram_user_id):DB.orders.filter(o=>o.buyer===u.telegram_user_id));
 }
 if(m==="POST"&&p==="/api/orders"){
   if(!Array.isArray(b.items)||!b.items.length)fail("Cart is empty.");
   const resolved=b.items.map(it=>{const x=DB.products.find(q=>q.id===it.product_id);if(!x)fail("Product not found");return {product_id:x.id,quantity:Number(it.quantity),unit_price:x.price}});
   const itemsTotal=resolved.reduce((s,x)=>s+x.quantity*x.unit_price,0);
   if(b.fulfillment==="IN_PERSON"){
     resolved.forEach(it=>{const x=DB.products.find(q=>q.id===it.product_id);if(x.stock<it.quantity)fail("Not enough stock for "+x.name)});
     resolved.forEach(it=>DB.products.find(q=>q.id===it.product_id).stock-=it.quantity);
   }
   const o={id:uid("SOYAM",DB.orders),buyer:u.telegram_user_id,buyer_name:b.buyer_name||u.first_name,buyer_phone:b.buyer_phone||u.phone||"",dropoff:b.dropoff||"",items:resolved,delivery_fee:Number(b.delivery_fee||0),total:itemsTotal+Number(b.delivery_fee||0),fulfillment:b.fulfillment||"IN_PERSON",payment_status:b.fulfillment==="DELIVERY"?"PENDING":"PAID",status:b.fulfillment==="DELIVERY"?"PENDING":"COMPLETED",created_at:new Date().toISOString()};
   DB.orders.push(o);DB.audit.push({action:b.fulfillment==="DELIVERY"?"DELIVERY_REQUEST":"IN_PERSON_SALE",detail:o.id,at:new Date().toISOString()});saveDB();return clone(o);
 }
 if(m==="PATCH"&&p.startsWith("/api/orders/")){
   const parts=p.split("/"), id=parts[3], action=parts[4], o=DB.orders.find(x=>x.id===id);if(!o)fail("Order not found");
   if(action==="payment-proof"){if(o.buyer!==u.telegram_user_id)fail("FORBIDDEN");o.payment_proof=b.proof||"submitted";o.payment_status="SUBMITTED";DB.audit.push({action:"PAYMENT_PROOF_SUBMITTED",detail:id,at:new Date().toISOString()})}
   else if(action==="verify-payment"){if(!okRole(u,["SELLER","OWNER"]))fail("FORBIDDEN");o.payment_status="VERIFIED";o.status="READY";DB.transactions.push({order_id:id,type:"SALE",amount:o.total,status:"OWNER_PENDING",created_at:new Date().toISOString()});DB.audit.push({action:"PAYMENT_VERIFIED",detail:id,at:new Date().toISOString()})}
   else if(action==="reject-payment"){if(!okRole(u,["SELLER","OWNER"]))fail("FORBIDDEN");o.payment_status="REJECTED";DB.audit.push({action:"PAYMENT_REJECTED",detail:id,at:new Date().toISOString()})}
   else if(action==="assign-driver"){if(!okRole(u,["SELLER","OWNER"]))fail("FORBIDDEN");const d=DB.users.find(x=>x.telegram_user_id===b.driver_id&&x.roles.includes("DRIVER"));if(!d)fail("Unknown driver");o.driver_id=d.telegram_user_id;o.driver_name=d.first_name;o.driver_phone=d.phone||"";o.status="DRIVER_ASSIGNED";DB.deliveries.push({order_id:id,driver:d.first_name,status:"ASSIGNED"});DB.audit.push({action:"DRIVER_ASSIGNED",detail:id,at:new Date().toISOString()})}
   else if(action==="delivery-status"){if(!u.roles.includes("DRIVER")||o.driver_id!==u.telegram_user_id)fail("FORBIDDEN");if(!["IN_TRANSIT","COMPLETED"].includes(b.status))fail("Invalid status");o.status=b.status;DB.audit.push({action:"DELIVERY_STATUS",detail:id+" "+b.status,at:new Date().toISOString()})}
   saveDB();return clone(o);
 }
 if(m==="GET"&&p==="/api/drivers") return clone(DB.users.filter(x=>x.roles.includes("DRIVER")&&x.account_status==="ACTIVE"));
 if(m==="GET"&&p==="/api/requests"){const a=okRole(u,["OWNER","SELLER"])?DB.requests:DB.requests.filter(x=>x.buyer===u.telegram_user_id);return clone(a.slice().reverse())}
 if(m==="POST"&&p==="/api/requests"){if(!b.name)fail("Product name is required.");const r={id:"REQ-"+Date.now(),buyer:u.telegram_user_id,name:b.name,note:b.note||"",image:b.image||null,status:"PENDING",created_at:new Date().toISOString()};DB.requests.push(r);DB.audit.push({action:"PRODUCT_REQUEST",detail:r.id,at:new Date().toISOString()});saveDB();return clone(r)}
 if(m==="PATCH"&&p.startsWith("/api/requests/")){
   if(!okRole(u,["OWNER","SELLER"]))fail("FORBIDDEN");const id=p.split("/")[3],r=DB.requests.find(x=>x.id===id);if(!r)fail("NOT_FOUND");r.status="OFFERED";r.offer={price:Number(b.price||0),product:b.product||"Available equivalent product"};DB.audit.push({action:"REQUEST_OFFERED",detail:id,at:new Date().toISOString()});saveDB();return clone(r)
 }
 if(m==="GET"&&p==="/api/staff"){if(!u.roles.includes("OWNER"))fail("FORBIDDEN");return clone(DB.users)}
 if(m==="POST"&&p==="/api/staff/invite"){if(!u.roles.includes("OWNER"))fail("FORBIDDEN");const inv={code:"SOYAM-SELLER-"+Math.random().toString(36).slice(2,7).toUpperCase(),username:b.username,status:"PENDING",created_at:new Date().toISOString()};DB.invitations.push(inv);DB.audit.push({action:"SELLER_INVITATION_CREATED",detail:inv.code,at:new Date().toISOString()});saveDB();return clone(inv)}
 if(m==="PATCH"&&p.startsWith("/api/staff/")){if(!u.roles.includes("OWNER"))fail("FORBIDDEN");const id=Number(p.split("/")[3]),x=DB.users.find(q=>q.id===id);if(!x)fail("NOT_FOUND");if(x.telegram_username==="mama51R")fail("Master owner cannot be suspended.");x.account_status=x.account_status==="ACTIVE"?"SUSPENDED":"ACTIVE";DB.audit.push({action:"USER_STATUS_CHANGED",detail:x.telegram_username,at:new Date().toISOString()});saveDB();return clone(x)}
 if(m==="GET"&&p==="/api/audit"){if(!u.roles.includes("OWNER"))fail("FORBIDDEN");return clone(DB.audit.slice().reverse())}
 if(m==="GET"&&p==="/api/ledger"){if(!u.roles.includes("OWNER"))fail("FORBIDDEN");return clone(DB.dailyLedger)}
 if(m==="POST"&&p==="/api/ledger/close"){if(!u.roles.includes("OWNER"))fail("FORBIDDEN");DB.dailyLedger.status="CLOSED";DB.audit.push({action:"DAILY_LEDGER_CLOSED",detail:DB.dailyLedger.date,at:new Date().toISOString()});saveDB();return clone(DB.dailyLedger)}
 if(m==="GET"&&p==="/api/reports"){if(!u.roles.includes("OWNER"))fail("FORBIDDEN");const revenue=DB.transactions.filter(x=>x.type==="SALE").reduce((s,x)=>s+Number(x.amount||0),0);const stockCapital=DB.products.reduce((s,x)=>s+Number(x.stock||0)*Number(x.cost||0),0);return {revenue,stockCapital,orderCount:DB.orders.length,pendingAudit:DB.transactions.filter(x=>x.status==="OWNER_PENDING").length}}
 fail("Unsupported operation");
}
async function api(method,path,body){return Promise.resolve(localApi(method,path,body))}
function get(p){return api("GET",p)}
function post(p,b){return api("POST",p,b)}
function patch(p,b){return api("PATCH",p,b)}

let state={user:null,store:null,portal:null,view:"home",category:"All",cart:[],
 products:[],orders:[],requests:[],staff:[],audit:[],ledger:null,reports:null,drivers:[]};

const money=n=>"ETB "+Number(n||0).toLocaleString("en-US");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function toast(m){let x=document.createElement("div");x.className="toast";x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2400)}
function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}

async function boot(){
 try{
  state.user=await get("/api/me");
  let s=await get("/api/store");state.store=s.store;state.categories=s.categories;
 }catch(e){return} // already rendered an auth/revoked screen
 if(state.user.roles.includes("OWNER")&&state.user.roles.includes("SELLER")) renderPortalSelector();
 else if(state.user.roles.includes("OWNER")){state.portal="OWNER";await enterPortal()}
 else if(state.user.roles.includes("SELLER")){state.portal="SELLER";await enterPortal()}
 else if(state.user.roles.includes("DRIVER")){state.portal="DRIVER";await enterPortal()}
 else {state.portal="BUYER";await enterPortal()}
}
function renderPortalSelector(){
 document.getElementById("root").innerHTML=`<div class="login"><div class="loginbox">
 <div class="logo">SY</div><h1>Welcome back, Owner</h1><p>How would you like to continue?</p>
 <div class="rolecards">
  <button class="rolecard" onclick="choosePortal('OWNER')"><strong>👑 Owner Portal</strong><span>Manage SoYam</span></button>
  <button class="rolecard" onclick="choosePortal('SELLER')"><strong>🏪 Seller Portal</strong><span>Manage your store</span></button>
 </div>
 <p class="muted" style="margin-top:16px">Authorized Telegram account: @${esc(state.user.telegram_username)}</p>
 </div></div>`;
}
async function choosePortal(p){state.portal=p;state.view="home";await enterPortal()}

async function enterPortal(){
 await loadForPortal();
 render();
}
async function loadForPortal(){
 state.products=await get("/api/products");
 state.orders=await get("/api/orders");
 if(state.portal==="BUYER") state.requests=await get("/api/requests");
 if(state.portal==="SELLER"){state.requests=await get("/api/requests");state.drivers=await get("/api/drivers")}
 if(state.portal==="OWNER"){
  state.staff=await get("/api/staff");
  state.audit=await get("/api/audit");
  state.ledger=await get("/api/ledger");
  state.reports=await get("/api/reports");
  state.drivers=await get("/api/drivers");
 }
}
async function refresh(){await loadForPortal();render()}

function header(){
 return `<header class="hero"><div class="logo">SY</div><h1>soYam cosmo</h1><h2>ሶያም ኮስሞΤΙΚΣ · COSMETICS & BEAUTY</h2><p>Betel Building, Ground Floor · Addis Ababa, Ethiopia</p><p>+251 919096451</p></header>
 <div class="langbar">${["English","አማርኛ","ትግርኛ","Oromiffa","Gurage","Soomaali"].map((x,i)=>`<button class="${i===0?"active":""}" onclick="toast('${x} selected')">${x}</button>`).join("")}</div>
 <div class="social"><a href="https://www.tiktok.com/" target="_blank">TT</a><a href="https://www.facebook.com/" target="_blank">f</a><a href="https://wa.me/251919096451" target="_blank">WA</a></div>`;
}
function bottom(items){
 return `<nav class="bottom">${items.map(([id,icon,label])=>`<button class="${state.view===id?"active":""}" onclick="go('${id}')">${icon}<br>${label}</button>`).join("")}</nav>`;
}
async function go(v){state.view=v;await refresh()}
function render(){if(state.portal==="BUYER")renderBuyer();else if(state.portal==="SELLER")renderSeller();else if(state.portal==="DRIVER")renderDriver();else renderOwner()}

// ---------------- BUYER ----------------
function productCard(p){
 const inCart=state.cart.find(x=>x.id===p.id)?.qty||0;
 return `<article class="card"><div class="product-img">${p.emoji}</div><div class="card-body">
 <div class="muted">${esc(p.category)}</div><h4>${esc(p.name)}</h4><div class="row"><span class="price">${money(p.price)}</span><span class="muted">${p.stock} in stock</span></div>
 <div class="qty"><button onclick="changeCart('${p.id}',-1)">−</button><b>${inCart}</b><button onclick="changeCart('${p.id}',1)">+</button><button class="primary" style="margin-left:auto;padding:8px 10px" onclick="changeCart('${p.id}',1)">Add</button></div>
 </div></article>`;
}
function filteredProducts(){return state.products.filter(p=>(state.category==="All"||p.category===state.category)&&(!state.search||p.name.toLowerCase().includes(state.search.toLowerCase())))}
function setCat(c){state.category=c;render()}
function changeCart(id,d){
 let p=state.products.find(x=>x.id===id), item=state.cart.find(x=>x.id===id);
 if(d>0&&(!item||item.qty<p.stock)){if(item)item.qty++;else state.cart.push({id,qty:1})}
 if(d<0&&item){item.qty--;if(item.qty<=0)state.cart=state.cart.filter(x=>x.id!==id)}
 render();toast(d>0?"Added to cart":"Cart updated");
}
function renderBuyer(){
 let body="";
 if(state.view==="home"){body=`<div class="promo"><small>WEEKLY PROMOTION</small><h3>New Arrivals This Week!</h3><span>Premium beauty essentials, soaps, creams & detergents.</span></div><div class="section"><div class="cats">${state.categories.map(c=>`<button class="${state.category===c?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("")}</div><div class="grid">${filteredProducts().map(productCard).join("")}</div></div>`}
 else if(state.view==="cart") body=buyerCart();
 else if(state.view==="orders") body=buyerOrders();
 else if(state.view==="requests") body=buyerRequests();
 else if(state.view==="profile") body=buyerProfile();
 document.getElementById("root").innerHTML=`<div class="app">${header()}<main class="view">${body}</main>${bottom([["home","⌂","Home"],["cart","🛒","Cart"],["orders","▣","Orders"],["requests","?","Requests"],["profile","●","Profile"]])}</div>`;
}
function buyerCart(){
 let items=state.cart.map(x=>({...x,p:state.products.find(p=>p.id===x.id)})).filter(x=>x.p);
 let total=items.reduce((s,x)=>s+x.qty*x.p.price,0);
 return `<div class="panel"><h3>🛒 Your Cart</h3>${items.length?items.map(x=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${x.p.emoji} ${esc(x.p.name)} × ${x.qty}</span><b>${money(x.qty*x.p.price)}</b></div>`).join(""):`<p class="muted">Your cart is empty.</p>`}<div class="row" style="margin-top:14px"><b>Total</b><strong>${money(total)}</strong></div>${items.length?`<div class="actions"><button class="primary full" onclick="checkout()">Checkout</button></div>`:""}</div>`;
}
function checkout(){
 let items=state.cart.map(x=>({product_id:x.id,quantity:x.qty}));
 let total=state.cart.reduce((s,x)=>s+x.qty*state.products.find(p=>p.id===x.id).price,0);
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="checkoutModal"><div class="sheet"><h3>Checkout</h3><p>Choose fulfillment.</p><div class="actions"><button class="primary" onclick="placeOrder(${total})">🏬 In-Person (pay at store)</button><button class="gold" onclick="deliveryForm(${total})">🛵 Delivery</button></div><button class="full" style="margin-top:10px;padding:10px" onclick="closeModal()">Cancel</button></div></div>`);
}
function deliveryForm(total){
 document.querySelector(".sheet").innerHTML=`<h3>Delivery Details</h3><div class="formgrid"><input class="input" id="custName" placeholder="Full name"><input class="input" id="custPhone" placeholder="Phone number"><textarea class="input" id="dropoff" placeholder="Drop-off location"></textarea><input class="input" id="deliveryFee" type="number" placeholder="Proposed delivery fee (ETB)"></div><button class="primary full" style="margin-top:12px" onclick="submitDelivery(${total})">Request Delivery Quote</button>`;
}
async function submitDelivery(total){
 let fee=Number(document.getElementById("deliveryFee").value||0);
 let items=state.cart.map(x=>({product_id:x.id,quantity:x.qty}));
 let o=await post("/api/orders",{items,fulfillment:"DELIVERY",buyer_name:document.getElementById("custName").value,buyer_phone:document.getElementById("custPhone").value,dropoff:document.getElementById("dropoff").value,delivery_fee:fee});
 state.cart=[];closeModal();toast("Delivery quote requested: "+o.id);state.view="orders";await refresh();
}
async function placeOrder(total){
 let items=state.cart.map(x=>({product_id:x.id,quantity:x.qty}));
 try{let o=await post("/api/orders",{items,fulfillment:"IN_PERSON"});state.cart=[];closeModal();toast("Sale completed: "+o.id);state.view="orders";await refresh()}
 catch(e){}
}
function buyerOrders(){
 let os=state.orders;
 return `<div class="panel"><h3>▣ My Orders</h3>${os.length?os.map(o=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="row"><b>${o.id}</b><span class="badge ${o.status==="COMPLETED"?"ok":"pending"}">${o.status}</span></div><p class="muted">${o.fulfillment} · ${money(o.total)}</p>${o.payment_status==="PENDING"?`<input type="file" accept="image/*" id="proof_${o.id}" class="input" style="margin:6px 0"><button class="gold" onclick="uploadProof('${o.id}')">Upload Payment Proof</button>`:""}${o.fulfillment==="DELIVERY"?`<button class="primary" onclick="track('${o.id}')">Track Delivery</button>`:""}</div>`).join(""):`<p class="muted">No orders yet.</p>`}</div>`;
}
async function uploadProof(id){
 let file=document.getElementById("proof_"+id)?.files?.[0];
 let proof=file?await fileToBase64(file):"submitted-without-file";
 await patch(`/api/orders/${id}/payment-proof`,{proof});
 toast("Payment proof uploaded");await refresh();
}
function track(id){let o=state.orders.find(x=>x.id===id);alert(`Order ${id}\nStatus: ${o.status}\nDriver: ${o.driver_name||"Awaiting assignment"}`)}
function buyerRequests(){return `<div class="panel"><h3>? Can you get this item?</h3><div class="formgrid"><input class="input" id="reqName" placeholder="Product name"><input class="input" id="reqImage" type="file" accept="image/*"><textarea class="input" id="reqNote" placeholder="Describe the product"></textarea><button class="primary" onclick="submitRequest()">Submit Request</button></div></div><div class="panel"><h3>My Requests</h3>${state.requests.map(r=>`<p><b>${esc(r.name)}</b> · <span class="badge pending">${r.status}</span></p>`).join("")||'<p class="muted">No requests.</p>'}</div>`}
async function submitRequest(){
 let file=document.getElementById("reqImage").files?.[0];
 let image=file?await fileToBase64(file):null;
 await post("/api/requests",{name:document.getElementById("reqName").value,note:document.getElementById("reqNote").value,image});
 toast("Request submitted");await refresh();
}
function buyerProfile(){return `<div class="panel"><h3>Profile</h3><p><b>${esc(state.user.first_name)}</b></p><p class="muted">@${esc(state.user.telegram_username||"customer")}</p><p class="muted">Telegram ID: ${esc(state.user.telegram_user_id)}</p><button class="primary" onclick="tg?.close()">Close Mini App</button></div>`}
function closeModal(){document.getElementById("checkoutModal")?.remove()}

// ---------------- SELLER ----------------
function sellerHeader(){return `<div class="hero"><div class="logo">SY</div><h1>🏪 Seller Hub</h1><p>SoYam Cosmo · ${esc(state.user.telegram_username||"seller")}</p></div>`}
function renderSeller(){
 let body="";
 if(state.view==="home")body=sellerDashboard();
 else if(state.view==="orders")body=sellerOrders();
 else if(state.view==="scan")body=scanner();
 else if(state.view==="stock")body=stockPage();
 else if(state.view==="requests")body=sellerRequests();
 else if(state.view==="delivery")body=sellerDelivery();
 document.getElementById("root").innerHTML=`<div class="app">${sellerHeader()}<div class="toolbar"><button class="${state.view==="home"?"active":""}" onclick="go('home')">Dashboard</button><button class="${state.view==="orders"?"active":""}" onclick="go('orders')">Orders</button><button class="${state.view==="scan"?"active":""}" onclick="go('scan')">📷 Scan</button><button class="${state.view==="stock"?"active":""}" onclick="go('stock')">Stock</button><button class="${state.view==="delivery"?"active":""}" onclick="go('delivery')">Delivery</button></div><main class="view">${body}</main>${bottom([["home","⌂","Home"],["orders","▣","Orders"],["scan","📷","Scan"],["stock","□","Stock"],["delivery","🚚","Delivery"]])}</div>`;
}
function sellerDashboard(){let pending=state.orders.filter(o=>o.status==="PENDING").length,payments=state.orders.filter(o=>o.payment_status==="SUBMITTED").length;return `<div class="panel"><h3>Today's Operations</h3><div class="metricgrid"><div class="metric"><span class="muted">Pending Orders</span><b>${pending}</b></div><div class="metric"><span class="muted">Payment Review</span><b>${payments}</b></div><div class="metric"><span class="muted">Delivery Queue</span><b>${state.orders.filter(o=>o.fulfillment==="DELIVERY"&&o.status!=="COMPLETED").length}</b></div><div class="metric"><span class="muted">Products</span><b>${state.products.length}</b></div></div><button class="primary full" style="margin-top:12px" onclick="go('scan')">📷 Scan Item QR / Barcode</button></div>`}
function sellerOrders(){let os=state.orders;return `<div class="panel"><h3>Orders & Payment Verification</h3>${os.length?os.map(o=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="row"><b>${o.id}</b><span class="badge ${o.payment_status==="VERIFIED"||o.payment_status==="PAID"?"ok":"pending"}">${o.payment_status}</span></div><p>${money(o.total)} · ${o.fulfillment}</p>${o.payment_status==="SUBMITTED"?`<div class="actions"><button class="primary" onclick="verifyPayment('${o.id}')">✓ Verify</button><button class="danger" onclick="rejectPayment('${o.id}')">Reject</button></div>`:""}${o.fulfillment==="DELIVERY"&&o.payment_status!=="PENDING"&&!o.driver_id?`<div class="actions">${state.drivers.map(d=>`<button class="gold" onclick="assignDriver('${o.id}','${d.telegram_user_id}')">Assign ${esc(d.first_name)}</button>`).join("")||'<span class="muted">No active drivers</span>'}</div>`:""}</div>`).join(""):`<p class="muted">No orders.</p>`}</div>`}
async function verifyPayment(id){await patch(`/api/orders/${id}/verify-payment`);toast("Payment verified");await refresh()}
async function rejectPayment(id){await patch(`/api/orders/${id}/reject-payment`);await refresh()}
async function assignDriver(id,driverId){await patch(`/api/orders/${id}/assign-driver`,{driver_id:driverId});toast("Driver assigned");await refresh()}
function scanner(){return `<div class="panel"><h3>📷 QR / Barcode Scanner</h3><div class="scanner"><div><div class="frame"></div><p>Camera scanner area — wire up a barcode-reading library (e.g. html5-qrcode) here</p></div></div><input class="input" id="barcode" style="margin-top:10px" placeholder="Or type a product ID e.g. P001"><button class="primary full" style="margin-top:10px" onclick="lookupBarcode()">Lookup Product</button><div id="scanResult"></div></div>`}
async function lookupBarcode(){
 let code=document.getElementById("barcode").value.trim();
 try{let p=await get("/api/products/lookup/"+encodeURIComponent(code));document.getElementById("scanResult").innerHTML=`<div class="panel"><h3>${p.emoji} ${esc(p.name)}</h3><p>${p.category} · ${money(p.price)} · Stock ${p.stock}</p></div>`}
 catch(e){document.getElementById("scanResult").innerHTML=`<div class="panel"><p>Not found.</p></div>`}
}
function stockPage(){return `<div class="panel"><h3>Inventory</h3>${state.products.map(p=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row"><b>${p.emoji} ${esc(p.name)}</b><span class="badge ${p.stock<10?"bad":p.stock<20?"pending":"ok"}">${p.stock}</span></div><p class="muted">${money(p.price)} · ${p.category}</p><div class="actions"><button onclick="adjustStock('${p.id}',5)">+5</button><button onclick="adjustStock('${p.id}',-5)">−5</button></div></div>`).join("")}</div>`}
async function adjustStock(id,delta){let p=state.products.find(x=>x.id===id);let newStock=Math.max(0,p.stock+delta);await patch(`/api/products/${id}`,{stock:newStock});await refresh()}
function sellerRequests(){return `<div class="panel"><h3>Product Requests</h3>${state.requests.map(r=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(r.name)}</b><p class="muted">${esc(r.note||"")}</p>${r.status==="PENDING"?`<button class="gold" onclick="offerRequest('${r.id}')">Offer Product</button>`:`<span class="badge ok">${r.status}</span>`}</div>`).join("")||"<p class='muted'>No requests.</p>"}</div>`}
async function offerRequest(id){await patch(`/api/requests/${id}/offer`,{price:500,product:"Available equivalent product"});toast("Offer sent to buyer");await refresh()}
function sellerDelivery(){return `<div class="panel"><h3>Delivery Queue</h3>${state.orders.filter(o=>o.fulfillment==="DELIVERY").map(o=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${o.id}</b><p>${esc(o.dropoff||"No destination")}</p><span class="badge pending">${o.status}</span></div>`).join("")||"<p class='muted'>No delivery orders.</p>"}</div>`}

// ---------------- DRIVER ----------------
function renderDriver(){
 let assigned=state.orders.filter(o=>o.status!=="COMPLETED");
 document.getElementById("root").innerHTML=`<div class="app"><div class="hero"><div class="logo">SY</div><h1>🚚 Driver Hub</h1><p>Assigned deliveries</p></div><main class="view"><div class="panel"><h3>Assigned Deliveries</h3>${assigned.map(o=>`<div style="padding:13px 0;border-bottom:1px solid var(--line)"><div class="row"><b>${o.id}</b><span class="badge pending">${o.status}</span></div><p>${esc(o.dropoff||"Destination")}</p><div class="actions"><button class="primary" onclick="updateDelivery('${o.id}','IN_TRANSIT')">Start Delivery</button><button class="gold" onclick="updateDelivery('${o.id}','COMPLETED')">Mark Delivered</button></div></div>`).join("")||"<p class='muted'>No assigned deliveries.</p>"}</div></main>${bottom([["home","⌂","Home"]])}</div>`;
}
async function updateDelivery(id,status){await patch(`/api/orders/${id}/delivery-status`,{status});toast(status);await refresh()}

// ---------------- OWNER ----------------
function renderOwner(){
 let body="";
 if(state.view==="home")body=ownerDashboard();
 else if(state.view==="staff")body=ownerStaff();
 else if(state.view==="inventory")body=stockPage();
 else if(state.view==="orders")body=ownerOrders();
 else if(state.view==="audit")body=ownerAudit();
 else if(state.view==="reports")body=ownerReports();
 else if(state.view==="settings")body=ownerSettings();
 document.getElementById("root").innerHTML=`<div class="app"><div class="hero"><div class="logo">SY</div><h1>👑 Owner Command Center</h1><p>SoYam Cosmetics & Beauty · @${esc(state.user.telegram_username)}</p></div><div class="toolbar"><button class="${state.view==="home"?"active":""}" onclick="go('home')">Dashboard</button><button onclick="go('staff')">Staff</button><button onclick="go('inventory')">Inventory</button><button onclick="go('orders')">Orders</button><button onclick="go('audit')">Audit</button><button onclick="go('reports')">Reports</button><button onclick="go('settings')">Settings</button><button onclick="choosePortal('SELLER')">🏪 Seller</button></div><main class="view">${body}</main>${bottom([["home","⌂","Dashboard"],["inventory","□","Inventory"],["orders","▣","Orders"],["audit","✓","Audit"],["reports","◫","Reports"]])}</div>`;
}
function ownerDashboard(){let r=state.reports||{revenue:0,stockCapital:0,orderCount:0,pendingAudit:0};return `<div class="panel"><h3>Business Overview</h3><div class="metricgrid"><div class="metric"><span class="muted">Total Revenue</span><b>${money(r.revenue)}</b></div><div class="metric"><span class="muted">Stock Capital</span><b>${money(r.stockCapital)}</b></div><div class="metric"><span class="muted">Orders</span><b>${r.orderCount}</b></div><div class="metric"><span class="muted">Pending Audit</span><b>${r.pendingAudit}</b></div></div></div><div class="panel"><h3>Quick Controls</h3><div class="actions"><button class="primary" onclick="go('staff')">Manage Staff</button><button class="gold" onclick="go('inventory')">Inventory</button><button class="primary" onclick="go('audit')">Daily Audit</button><button class="danger" onclick="closeDay()">Close Daily Transactions</button></div></div>`}
function ownerStaff(){return `<div class="panel"><h3>Staff Management</h3><table class="table"><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.staff.map(u=>`<tr><td>@${esc(u.telegram_username)}</td><td>${u.roles.join(", ")}</td><td><span class="badge ${u.account_status==="ACTIVE"?"ok":"bad"}">${u.account_status}</span></td><td>${u.telegram_username==="mama51R"?"MASTER":`<button class="danger" onclick="toggleUser(${u.id})">${u.account_status==="ACTIVE"?"Suspend":"Activate"}</button>`}</td></tr>`).join("")}</tbody></table><div class="panel"><h3>Add Seller Invitation</h3><input class="input" id="inviteUser" placeholder="Telegram username"><button class="primary full" style="margin-top:8px" onclick="createInvite()">Create Invitation</button></div></div>`}
async function toggleUser(id){await patch(`/api/staff/${id}/status`);toast("User status changed");await refresh()}
async function createInvite(){let username=document.getElementById("inviteUser").value;let inv=await post("/api/staff/invite",{username});alert("Invitation: "+inv.code);await refresh()}
function ownerOrders(){return `<div class="panel"><h3>All Orders</h3><table class="table"><thead><tr><th>ID</th><th>Type</th><th>Total</th><th>Status</th></tr></thead><tbody>${state.orders.map(o=>`<tr><td>${o.id}</td><td>${o.fulfillment}</td><td>${money(o.total)}</td><td>${o.status}</td></tr>`).join("")||"<tr><td colspan=4>No orders</td></tr>"}</tbody></table></div>`}
function ownerAudit(){let l=state.ledger||{cash:0,bank:0,telebirr:0,status:"OPEN"};return `<div class="panel"><h3>Daily Financial Audit</h3><div class="metricgrid"><div class="metric"><span class="muted">Cash</span><b>${money(l.cash)}</b></div><div class="metric"><span class="muted">Bank</span><b>${money(l.bank)}</b></div><div class="metric"><span class="muted">Telebirr</span><b>${money(l.telebirr)}</b></div><div class="metric"><span class="muted">Ledger</span><b>${l.status}</b></div></div></div><div class="panel"><h3>Audit Log</h3>${state.audit.map(a=>`<p class="muted">${a.at} · <b>${a.action}</b> · ${esc(a.detail)}</p>`).join("")||"<p class='muted'>No entries.</p>"}</div>`}
function ownerReports(){let r=state.reports||{revenue:0};return `<div class="panel"><h3>Reports & Analytics</h3><p><b>Revenue:</b> ${money(r.revenue)}</p><p class="muted">Wire up a charting library for trend visuals when you have enough historical data.</p></div>`}
function ownerSettings(){return `<div class="panel"><h3>Platform Settings</h3><p>Store: ${esc(state.store?.name||"SoYam Cosmo")}</p><p>Location: ${esc(state.store?.address||"")}</p><p>Phone: ${esc(state.store?.phone||"")}</p><p>Master Owner: @mama51R</p></div>`}
async function closeDay(){let l=state.ledger;if(l?.status==="CLOSED"){toast("Ledger already closed");return}if(confirm("Close and lock today's transactions?")){await post("/api/ledger/close");toast("Daily transactions locked");await refresh()}}

window.go=go;window.choosePortal=choosePortal;window.setCat=setCat;window.changeCart=changeCart;window.checkout=checkout;window.deliveryForm=deliveryForm;window.submitDelivery=submitDelivery;window.placeOrder=placeOrder;window.closeModal=closeModal;window.uploadProof=uploadProof;window.track=track;window.submitRequest=submitRequest;window.verifyPayment=verifyPayment;window.rejectPayment=rejectPayment;window.lookupBarcode=lookupBarcode;window.offerRequest=offerRequest;window.assignDriver=assignDriver;window.updateDelivery=updateDelivery;window.toggleUser=toggleUser;window.createInvite=createInvite;window.closeDay=closeDay;window.adjustStock=adjustStock;
boot();
</script>
</body>
</html>

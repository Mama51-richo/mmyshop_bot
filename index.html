<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>soYam Cosmo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #D4AF37;
            --primary-dark: #B8962E;
            --secondary: #6B2FA0;
            --cream: #FFF8F0;
            --gold-shimmer: #FFD700;
            --warm-gray: #8C7A6B;
            --dark: #1A1A2E;
            --white: #FFFFFF;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius: 20px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --bg-primary: #FFF8F0;
            --bg-card: #FFFFFF;
            --text-primary: #1A1A2E;
            --text-secondary: #5A5A6E;
            --border-color: rgba(212, 175, 55, 0.2);
        }
        body.dark-theme {
            --bg-primary: #12121F;
            --bg-card: #1E1E32;
            --text-primary: #F5F0EB;
            --text-secondary: #B5B0AB;
            --border-color: rgba(212, 175, 55, 0.15);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding-bottom: 80px;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        #main-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 248, 240, 0.85);
            backdrop-filter: blur(16px);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.3s;
        }
        body.dark-theme #main-header {
            background: rgba(18, 18, 31, 0.85);
        }
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo-icon {
            font-size: 24px;
            background: linear-gradient(135deg, var(--primary), var(--gold-shimmer));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--gold-shimmer));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text span {
            font-weight: 300;
            color: var(--warm-gray);
            -webkit-text-fill-color: var(--warm-gray);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .role-badge-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: var(--transition);
        }
        .role-badge-header:hover {
            border-color: var(--primary);
        }
        .role-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .role-dot.buyer {
            background: #2196F3;
        }
        .role-dot.seller {
            background: #4CAF50;
        }
        .role-dot.owner {
            background: #FF6F00;
        }
        .lang-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        .lang-btn:hover {
            border-color: var(--primary);
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            position: relative;
            padding: 3px;
            transition: var(--transition);
        }
        .icon-btn:hover {
            transform: scale(1.1);
        }
        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--secondary);
            color: white;
            font-size: 9px;
            font-weight: 700;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .badge.hidden {
            display: none;
        }

        /* ============================================================
           BOTTOM NAV
           ============================================================ */
        #bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 12px;
            border-top: 1px solid var(--border-color);
            z-index: 200;
            transition: background 0.3s;
        }
        body.dark-theme #bottom-nav {
            background: rgba(18, 18, 31, 0.92);
        }
        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            padding: 3px 10px;
            opacity: 0.5;
            font-family: 'Poppins', sans-serif;
            position: relative;
            transition: var(--transition);
        }
        .nav-item .nav-icon {
            font-size: 20px;
        }
        .nav-item .nav-label {
            font-size: 9px;
            font-weight: 600;
            color: var(--warm-gray);
        }
        .nav-item.active {
            opacity: 1;
        }
        .nav-item.active .nav-label {
            color: var(--primary);
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            top: -4px;
            width: 16px;
            height: 2px;
            background: var(--primary);
            border-radius: 4px;
        }

        /* ============================================================
           PAGE
           ============================================================ */
        #page-container {
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
        }
        .page {
            display: none;
            animation: fadeSlideUp 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           HERO BANNER
           ============================================================ */
        .hero-banner {
            background: linear-gradient(145deg, var(--secondary), var(--primary-dark));
            border-radius: var(--radius);
            padding: 18px 16px;
            color: white;
            margin-bottom: 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero-banner::before {
            content: '✨';
            position: absolute;
            right: 12px;
            top: 6px;
            font-size: 32px;
            opacity: 0.12;
        }
        .hero-banner .hero-logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFF8E1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-banner .hero-logo-sub {
            font-size: 11px;
            font-weight: 300;
            opacity: 0.8;
            letter-spacing: 4px;
            color: #FFF8E1;
            -webkit-text-fill-color: #FFF8E1;
        }
        .hero-banner .hero-tagline {
            font-size: 12px;
            font-weight: 500;
            margin-top: 2px;
            opacity: 0.9;
            font-style: italic;
        }
        .hero-banner .hero-details {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 12px;
            font-size: 10px;
            opacity: 0.8;
        }
        .hero-banner .hero-details span {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 10px;
            border-radius: 30px;
        }
        .hero-banner .hero-actions {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .hero-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            font-size: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        .hero-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .hero-btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--dark);
        }
        .hero-btn-call {
            background: #2E7D32;
            border-color: #2E7D32;
        }
        .hero-btn-chat {
            background: #0088CC;
            border-color: #0088CC;
        }

        /* ============================================================
           PRODUCTS
           ============================================================ */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 0 8px;
        }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 700;
        }
        .section-title .highlight {
            color: var(--primary);
        }
        .category-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 0 10px;
            scrollbar-width: none;
        }
        .category-scroll::-webkit-scrollbar {
            display: none;
        }
        .category-chip {
            flex-shrink: 0;
            background: var(--bg-card);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            cursor: pointer;
            white-space: nowrap;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        .category-chip:hover {
            border-color: var(--primary);
        }
        .category-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }
        .product-card:hover {
            transform: translateY(-2px);
        }
        .product-image {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background: #f0ebe4;
        }
        .product-info {
            padding: 4px 6px 6px;
        }
        .product-name {
            font-size: 9px;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.1;
        }
        .product-price {
            font-size: 10px;
            font-weight: 700;
            color: var(--primary);
        }
        .product-stock {
            font-size: 8px;
            font-weight: 500;
        }
        .stock-in {
            color: #2E7D32;
        }
        .stock-low {
            color: #E65100;
        }
        .stock-out {
            color: #C62828;
        }
        .product-badge {
            position: absolute;
            top: 3px;
            left: 3px;
            font-size: 6px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 30px;
            text-transform: uppercase;
        }
        .badge-new {
            background: var(--primary);
            color: white;
        }
        .badge-best {
            background: #E53935;
            color: white;
        }
        .badge-low {
            background: #FB8C00;
            color: white;
        }
        .image-wrapper {
            position: relative;
        }
        .product-quick-actions {
            display: flex;
            gap: 3px;
            margin-top: 3px;
        }
        .product-quick-actions button {
            flex: 1;
            padding: 2px 0;
            border: none;
            border-radius: 10px;
            font-size: 7px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        .product-quick-actions button:hover {
            opacity: 0.8;
        }
        .btn-buy-now {
            background: var(--secondary);
            color: white;
        }
        .btn-wish {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--gold-shimmer));
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
        }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        .btn-secondary:hover {
            border-color: var(--primary);
        }
        .btn-success {
            background: #2E7D32;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        .btn-success:hover {
            background: #1B5E20;
        }
        .btn-danger {
            background: #C62828;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        .btn-danger:hover {
            background: #B71C1C;
        }
        .btn-warning {
            background: #FF6F00;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        .btn-warning:hover {
            background: #E65100;
        }
        .btn-switch {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
            color: var(--text-primary);
        }
        .btn-switch:hover {
            border-color: var(--primary);
        }
        .btn-switch.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* ============================================================
           MODALS
           ============================================================ */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.visible {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius) var(--radius) 0 0;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 16px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-primary);
        }
        .modal.visible .modal-content {
            transform: translateY(0);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 17px;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--warm-gray);
            transition: var(--transition);
        }
        .close-modal:hover {
            transform: rotate(90deg);
        }

        /* ============================================================
           QR SCANNER
           ============================================================ */
        .scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .scanner-overlay.hidden {
            display: none;
        }
        .scanner-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #qrVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scanner-frame {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 2px solid var(--primary);
            border-radius: 16px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
            animation: pulse-border 1.5s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%,
            100% {
                border-color: var(--primary);
            }
            50% {
                border-color: var(--gold-shimmer);
            }
        }
        .scanner-overlay-ui {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            padding: 0 20px;
        }
        .scanner-overlay-ui p {
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: 500;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }
        .scanner-overlay-ui .btn-secondary {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            font-size: 11px;
        }
        .scanner-overlay-ui .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .scanner-overlay-ui .btn-gallery {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            margin-top: 4px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            border-radius: 30px;
            font-weight: 600;
            font-size: 11px;
            transition: var(--transition);
        }
        .scanner-overlay-ui .btn-gallery:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--dark);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 11px;
            z-index: 500;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #2E7D32;
        }
        .toast.error {
            background: #C62828;
        }
        .toast.warning {
            background: #E65100;
        }
        .toast.info {
            background: #0D47A1;
        }

        /* ============================================================
           ORDER CARDS
           ============================================================ */
        .order-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            margin-bottom: 6px;
            box-shadow: var(--shadow);
            border-left: 3px solid var(--primary);
            transition: var(--transition);
        }
        .order-card:hover {
            transform: translateX(3px);
        }
        .order-card .order-top {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }
        .order-card .order-product {
            font-weight: 600;
            font-size: 12px;
        }
        .order-card .order-meta {
            font-size: 10px;
            color: var(--warm-gray);
        }
        .order-card .order-price {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
        }
        .order-card .order-actions {
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .order-card .order-actions button {
            padding: 3px 10px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 9px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        .order-card .order-actions button:hover {
            opacity: 0.8;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 8px;
            font-weight: 600;
        }
        .status-pending {
            background: #FFF3CD;
            color: #856404;
        }
        .status-approved {
            background: #D4EDDA;
            color: #155724;
        }
        .status-delivering {
            background: #CCE5FF;
            color: #004085;
        }
        .status-delivered {
            background: #D1ECF1;
            color: #0C5460;
        }
        .status-cancelled {
            background: #F8D7DA;
            color: #721C24;
        }
        .status-waiting-payment {
            background: #FFF3E0;
            color: #E65100;
        }
        .status-waiting-owner {
            background: #FFF8E1;
            color: #F57F17;
        }
        .status-completed {
            background: #E8F5E9;
            color: #1B5E20;
        }

        /* ============================================================
           ADMIN PANEL
           ============================================================ */
        .admin-panel {
            margin-top: 14px;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .admin-panel .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            margin-bottom: 8px;
        }
        .admin-panel .panel-title .highlight {
            color: var(--primary);
        }
        .admin-panel .panel-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin: 6px 0 10px;
        }
        .stat-card {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .stat-card .stat-number {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-card .stat-label {
            font-size: 9px;
            color: var(--warm-gray);
            font-weight: 500;
        }
        .stat-card .stat-sub {
            font-size: 8px;
            color: var(--warm-gray);
        }

        /* ============================================================
           NOTIFICATION ITEMS
           ============================================================ */
        .notif-item {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            margin-bottom: 4px;
            border-left: 3px solid var(--primary);
            font-size: 11px;
        }
        .notif-item .notif-id {
            font-weight: 700;
            color: var(--primary);
            font-size: 9px;
        }
        .notif-item .notif-detail {
            font-size: 10px;
            color: var(--warm-gray);
        }

        /* ============================================================
           STOCK TABLE
           ============================================================ */
        .stock-table {
            width: 100%;
            font-size: 10px;
            border-collapse: collapse;
            margin-top: 6px;
        }
        .stock-table th {
            text-align: left;
            padding: 4px 3px;
            border-bottom: 2px solid var(--border-color);
            font-weight: 700;
            font-size: 9px;
        }
        .stock-table td {
            padding: 3px 3px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .stock-table .stock-total {
            font-weight: 700;
            color: var(--primary);
            font-size: 11px;
        }
        .stock-table .stock-actions button {
            padding: 2px 8px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
            margin-right: 2px;
        }
        .stock-table .stock-actions button:hover {
            opacity: 0.8;
        }
        .btn-edit-stock {
            background: #FF6F00;
            color: white;
        }
        .btn-remove-stock {
            background: #C62828;
            color: white;
        }

        /* ============================================================
           CALENDAR VIEW
           ============================================================ */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin: 6px 0 10px;
        }
        .calendar-day {
            background: var(--bg-primary);
            border-radius: 4px;
            padding: 4px 2px;
            text-align: center;
            font-size: 9px;
            border: 1px solid var(--border-color);
        }
        .calendar-day .day-num {
            font-weight: 600;
            font-size: 11px;
        }
        .calendar-day .day-revenue {
            font-size: 7px;
            color: var(--primary);
            font-weight: 600;
        }
        .calendar-day.today {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.1);
        }
        .calendar-day.has-sales {
            border-color: #2E7D32;
        }
        .calendar-header {
            font-size: 8px;
            font-weight: 600;
            color: var(--warm-gray);
            text-align: center;
            padding: 2px 0;
        }

        /* ============================================================
           PROFILE
           ============================================================ */
        .profile-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            text-align: center;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .profile-card .avatar {
            font-size: 40px;
        }
        .profile-card .name {
            font-size: 16px;
            font-weight: 700;
        }
        .profile-card .role {
            font-size: 11px;
            color: var(--warm-gray);
        }
        .profile-card .phone {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
        }
        .profile-card .contact-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .profile-card .contact-actions a {
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
        }
        .profile-card .contact-actions a:hover {
            transform: translateY(-2px);
        }
        .profile-card .contact-actions .call-btn {
            background: #2E7D32;
            color: white;
        }
        .profile-card .contact-actions .chat-btn {
            background: #0088CC;
            color: white;
        }
        .profile-card .contact-actions .map-btn {
            background: var(--primary);
            color: var(--dark);
        }
        .profile-menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 12px;
            transition: var(--transition);
        }
        .profile-menu-item:hover {
            padding-left: 6px;
        }
        .profile-menu-item .menu-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-menu-item .menu-icon {
            font-size: 16px;
        }

        /* ============================================================
           BUYER ORDER WORKFLOW
           ============================================================ */
        .payment-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 10px 0;
        }
        .payment-option {
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .payment-option:hover {
            border-color: var(--primary);
        }
        .payment-option.selected {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.08);
        }
        .payment-option .pay-icon {
            font-size: 24px;
            display: block;
        }
        .payment-option .pay-name {
            font-size: 11px;
            font-weight: 600;
            margin-top: 2px;
        }
        .payment-option .pay-detail {
            font-size: 9px;
            color: var(--warm-gray);
        }

        .payment-ref-input {
            display: flex;
            gap: 6px;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        .payment-ref-input input {
            flex: 1;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            background: var(--bg-primary);
            min-width: 100px;
        }
        .payment-ref-input input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .payment-ref-input button {
            padding: 6px 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 11px;
            transition: var(--transition);
        }
        .payment-ref-input button:hover {
            background: var(--primary-dark);
        }

        .screenshot-upload {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 11px;
            color: var(--warm-gray);
            margin: 8px 0;
        }
        .screenshot-upload:hover {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.04);
        }
        .screenshot-upload .upload-icon {
            font-size: 24px;
            display: block;
        }
        .screenshot-preview {
            max-width: 100%;
            max-height: 120px;
            border-radius: var(--radius-sm);
            margin-top: 6px;
            border: 1px solid var(--border-color);
        }

        /* ============================================================
           REQUEST FORM
           ============================================================ */
        .request-form label {
            display: block;
            font-weight: 600;
            margin-top: 8px;
            margin-bottom: 2px;
            font-size: 11px;
        }
        .request-form input,
        .request-form textarea {
            width: 100%;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            background: var(--bg-primary);
            transition: var(--transition);
        }
        .request-form input:focus,
        .request-form textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .request-form textarea {
            resize: vertical;
            min-height: 50px;
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 24px 12px;
            color: var(--warm-gray);
        }
        .empty-state .empty-icon {
            font-size: 32px;
        }
        .empty-state h3 {
            font-size: 14px;
        }
        .empty-state p {
            font-size: 11px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .product-name {
                font-size: 8px;
            }
            .product-price {
                font-size: 9px;
            }
            .product-stock {
                font-size: 7px;
            }
            .hero-banner .hero-logo {
                font-size: 20px;
            }
            .payment-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 380px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .payment-options {
                grid-template-columns: 1fr 1fr;
            }
        }

        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 9px;
            font-weight: 600;
            background: var(--primary);
            color: white;
        }
        .role-badge.owner {
            background: #FF6F00;
        }
        .role-badge.seller {
            background: #4CAF50;
        }
        .role-badge.buyer {
            background: #2196F3;
        }

        .search-input {
            width: 100%;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-card);
            transition: var(--transition);
        }
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .access-denied {
            text-align: center;
            padding: 24px 12px;
        }
        .access-denied .icon {
            font-size: 40px;
        }
        .access-denied h3 {
            font-size: 16px;
            color: #C62828;
        }
        .access-denied p {
            color: var(--warm-gray);
            font-size: 12px;
        }

        .request-notif {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            margin-bottom: 4px;
            border-left: 3px solid #0088CC;
        }
        .request-notif .req-product {
            font-weight: 600;
            font-size: 12px;
        }
        .request-notif .req-detail {
            font-size: 10px;
            color: var(--warm-gray);
        }
        .request-notif .req-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .request-notif .req-actions a {
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 9px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: var(--transition);
        }
        .request-notif .req-actions a:hover {
            opacity: 0.8;
        }
        .request-notif .req-actions .chat-req {
            background: #0088CC;
            color: white;
        }
        .request-notif .req-actions .call-req {
            background: #2E7D32;
            color: white;
        }

        .payment-notif {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            margin-bottom: 4px;
            border-left: 3px solid #FF6F00;
            transition: var(--transition);
        }
        .payment-notif .payment-info .amount {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }
        .payment-notif .payment-info .payer {
            font-size: 10px;
            color: var(--warm-gray);
        }
        .payment-notif .payment-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .payment-notif .payment-actions button {
            padding: 2px 10px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        .payment-notif .payment-actions button:hover {
            opacity: 0.8;
        }
        .payment-notif .payment-actions .btn-confirm {
            background: #2E7D32;
            color: white;
        }
        .payment-notif .payment-actions .btn-reject {
            background: #C62828;
            color: white;
        }
        .payment-notif .payment-actions .btn-approve {
            background: #FF6F00;
            color: white;
        }

        /* ============================================================
           ADD STOCK MODAL
           ============================================================ */
        .add-stock-form label {
            display: block;
            font-weight: 600;
            margin-top: 8px;
            margin-bottom: 2px;
            font-size: 11px;
        }
        .add-stock-form input,
        .add-stock-form textarea {
            width: 100%;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            background: var(--bg-primary);
            transition: var(--transition);
        }
        .add-stock-form input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .add-stock-form .image-preview {
            margin-top: 6px;
            max-width: 100%;
            max-height: 120px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            border: 1px solid var(--border-color);
        }
        .add-stock-form .file-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 11px;
            color: var(--warm-gray);
            margin-top: 4px;
        }
        .add-stock-form .file-upload-area:hover {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.04);
        }
        .add-stock-form .file-upload-area .upload-icon {
            font-size: 24px;
            display: block;
        }
        .add-stock-form .qr-display {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 8px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            border: 1px solid var(--border-color);
            margin-top: 4px;
        }
        .add-stock-form .qr-display span {
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    APP
    ============================================================ -->
    <div id="app">
        <header id="main-header">
            <div class="logo-wrapper">
                <span class="logo-icon">✨</span>
                <span class="logo-text">soYam <span>Cosmo</span></span>
            </div>
            <div class="header-actions">
                <span class="role-badge-header" id="roleBadgeHeader" onclick="toggleRoleSwitch()">
                    <span class="role-dot buyer" id="roleDot"></span>
                    <span id="roleLabelHeader">Buyer</span>
                </span>
                <button id="languageBtn" class="lang-btn">
                    <span id="currentFlag">🇬🇧</span>
                    <span id="currentLang">EN</span>
                </button>
                <button class="icon-btn" onclick="toggleNotifications()">
                    🔔
                    <span id="notifBadge" class="badge hidden">0</span>
                </button>
            </div>
        </header>

        <main id="main-content">
            <div id="page-container"></div>
        </main>

        <nav id="bottom-nav">
            <button class="nav-item active" data-page="home" onclick="navigateTo('home')">
                <span class="nav-icon">🏠</span>
                <span class="nav-label" data-key="nav_home">Home</span>
            </button>
            <button class="nav-item" data-page="search" onclick="navigateTo('search')">
                <span class="nav-icon">🔍</span>
                <span class="nav-label" data-key="nav_search">Search</span>
            </button>
            <button class="nav-item" data-page="orders" onclick="navigateTo('orders')">
                <span class="nav-icon">📦</span>
                <span class="nav-label" data-key="nav_orders">Orders</span>
            </button>
            <button class="nav-item" data-page="wishlist" onclick="navigateTo('wishlist')">
                <span class="nav-icon">❤️</span>
                <span class="nav-label" data-key="nav_wishlist">Wishlist</span>
            </button>
            <button class="nav-item" data-page="profile" onclick="navigateTo('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-label" data-key="nav_profile">Profile</span>
            </button>
        </nav>
    </div>

    <!-- ============================================================
    MODALS
    ============================================================ -->
    <div id="languageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Select Language</h3><button class="close-modal" onclick="closeModal('languageModal')">&times;</button></div>
            <div id="languageList"></div>
        </div>
    </div>

    <div id="notifModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Notifications</h3><button class="close-modal" onclick="closeModal('notifModal')">&times;</button></div>
            <div id="notifList"></div>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('productModal')" style="float:right;font-size:22px;">&times;</button>
            <div id="productDetail"></div>
        </div>
    </div>

    <!-- ============================================================
    BUYER ORDER MODAL — No Scanner, Just Payment
    ============================================================ -->
    <div id="buyerOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="buyerOrderTitle">🛒 Place Order</h3>
                <button class="close-modal" onclick="closeModal('buyerOrderModal'); resetBuyerOrder();">&times;</button>
            </div>
            <div id="buyerOrderContent"></div>
        </div>
    </div>

    <div id="requestModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>📝 Request a Product</h3><button class="close-modal" onclick="closeModal('requestModal')">&times;</button></div>
            <div class="request-form">
                <label>Product Name *</label>
                <input type="text" id="reqName" placeholder="Enter product name" />
                <label>Quantity *</label>
                <input type="number" id="reqQty" placeholder="Enter quantity" min="1" />
                <label>Product Image</label>
                <input type="file" id="reqImageInput" accept="image/*" style="padding:4px;" />
                <label>Additional Notes</label>
                <textarea id="reqNotes" placeholder="Describe what you're looking for..."></textarea>
                <button class="btn-primary" style="margin-top:10px;" onclick="submitRequest()">📤 Submit Request</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    ADD STOCK MODAL — Owner
    ============================================================ -->
    <div id="addStockModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>📦 Add Stock</h3><button class="close-modal" onclick="closeModal('addStockModal')">&times;</button></div>
            <div class="add-stock-form">
                <label>Product Name *</label>
                <input type="text" id="stockProductName" placeholder="Enter product name" />
                <label>Selling Price (ETB) *</label>
                <input type="number" id="stockSellPrice" placeholder="Enter selling price" min="1" />
                <label>Buying Price (ETB) *</label>
                <input type="number" id="stockBuyPrice" placeholder="Enter buying price" min="1" />
                <label>Quantity *</label>
                <input type="number" id="stockQty" placeholder="Enter quantity" min="1" />
                <label>Product Image</label>
                <div class="file-upload-area" onclick="document.getElementById('stockImageInput').click()">
                    <span class="upload-icon">📷</span>
                    Tap to upload product image
                    <input type="file" id="stockImageInput" accept="image/*" style="display:none;" onchange="previewStockImage(event)" />
                </div>
                <img id="stockImagePreview" class="image-preview" style="display:none;" />
                <label>QR Code (auto-generated)</label>
                <div class="qr-display">
                    <span id="stockQrDisplay">SOYAM-PXXX</span>
                </div>
                <button class="btn-primary" style="margin-top:12px;" onclick="submitStock()">✅ Add Stock</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    EDIT STOCK MODAL — Owner
    ============================================================ -->
    <div id="editStockModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>✏️ Edit Stock</h3><button class="close-modal" onclick="closeModal('editStockModal')">&times;</button></div>
            <div class="add-stock-form">
                <label>Product Name</label>
                <input type="text" id="editStockProductName" />
                <label>Selling Price (ETB)</label>
                <input type="number" id="editStockSellPrice" />
                <label>Buying Price (ETB)</label>
                <input type="number" id="editStockBuyPrice" />
                <label>Quantity</label>
                <input type="number" id="editStockQty" />
                <button class="btn-primary" style="margin-top:12px;" onclick="saveStockEdit()">💾 Save Changes</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    QR SCANNER — Seller Only
    ============================================================ -->

                if (TRANSLATIONS[code] && TRANSLATIONS[code][key]) {

            container.querySelectorAll('.page').forEach(function(p) { p.remove(); });

            if (pageName === 'seller' && currentUser.role !== 'seller' && currentUser.role !== 'owner') {
                page.innerHTML = renderAccessDenied('Seller Dashboard', 'Only sellers can access this page.');

                page.innerHTML = renderAccessDenied('Owner Dashboard', 'Only the owner can access this page.');

                        break;

                        page.innerHTML = renderSearch();
                        break;
                    case 'orders':
                        page.innerHTML = renderOrders();
                        break;
                    case 'wishlist':

                        break;
                    case 'profile':
                        page.innerHTML = renderProfile();
                        break;

        function previewBuyerScreenshot(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('buyerScreenshotPreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    buyerOrderData.screenshot = e.target.result;

                reader.readAsDataURL(file);

        function submitBuyerOrder() {
            const ref = document.getElementById('buyerPaymentRef').value.trim();
            if (!ref) {
                showToast('⚠️ Please enter payment reference', 'error');
                return;
            }
            if (!buyerOrderData.paymentMethod) {
                showToast('⚠️ Please select a payment method', 'error');
                return;
            }

            buyerOrderData.paymentRef = ref;
            const product = buyerOrderProduct;
            const orderId = generateUniqueId('ORD');
            const buyerId = generateUniqueId('BUY');

            const newOrder = {
                id: orderId,
                product: product.name,
                price: product.price,
                status: 'waiting-payment',
                date: new Date().toISOString().split('T')[0],
                type: 'delivery',
                tracking: 'SOYAM-' + String(Math.floor(1000 + Math.random() * 9000)),
                qrCode: product.qrCode,
                paymentRef: ref,
                paymentMethod: paymentMethods.find(p => p.id === buyerOrderData.paymentMethod)?.name || 'Unknown',
                customer: currentUser.username || 'Customer',
                buyerId: buyerId,
                notifId: generateUniqueId('NOTIF'),
                screenshot: buyerOrderData.screenshot || null
            };
            orders.unshift(newOrder);
            product.stock--;

            // Notify seller
            addNotification('📦 New order: ' + product.name + ' (🆔 ' + orderId + ') from ' + newOrder.customer, 'info');
            addNotification('💳 Payment pending: ' + product.name + ' (🆔 ' + orderId + ')', 'warning');
            addCustomerRequest(product.name, newOrder.customer, 'Order #' + orderId + ' - Payment pending', product.qrCode);

            closeModal('buyerOrderModal');
            resetBuyerOrder();
            showToast('✅ Order placed! (🆔 ' + orderId + ')', 'success');

        function sellerConfirmPayment(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'waiting-owner';
                showToast('✅ Payment confirmed! Waiting for owner approval.', 'success');
                addNotification('✅ Payment confirmed for ' + order.product + ' (🆔 ' + orderId + ')', 'success');
                // Notify owner
                addNotification('👑 Owner: Payment approval needed for ' + order.product + ' (🆔 ' + orderId + ')', 'warning');
                navigateTo('home');
            }
        }

        function sellerCompleteDelivery(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                const completionCode = generateUniqueId('COMP');
                order.status = 'delivered';
                order.completionCode = completionCode;
                addNotification('✅ Delivery completed for ' + order.product + ' (🆔 ' + orderId + ')', 'success');
                addNotification('🔑 Completion code: ' + completionCode, 'info');
                showToast('✅ Delivery completed! Code: ' + completionCode, 'success');
                // Deduct stock
                const p = products.find(pr => pr.name === order.product);
                if (p) p.stock = Math.max(0, p.stock - 1);
                navigateTo('home');
            }
        }

        function sendToDeliverer(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                showToast('📤 Order ID ' + order.id + ' sent to deliverer!', 'success');
                addNotification('📤 Order sent to deliverer: ' + order.product + ' (🆔 ' + order.id + ')', 'info');
                // In production, send via Telegram to deliverer
                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify({
                        type: 'delivery_order',
                        orderId: order.id,
                        product: order.product,
                        tracking: order.tracking,
                        customer: order.customer
                    }));
                }
            }
        }

        // ============================================================
        // SELLER QR SCANNER — In-Person Sales
        // ============================================================
        function openSellerQRScanner() {
            const scanner = document.getElementById('qrScanner');
            scanner.classList.remove('hidden');

            const video = document.getElementById('qrVideo');
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                    .then(function(stream) {
                        video.srcObject = stream;
                        video.play();
                        setTimeout(function() {
                            const scannedQR = 'SOYAM-P001';
                            const product = products.find(p => p.qrCode === scannedQR);
                            if (product) {
                                if (product.stock <= 0) {
                                    showToast('❌ Product out of stock!', 'error');
                                    closeScanner();
                                    return;
                                }
                                const orderId = generateUniqueId('ORD');
                                const buyerId = generateUniqueId('BUY');
                                const newOrder = {
                                    id: orderId,
                                    product: product.name,
                                    price: product.price,
                                    status: 'waiting-owner',
                                    date: new Date().toISOString().split('T')[0],
                                    type: 'in-person',
                                    qrCode: product.qrCode,
                                    customer: 'In-Person Customer',
                                    buyerId: buyerId,
                                    paymentMethod: 'Cash',
                                    paymentRef: 'IN-PERSON-' + Date.now(),
                                    notifId: generateUniqueId('NOTIF')
                                };
                                orders.unshift(newOrder);
                                product.stock--;
                                showToast('✅ In-person sale: ' + product.name + ' (🆔 ' + orderId + ')', 'success');
                                addNotification('🏪 In-person sale: ' + product.name + ' (🆔 ' + orderId + ')',
                                'success');
                                addNotification('👑 Owner: Approve in-person sale for ' + product.name + ' (🆔 ' +
                                    orderId + ')', 'warning');
                            } else {
                                showToast('❌ Product not found for QR: ' + scannedQR, 'error');
                            }
                            closeScanner();
                            navigateTo('home');
                        }, 3000);
                    })
                    .catch(function(err) {
                        showToast('❌ Camera access denied.', 'error');
                        closeScanner();
                    });
            } else {
                showToast('❌ Camera not supported.', 'error');
                closeScanner();
            }
        }

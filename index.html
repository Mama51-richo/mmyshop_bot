<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>soYam cosmo · Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0d0b09;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .app-frame {
            max-width: 420px;
            width: 100%;
            background: #f6f1eb;
            border-radius: 44px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px #d4af37 inset;
            overflow: hidden;
            padding: 18px 14px 22px;
            position: relative;
        }

        /* ─── BRAND ─── */
        .brand-crown {
            text-align: center;
            margin-bottom: 8px;
        }
        .brand-crown .logo-symbol {
            font-size: 44px;
            font-weight: 700;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 0.18em;
            background: linear-gradient(145deg, #d4af37, #b8952a, #a07d2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .brand-crown .sub-brand {
            font-size: 13px;
            font-weight: 600;
            color: #3d2e1b;
            letter-spacing: 2.5px;
            background: #e8dccc;
            display: inline-block;
            padding: 0 16px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            -webkit-text-fill-color: #3d2e1b;
            text-transform: uppercase;
        }
        .brand-crown .amharic {
            font-size: 17px;
            font-weight: 400;
            color: #5a4a34;
            margin-top: 2px;
            letter-spacing: 1.5px;
            font-family: 'Segoe UI', 'Noto Sans Ethiopic', sans-serif;
        }
        .brand-crown .address-mini {
            font-size: 9px;
            font-weight: 400;
            color: #6f5e48;
            background: rgba(255, 248, 235, 0.7);
            padding: 3px 14px;
            border-radius: 40px;
            display: inline-block;
            margin-top: 5px;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .brand-crown .address-mini i {
            color: #b8952a;
            margin: 0 2px;
        }

        /* ─── LANGUAGE ROW ─── */
        .lang-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3px 6px;
            background: #2b241d;
            padding: 5px 8px;
            border-radius: 60px;
            margin: 8px 0 10px;
        }
        .lang-chip {
            font-size: 8.5px;
            font-weight: 600;
            color: #e6dccb;
            background: #3f352b;
            padding: 3px 10px;
            border-radius: 40px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            cursor: default;
            white-space: nowrap;
        }
        .lang-chip.active {
            background: #d4af37;
            color: #1a150f;
            border-color: #d4af37;
        }

        /* ─── SOCIAL ROW ─── */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin: 4px 0 14px;
        }
        .social-icon {
            color: #3d2e1b;
            font-size: 22px;
            opacity: 0.75;
            text-decoration: none;
            transition: 0.2s;
        }
        .social-icon:hover {
            opacity: 1;
            transform: scale(1.08);
        }

        /* ─── PORTAL CONTAINER ─── */
        .portal-container {
            background: #fcf9f5;
            border-radius: 28px;
            padding: 16px 12px;
            box-shadow: inset 0 1px 8px rgba(0, 0, 0, 0.03);
            min-height: 380px;
            border: 1px solid #e9dfd1;
        }

        /* ─── ROLE SWITCHER ─── */
        .role-switcher {
            display: flex;
            gap: 8px;
            background: #eaddd0;
            padding: 6px 8px;
            border-radius: 60px;
            margin-bottom: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .role-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 11px;
            font-family: 'Montserrat', sans-serif;
            color: #2d241c;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .role-btn.active {
            background: #1a150f;
            color: #f0e6d8;
            border-color: #d4af37;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* ─── TABS ─── */
        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e2d4c2;
            padding-bottom: 10px;
        }
        .nav-tab {
            font-size: 10px;
            font-weight: 600;
            background: transparent;
            border: none;
            padding: 5px 12px;
            border-radius: 40px;
            color: #5c4b35;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Montserrat', sans-serif;
        }
        .nav-tab.active {
            background: #d4af37;
            color: #1f1a14;
        }
        .nav-tab i {
            margin-right: 4px;
        }

        /* ─── PRODUCT GRID ─── */
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 4px;
        }
        .product-card {
            background: white;
            border-radius: 20px;
            padding: 10px 8px 12px;
            border: 1px solid #ede5d8;
            text-align: center;
            transition: 0.15s;
        }
        .product-card .img-placeholder {
            background: #e9dfd1;
            border-radius: 16px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6f5e48;
            font-size: 26px;
            margin-bottom: 6px;
        }
        .product-card .p-name {
            font-size: 11px;
            font-weight: 600;
            color: #1e1710;
        }
        .product-card .p-price {
            font-size: 13px;
            font-weight: 700;
            color: #b8952a;
            margin: 2px 0 6px;
        }
        .btn-add {
            background: #1a150f;
            border: none;
            color: #f0e6d8;
            font-size: 10px;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Montserrat', sans-serif;
        }
        .btn-add:hover {
            background: #d4af37;
            color: #1a150f;
        }

        /* ─── STAT CARDS ─── */
        .stat-card {
            background: #f3ede6;
            border-radius: 20px;
            padding: 12px 14px;
            margin-bottom: 12px;
            border-left: 4px solid #d4af37;
        }
        .stat-card h4 {
            font-size: 12px;
            font-weight: 600;
            color: #2d241c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-card .badge {
            background: #1a150f;
            color: #f0e6d8;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 9px;
            font-weight: 600;
        }
        .flex-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .flex-row .pill {
            background: white;
            border-radius: 60px;
            padding: 4px 12px;
            font-size: 10px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            cursor: pointer;
        }

        /* ─── ACTION BUTTONS ─── */
        .action-btn {
            background: #d4af37;
            border: none;
            padding: 10px 18px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 12px;
            color: #1a150f;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Montserrat', sans-serif;
            margin-top: 6px;
            letter-spacing: 0.4px;
            text-align: center;
        }
        .action-btn:hover {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .action-btn.secondary {
            background: #2b241d;
            color: #f0e6d8;
        }
        .action-btn.danger {
            background: #9f3a2b;
            color: white;
        }
        .action-btn.success {
            background: #1a8a4a;
            color: white;
        }
        .action-btn.small {
            padding: 4px 14px;
            width: auto;
            font-size: 10px;
            margin-top: 0;
        }

        /* ─── METRIC TILES ─── */
        .metric-tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .metric-tile {
            background: #1a150f;
            padding: 12px 14px;
            border-radius: 20px;
            color: #f0e6d8;
        }
        .metric-tile .label {
            font-size: 9px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-tile .value {
            font-size: 18px;
            font-weight: 700;
            margin-top: 2px;
            color: #d4af37;
        }

        /* ─── STAFF LIST ─── */
        .staff-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 40px;
            padding: 6px 14px;
            margin-bottom: 5px;
            font-size: 11px;
            border: 1px solid #ede5d8;
        }
        .staff-item .status {
            font-size: 9px;
            font-weight: 600;
        }
        .staff-item .status.active {
            color: #1a8a4a;
        }
        .staff-item .status.suspended {
            color: #9f3a2b;
        }
        .staff-item .actions button {
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            color: #6f5e48;
            margin-left: 6px;
            transition: 0.15s;
        }
        .staff-item .actions button:hover {
            color: #9f3a2b;
        }

        /* ─── ADD STOCK FORM ─── */
        .stock-form {
            background: #f3ede6;
            border-radius: 20px;
            padding: 14px;
            margin-top: 10px;
        }
        .stock-form .form-group {
            margin-bottom: 10px;
        }
        .stock-form label {
            font-size: 10px;
            font-weight: 600;
            color: #2d241c;
            display: block;
            margin-bottom: 3px;
        }
        .stock-form input,
        .stock-form select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 60px;
            border: 1px solid #d0c0ac;
            background: white;
            font-size: 11px;
            font-family: 'Montserrat', sans-serif;
            outline: none;
        }
        .stock-form input:focus,
        .stock-form select:focus {
            border-color: #d4af37;
        }
        .stock-form .media-row {
            display: flex;
            gap: 8px;
        }
        .stock-form .media-row button {
            flex: 1;
            padding: 8px;
            border-radius: 60px;
            border: 1px solid #d0c0ac;
            background: white;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: 0.15s;
        }
        .stock-form .media-row button:hover {
            border-color: #d4af37;
            background: #fcf9f5;
        }
        .stock-form .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .stock-form .form-actions button {
            flex: 1;
            padding: 8px;
            border-radius: 60px;
            border: none;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: 0.15s;
        }
        .stock-form .form-actions .save-btn {
            background: #d4af37;
            color: #1a150f;
        }
        .stock-form .form-actions .edit-btn {
            background: #2b241d;
            color: #f0e6d8;
        }
        .stock-form .form-actions .discard-btn {
            background: #9f3a2b;
            color: white;
        }

        /* ─── DRIVER SPECIFIC ─── */
        .delivery-card {
            background: white;
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #ede5d8;
            margin-bottom: 8px;
        }
        .delivery-card .d-title {
            font-weight: 600;
            font-size: 12px;
            color: #1a150f;
        }
        .delivery-card .d-detail {
            font-size: 10px;
            color: #6f5e48;
            margin: 2px 0;
        }

        /* ─── MGMT ROW ─── */
        .mgmt-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .mgmt-row input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 60px;
            border: 1px solid #d0c0ac;
            background: white;
            font-size: 10px;
            font-family: 'Montserrat', sans-serif;
            min-width: 70px;
            outline: none;
        }
        .mgmt-row input:focus {
            border-color: #d4af37;
        }
        .mgmt-row button {
            background: #1a150f;
            border: none;
            color: #f0e6d8;
            padding: 8px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: 0.15s;
        }
        .mgmt-row button:hover {
            background: #d4af37;
            color: #1a150f;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bg-dark {
            background: #1a150f;
            color: #f0e6d8;
            border-radius: 60px;
            padding: 3px 12px;
            font-size: 9px;
            font-weight: 600;
        }
        .text-gold {
            color: #b8952a;
        }
        .mt-2 {
            margin-top: 12px;
        }
        .hidden {
            display: none !important;
        }

        .toast {
            background: #1a150f;
            color: #f0e6d8;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            margin-top: 10px;
            border-left: 4px solid #d4af37;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer-note {
            font-size: 8px;
            color: #6f5e48;
            text-align: center;
            margin-top: 14px;
            opacity: 0.5;
            letter-spacing: 0.4px;
        }

        /* QR FLOATING BUTTON - prominent gold */
        .qr-float {
            display: flex;
            justify-content: center;
            margin: 12px 0 8px;
        }
        .qr-float-btn {
            background: #d4af37;
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 14px;
            color: #1a150f;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .qr-float-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 28px rgba(212, 175, 55, 0.5);
        }
        .qr-float-btn i {
            font-size: 20px;
        }

        /* user info banner */
        .user-banner {
            background: #1a150f;
            border-radius: 60px;
            padding: 6px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #f0e6d8;
            font-size: 10px;
            font-weight: 500;
        }
        .user-banner .role-tag {
            background: #d4af37;
            color: #1a150f;
            padding: 0 10px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 8px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

        <!-- BRAND CROWN -->
        <div class="brand-crown">

    <script>
        (function() {
            'use strict';

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 1. DATABASE (simulated backend)
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

                // Hardcoded authorized users (matches spec)
                authorizedUsers: {
                    '999999999': { username: 'mama51R', name: 'Rahel Mulatu', phone: '+251920353460',
                    roles: ['OWNER', 'SELLER'], store: 'STORE001', status: 'ACTIVE' },

                },
                products: [
                    { id: 101, name: 'Gold Serum', category: 'Skincare', price: 850, stock: 12,

                ],
                orders: [
                    { id: 'ORD-1001', status: 'PENDING', total: 1270, buyer: 'buyer_demo',
                    items: ['Gold Serum', 'Rose Toner'] },
                    { id: 'ORD-1002', status: 'PENDING', total: 420, buyer: 'hana_abebe',

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 2. SESSION — get real Telegram user
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            let tgUser = null;
            let tgUserId = null;
            let tgUsername = 'guest';

            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const initData = window.Telegram.WebApp.initDataUnsafe;
                    if (initData && initData.user) {
                        tgUser = initData.user;
                        tgUserId = String(tgUser.id);
                        tgUsername = tgUser.username || tgUser.first_name || 'user';

                }
            } catch (e) {
                console.warn('Telegram WebApp not available, using fallback.');

            // Fallback for testing outside Telegram
            if (!tgUserId) {
                // Use URL param ?user=999999999 for testing
                const params = new URLSearchParams(window.location.search);
                const testUser = params.get('user');
                if (testUser) {
                    tgUserId = testUser;
                    tgUsername = 'test_' + testUser;
                } else {
                    // Default to buyer for demo
                    tgUserId = '111111111';
                    tgUsername = 'buyer_demo';
                }
                console.log('🔧 Fallback mode: tgUserId =', tgUserId);
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 3. ROLE RESOLVER
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            function resolveUser(tgId) {
                const record = DB.authorizedUsers[tgId];
                if (!record) {
                    return {
                        roles: ['BUYER'],
                        activePortal: 'BUYER',
                        user: null,
                        store: null,
                        isAuthorized: false
                    };
                }
                let roles = record.roles || ['BUYER'];
                let defaultPortal = roles.includes('OWNER') ? 'OWNER' :
                    roles.includes('SELLER') ? 'SELLER' :
                    roles.includes('DRIVER') ? 'DRIVER' : 'BUYER';
                return {
                    roles: roles,
                    activePortal: defaultPortal,
                    user: record,
                    store: record.store,
                    isAuthorized: true
                };
            }

            let session = resolveUser(tgUserId);
            let activePortal = session.activePortal;

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 4. RENDER ENGINE
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            function renderApp() {
                const container = document.getElementById('portalContent');
                const isOwner = session.roles.includes('OWNER');
                const isSeller = session.roles.includes('SELLER');
                const isDriver = session.roles.includes('DRIVER');

                let displayPortal = activePortal;
                // Ensure the active portal is allowed
                if (isOwner && !['OWNER', 'SELLER'].includes(activePortal)) displayPortal = 'OWNER';
                else if (isSeller && !['SELLER'].includes(activePortal) && !isOwner) displayPortal = 'SELLER';
                else if (isDriver && !['DRIVER'].includes(activePortal) && !isOwner && !isSeller) displayPortal =
                'DRIVER';
                else if (!isOwner && !isSeller && !isDriver) displayPortal = 'BUYER';

                let html = '';

                // ─── USER BANNER ───
                const displayName = session.user ? session.user.username : tgUsername;
                const roleDisplay = session.roles.join(', ');
                html += `
                    <div class="flex-between" style="margin-bottom:8px;">
                        <div class="user-banner">
                            <i class="fas fa-user-circle" style="color:#d4af37;"></i>
                            @${displayName}
                            <span class="role-tag">${roleDisplay}</span>
                        </div>
                        <span style="font-size:9px; color:#6f5e48;">ID: ${tgUserId.slice(0,4)}...</span>
                    </div>
                `;

                // ─── ROLE SWITCHER (Owner only) ───
                if (isOwner) {
                    const isActiveOwner = (displayPortal === 'OWNER');
                    const isActiveSeller = (displayPortal === 'SELLER');
                    html += `<div class="role-switcher">
                        <button class="role-btn ${isActiveOwner ? 'active' : ''}" data-portal="OWNER">👑 Owner Portal</button>
                        <button class="role-btn ${isActiveSeller ? 'active' : ''}" data-portal="SELLER">🏪 Seller Portal</button>
                    </div>`;
                }

                // ─── PORTAL CONTENT ───
                if (displayPortal === 'OWNER') {
                    html += renderOwnerPortal();
                } else if (displayPortal === 'SELLER') {
                    html += renderSellerPortal();
                } else if (displayPortal === 'DRIVER') {
                    html += renderDriverPortal();
                } else {
                    html += renderBuyerPortal();
                }

                container.innerHTML = html;

                // ─── BIND EVENTS ───
                // Role switcher
                document.querySelectorAll('.role-btn[data-portal]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const newPortal = this.dataset.portal;
                        if (session.roles.includes('OWNER') && (newPortal === 'OWNER' || newPortal ===
                                'SELLER')) {
                            activePortal = newPortal;
                            renderApp();
                        }
                    });
                });

                // Product add
                document.querySelectorAll('.btn-add[data-product-id]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const pid = this.dataset.productId;
                        const p = DB.products.find(pr => pr.id == pid);
                        if (p) showToast(`🛒 Added "${p.name}" to basket`);
                    });
                });

                // Verify payment
                document.querySelectorAll('.verify-payment-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('✅ Payment verified successfully!');
                        this.textContent = '✓ Verified';
                        this.style.background = '#1a8a4a';
                        this.style.color = 'white';
                    });
                });

                // Assign driver
                document.querySelectorAll('.assign-driver-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('🚛 Driver assigned: Abebe (🚗 ABC-1234)');
                    });
                });

                // Close daily
                document.querySelectorAll('.close-daily-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('📆 Daily ledger closed. Revenue: ETB 24,850');
                    });
                });

                // Add seller
                document.querySelectorAll('.add-seller-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const input = document.querySelector('.seller-input');
                        if (input && input.value.trim()) {
                            showToast(
                                `👤 Invitation sent to "${input.value.trim()}" · Code: SOYAM-SELLER-${Math.random().toString(36).substring(2,6).toUpperCase()}`
                                );
                            input.value = '';
                        } else {
                            showToast('⚠️ Please enter a Telegram username');
                        }
                    });
                });

                // Revoke seller
                document.querySelectorAll('.revoke-seller-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const name = this.dataset.name || 'seller';
                        showToast(`🔒 Access revoked for "${name}" · session terminated`);
                        const item = this.closest('.staff-item');
                        if (item) {
                            item.style.opacity = '0.4';
                            item.querySelector('.status').textContent = 'Suspended';
                            item.querySelector('.status').className = 'status suspended';
                        }
                    });
                });

                // Save / discard stock
                document.querySelectorAll('.save-stock-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('📦 Stock item saved successfully!');
                    });
                });
                document.querySelectorAll('.discard-stock-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('🗑️ Form discarded');
                    });
                });

                // Driver actions
                document.querySelectorAll('.start-delivery-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('🚚 Delivery started · navigating to pickup');
                    });
                });
                document.querySelectorAll('.mark-delivered-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('✅ Delivery marked as COMPLETED');
                    });
                });

                // Tabs (buyer)
                document.querySelectorAll('.nav-tab').forEach(tab => {
                    tab.addEventListener('click', function() {
                        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                        showToast(`📂 Showing: ${this.textContent.trim()}`);
                    });
                });

                // Custom request
                document.querySelectorAll('.custom-request-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('📸 Upload a photo or describe the product');
                    });
                });

                // Fulfillment toggle
                document.querySelectorAll('.fulfillment-toggle .pill').forEach(pill => {
                    pill.addEventListener('click', function() {
                        document.querySelectorAll('.fulfillment-toggle .pill').forEach(p => p.style
                            .background = 'white');
                        this.style.background = '#d4af37';
                        this.style.color = '#1a150f';
                        showToast(`📦 ${this.textContent.trim()} selected`);
                    });
                });

                // ─── QR SCANNER ─── (Telegram WebApp scanQrPopup)
                document.querySelectorAll('.qr-scan-trigger').forEach(btn => {
                    btn.addEventListener('click', function() {
                        scanQRCode();
                    });
                });
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 5. QR SCANNER (Telegram WebApp)
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            function scanQRCode() {
                const webapp = window.Telegram?.WebApp;
                if (webapp && typeof webapp.scanQrPopup === 'function') {
                    webapp.scanQrPopup({
                        text: 'Scan item QR or order code'
                    }, function(result) {
                        if (result) {
                            showToast(`📷 QR scanned: ${result}`);
                            // Try to find product by code
                            const product = DB.products.find(p => p.id == result || p.name.toLowerCase().includes(
                            result.toLowerCase()));
                            if (product) {
                                showToast(`✅ Found: ${product.name} · ETB ${product.price}`);
                            } else {
                                showToast(`🔍 Code: ${result} — not in catalog`);
                            }
                        } else {
                            showToast('❌ QR scan cancelled');
                        }
                    });
                } else {
                    // Fallback: use input prompt
                    const code = prompt('📷 Enter QR code value (Telegram scan not available):');
                    if (code) {
                        showToast(`📷 QR entered: ${code}`);
                        const product = DB.products.find(p => p.id == code || p.name.toLowerCase().includes(code
                        .toLowerCase()));
                        if (product) {
                            showToast(`✅ Found: ${product.name} · ETB ${product.price}`);
                        } else {
                            showToast(`🔍 Code: ${code} — not in catalog`);
                        }
                    }
                }
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

                    `}

                    <div style="background:#f3ede6; border-radius:16px; padding:12px; margin-top:10px; text-align:center; font-size:10px; color:#5c4b35;">
                        <i class="fas fa-qrcode text-gold"></i> Scan Order QR to verify pickup
                        <button class="action-btn qr-scan-trigger" style="width:auto; padding:6px 20px; margin-top:6px; background:#2b241d; color:#f0e6d8; font-size:10px;">
                            <i class="fas fa-camera"></i> Scan QR
                        </button>
                    </div>

                    <div style="background:#1a150f; border-radius:16px; padding:10px; margin-top:8px; color:#f0e6d8; font-size:10px; display:flex; justify-content:space-between;">
                        <span><i class="fas fa-phone"></i> Contact: +251 91 234 5678</span>
                        <span><i class="fas fa-car"></i> ABC-1234</span>
                    </div>
                `;
                return html;
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 7. TOAST
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            function showToast(msg) {
                const container = document.getElementById('portalContainer');
                const existing = container.querySelector('.toast');
                if (existing) existing.remove();

                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = msg;
                container.appendChild(toast);

                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 3500);
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 8. INIT & TELEGRAM WEBAPP SETUP
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            function init() {
                // Configure Telegram WebApp
                try {
                    const webapp = window.Telegram?.WebApp;
                    if (webapp) {
                        webapp.expand();
                        webapp.enableClosingConfirmation();
                        webapp.setBackgroundColor('#f6f1eb');
                        webapp.setHeaderColor('#f6f1eb');
                        console.log('✅ Telegram WebApp initialized');
                    }
                } catch (e) {
                    console.log('ℹ️ Running outside Telegram WebApp');
                }

                // Show user info
                console.log(`👤 User: ${tgUserId} (@${tgUsername})`);
                console.log(`🎭 Roles: ${session.roles.join(', ')}`);
                console.log(`🚪 Portal: ${activePortal}`);

                renderApp();
            }

            // ─── Expose for debugging ───
            window.DB = DB;
            window.tgUserId = tgUserId;
            window.session = session;
            window.scanQRCode = scanQRCode;
            window.renderApp = renderApp;

            // ─── Start ───
            init();

        })();
    </script>
</body>
</html>

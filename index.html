<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>soYam cosmo · Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ─── same styles as before, but keep them clean ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #0d0b09;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }
        .app-frame {
            max-width: 420px;
            width: 100%;
            background: #f6f1eb;
            border-radius: 44px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px #d4af37 inset;
            overflow: hidden;
            padding: 18px 14px 22px;
            transition: background 0.2s;
            position: relative;
        }
        .brand-crown { text-align: center; margin-bottom: 8px; }
        .brand-crown .logo-symbol {
            font-size: 44px;
            font-weight: 700;
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(145deg, #d4af37, #b8952a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .brand-crown .sub-brand {
            font-size: 15px;
            font-weight: 600;
            color: #3d2e1b;
            letter-spacing: 2.5px;
            background: #e8dccc;
            display: inline-block;
            padding: 0 16px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-size: 13px;
        }
        .brand-crown .amharic {
            font-size: 17px;
            font-weight: 400;
            color: #5a4a34;
            margin-top: 2px;
            letter-spacing: 1.5px;
            font-family: 'Segoe UI', 'Noto Sans Ethiopic', sans-serif;
        }
        .brand-crown .address-mini {
            font-size: 9px;
            font-weight: 400;
            color: #6f5e48;
            background: rgba(255, 248, 235, 0.7);
            padding: 3px 14px;
            border-radius: 40px;
            display: inline-block;
            margin-top: 5px;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .brand-crown .address-mini i { color: #b8952a; margin: 0 2px; }
        .lang-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3px 6px;
            background: #2b241d;
            padding: 5px 8px;
            border-radius: 60px;
            margin: 8px 0 10px;
        }
        .lang-chip {
            font-size: 8.5px;
            font-weight: 600;
            color: #e6dccb;
            background: #3f352b;
            padding: 3px 10px;
            border-radius: 40px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .lang-chip.active {
            background: #d4af37;
            color: #1a150f;
            border-color: #d4af37;
        }
        .social-row {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin: 4px 0 14px;
        }
        .social-icon {
            color: #3d2e1b;
            font-size: 22px;
            opacity: 0.75;
            text-decoration: none;
        }
        .portal-container {
            background: #fcf9f5;
            border-radius: 28px;
            padding: 16px 12px;
            min-height: 380px;
            border: 1px solid #e9dfd1;
        }
        .role-switcher {
            display: flex;
            gap: 8px;
            background: #eaddd0;
            padding: 6px 8px;
            border-radius: 60px;
            margin-bottom: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .role-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 11px;
            font-family: 'Montserrat', sans-serif;
            color: #2d241c;
            cursor: pointer;
            transition: 0.15s;
        }
        .role-btn.active {
            background: #1a150f;
            color: #f0e6d8;
            border-color: #d4af37;
        }
        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e2d4c2;
            padding-bottom: 10px;
        }
        .nav-tab {
            font-size: 10px;
            font-weight: 600;
            background: transparent;
            border: none;
            padding: 5px 12px;
            border-radius: 40px;
            color: #5c4b35;
            cursor: pointer;
        }
        .nav-tab.active {
            background: #d4af37;
            color: #1f1a14;
        }
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 4px;
        }
        .product-card {
            background: white;
            border-radius: 20px;
            padding: 10px 8px 12px;
            border: 1px solid #ede5d8;
            text-align: center;
        }
        .product-card .img-placeholder {
            background: #e9dfd1;
            border-radius: 16px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 6px;
        }
        .product-card .p-name { font-size: 11px; font-weight: 600; color: #1e1710; }
        .product-card .p-price { font-size: 13px; font-weight: 700; color: #b8952a; margin: 2px 0 6px; }
        .btn-add {
            background: #1a150f;
            border: none;
            color: #f0e6d8;
            font-size: 10px;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }
        .btn-add:hover { background: #d4af37; color: #1a150f; }
        .stat-card {
            background: #f3ede6;
            border-radius: 20px;
            padding: 12px 14px;
            margin-bottom: 12px;
            border-left: 4px solid #d4af37;
        }
        .stat-card h4 {
            font-size: 12px;
            font-weight: 600;
            color: #2d241c;
            display: flex;
            justify-content: space-between;
        }
        .stat-card .badge {
            background: #1a150f;
            color: #f0e6d8;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 9px;
        }
        .flex-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .flex-row .pill {
            background: white;
            border-radius: 60px;
            padding: 4px 12px;
            font-size: 10px;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .action-btn {
            background: #d4af37;
            border: none;
            padding: 10px 18px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 12px;
            color: #1a150f;
            width: 100%;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin-top: 6px;
        }
        .action-btn.secondary { background: #2b241d; color: #f0e6d8; }
        .action-btn.danger { background: #9f3a2b; color: white; }
        .action-btn.success { background: #1a8a4a; color: white; }
        .action-btn.small { padding: 4px 14px; width: auto; font-size: 10px; margin-top: 0; }
        .metric-tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .metric-tile {
            background: #1a150f;
            padding: 12px 14px;
            border-radius: 20px;
            color: #f0e6d8;
        }
        .metric-tile .label { font-size: 9px; opacity: 0.7; text-transform: uppercase; }
        .metric-tile .value { font-size: 18px; font-weight: 700; color: #d4af37; }
        .staff-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 40px;
            padding: 6px 14px;
            margin-bottom: 5px;
            font-size: 11px;
            border: 1px solid #ede5d8;
        }
        .staff-item .status.active { color: #1a8a4a; }
        .staff-item .status.suspended { color: #9f3a2b; }
        .staff-item .actions button {
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            color: #6f5e48;
            margin-left: 6px;
        }
        .stock-form {
            background: #f3ede6;
            border-radius: 20px;
            padding: 14px;
            margin-top: 10px;
        }
        .stock-form .form-group { margin-bottom: 10px; }
        .stock-form label { font-size: 10px; font-weight: 600; color: #2d241c; display: block; margin-bottom: 3px; }
        .stock-form input, .stock-form select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 60px;
            border: 1px solid #d0c0ac;
            background: white;
            font-size: 11px;
            font-family: 'Montserrat', sans-serif;
        }
        .stock-form .media-row { display: flex; gap: 8px; }
        .stock-form .media-row button {
            flex: 1;
            padding: 8px;
            border-radius: 60px;
            border: 1px solid #d0c0ac;
            background: white;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .stock-form .form-actions { display: flex; gap: 8px; margin-top: 12px; }
        .stock-form .form-actions button {
            flex: 1;
            padding: 8px;
            border-radius: 60px;
            border: none;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
        }
        .stock-form .form-actions .save-btn { background: #d4af37; color: #1a150f; }
        .stock-form .form-actions .edit-btn { background: #2b241d; color: #f0e6d8; }
        .stock-form .form-actions .discard-btn { background: #9f3a2b; color: white; }
        .delivery-card {
            background: white;
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #ede5d8;
            margin-bottom: 8px;
        }
        .delivery-card .d-title { font-weight: 600; font-size: 12px; color: #1a150f; }
        .delivery-card .d-detail { font-size: 10px; color: #6f5e48; }
        .toast {
            background: #1a150f;
            color: #f0e6d8;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            margin-top: 10px;
            border-left: 4px solid #d4af37;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .footer-note {
            font-size: 8px;
            color: #6f5e48;
            text-align: center;
            margin-top: 14px;
            opacity: 0.5;
        }
        .bg-dark {
            background: #1a150f;
            color: #f0e6d8;
            border-radius: 60px;
            padding: 3px 12px;
            font-size: 9px;
            font-weight: 600;
        }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .text-gold { color: #b8952a; }
        .mt-1 { margin-top: 8px; }
    </style>
</head>
<body>
    <div class="app-frame" id="appFrame">
        <!-- Brand Crown -->
        <div class="brand-crown">
            <div class="logo-symbol">SY</div>
            <div class="sub-brand">soYam cosmo</div>
            <div class="amharic">ሶያም ኮስሞቲክስ</div>
            <div class="address-mini">
                <i class="fas fa-map-pin"></i> Betel Bldg, G.Floor · Addis Ababa
                <i class="fas fa-phone-alt" style="margin-left:6px;"></i> +251 91 909 6451
            </div>
        </div>

        <!-- Language Row -->
        <div class="lang-row">
            <span class="lang-chip active">English</span>
            <span class="lang-chip">አማርኛ</span>
            <span class="lang-chip">ትግርኛ</span>
            <span class="lang-chip">Oromiffa</span>
            <span class="lang-chip">Gurage</span>
            <span class="lang-chip">Soomaali</span>
        </div>

        <!-- Social Row -->
        <div class="social-row">
            <a href="#" class="social-icon"><i class="fab fa-tiktok"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-whatsapp"></i></a>
        </div>

        <!-- Portal Container -->
        <div class="portal-container" id="portalContainer">
            <div id="portalContent">Loading...</div>
        </div>

        <div class="footer-note">
            <i class="fas fa-shield-alt" style="color:#d4af37;"></i> secured · role backend
        </div>
    </div>

    <script>
        (function() {
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 1. REAL TELEGRAM USER DETECTION
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            let tgUser = null;
            let tgWebApp = null;

            try {
                tgWebApp = window.Telegram?.WebApp;
                if (tgWebApp) {
                    const initData = tgWebApp.initDataUnsafe;
                    if (initData && initData.user) {
                        tgUser = initData.user;
                        console.log('✅ Telegram user detected:', tgUser);
                    } else {
                        console.warn('⚠️ No user data in initDataUnsafe');
                    }
                } else {
                    console.warn('⚠️ Telegram WebApp SDK not loaded');
                }
            } catch (e) {
                console.error('Error reading Telegram WebApp:', e);
            }

            // If no Telegram user, create a fallback for testing in browser
            if (!tgUser) {
                tgUser = {
                    id: 111111111,
                    username: 'test_buyer',
                    first_name: 'Test',
                    last_name: 'User'
                };
                console.warn('⚠️ Using fallback test user (browser mode)');
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 2. ROLE MAPPING (replace with backend call)
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // In production, fetch from your server: /api/get-role?telegram_id=...
            const ROLE_MAP = {
                '999999999': { roles: ['OWNER', 'SELLER'], store: 'STORE001' }, // @mama51R
                '888888888': { roles: ['SELLER'], store: 'STORE001' }, // @silencer01m
                '777777777': { roles: ['DRIVER'], store: 'STORE001' }, // @driver_abebe
                // Add more as needed
            };

            function getUserRoles(telegramId) {
                const entry = ROLE_MAP[String(telegramId)];
                if (entry) return entry;
                // Default: buyer
                return { roles: ['BUYER'], store: null };
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 3. SESSION STATE
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            let currentUser = tgUser;
            let userRoles = getUserRoles(currentUser.id);
            let activePortal = userRoles.roles.includes('OWNER') ? 'OWNER' :
                userRoles.roles.includes('SELLER') ? 'SELLER' :
                userRoles.roles.includes('DRIVER') ? 'DRIVER' : 'BUYER';

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 4. DATABASE (in-memory for demo)
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            const DB = {
                products: [
                    { id: 101, name: 'Gold Serum', category: 'Skincare', price: 850, stock: 12, image: '✨' },
                    { id: 102, name: 'Velvet Cream', category: 'Makeup', price: 420, stock: 8, image: '🧴' },
                    { id: 103, name: 'Oud Fragrance', category: 'Fragrance', price: 1250, stock: 5, image: '🌸' },
                    { id: 104, name: 'Detergent Plus', category: 'Detergent', price: 180, stock: 30, image: '🧺' },
                    { id: 105, name: 'Rose Toner', category: 'Skincare', price: 320, stock: 15, image: '🌹' },
                    { id: 106, name: 'Mascara Pro', category: 'Makeup', price: 290, stock: 9, image: '👁️' }
                ],
                orders: [
                    { id: 'ORD-1001', status: 'PENDING', total: 1270, buyer: 'buyer_demo', items: ['Gold Serum',
                            'Rose Toner'
                        ] },
                    { id: 'ORD-1002', status: 'PENDING', total: 420, buyer: 'hana_abebe', items: ['Velvet Cream'] },
                    { id: 'ORD-1003', status: 'DELIVERED', total: 180, buyer: 'kebede_t', items: ['Detergent Plus'] }
                ],
                staff: [
                    { username: 'silencer01m', name: 'Abel', phone: '+251948479301', role: 'SELLER',
                    status: 'Active' },
                    { username: 'driver_abebe', name: 'Abebe', phone: '+251912345678', role: 'DRIVER',
                        status: 'Active' }
                ],
                pendingDeliveries: [
                    { id: 'DEL-001', orderId: 'ORD-1001', pickup: 'Betel Bldg, G.Floor', dropoff: 'Bole, Addis',
                        status: 'assigned', driver: 'Abebe' }
                ]
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 5. RENDER FUNCTIONS
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            function renderApp() {
                const container = document.getElementById('portalContent');
                const isOwner = userRoles.roles.includes('OWNER');
                const isSeller = userRoles.roles.includes('SELLER');
                const isDriver = userRoles.roles.includes('DRIVER');

                let displayPortal = activePortal;
                // if owner and activePortal is seller, show seller
                // else fallback
                if (isOwner && activePortal === 'OWNER') displayPortal = 'OWNER';
                else if (isOwner && activePortal === 'SELLER') displayPortal = 'SELLER';
                else if (isSeller && !isOwner) displayPortal = 'SELLER';
                else if (isDriver && !isOwner && !isSeller) displayPortal = 'DRIVER';
                else if (!isOwner && !isSeller && !isDriver) displayPortal = 'BUYER';

                let html = '';

                // Role switcher for Owner
                if (isOwner) {
                    html += `<div class="role-switcher">
                        <button class="role-btn ${displayPortal === 'OWNER' ? 'active' : ''}" data-portal="OWNER">👑 Owner Portal</button>
                        <button class="role-btn ${displayPortal === 'SELLER' ? 'active' : ''}" data-portal="SELLER">🏪 Seller Portal</button>
                    </div>`;
                }

                // Render portal
                if (displayPortal === 'OWNER') html += renderOwnerPortal();
                else if (displayPortal === 'SELLER') html += renderSellerPortal();
                else if (displayPortal === 'DRIVER') html += renderDriverPortal();
                else html += renderBuyerPortal();

                container.innerHTML = html;

                // ─── Event Bindings ───
                // Role switcher
                document.querySelectorAll('.role-btn[data-portal]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const newPortal = this.dataset.portal;
                        if (userRoles.roles.includes('OWNER')) {
                            activePortal = newPortal;
                            renderApp();
                        }
                    });
                });

                // Add to cart
                document.querySelectorAll('.btn-add[data-product-id]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const pid = this.dataset.productId;
                        const p = DB.products.find(pr => pr.id == pid);
                        if (p) showToast(`🛒 Added "${p.name}" to basket`);
                    });
                });

                // Verify payment
                document.querySelectorAll('.verify-payment-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('✅ Payment verified!');
                        this.textContent = '✓ Verified';
                        this.style.background = '#1a8a4a';
                        this.style.color = 'white';
                    });
                });

                // Assign driver
                document.querySelectorAll('.assign-driver-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('🚛 Driver assigned: Abebe (ABC-1234)');
                    });
                });

                // Close daily
                document.querySelectorAll('.close-daily-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('📆 Daily ledger closed. Revenue: ETB 24,850');
                    });
                });

                // Add seller
                document.querySelectorAll('.add-seller-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const input = document.querySelector('.seller-input');
                        if (input && input.value.trim()) {
                            showToast(`👤 Invitation sent to "${input.value.trim()}" · Code: SOYAM-SELLER-${Math.random().toString(36).substring(2,6).toUpperCase()}`);
                            input.value = '';
                        } else {
                            showToast('⚠️ Please enter a Telegram username');
                        }
                    });
                });

                // Revoke seller
                document.querySelectorAll('.revoke-seller-btn').forEach(btn => {
                    btn.addEventListener('click', function() {

                        const item = this.closest('.staff-item');

                            item.querySelector('.status').className = 'status suspended';

                    btn.addEventListener('click', function() {
                        showToast('📦 Stock item saved!');
                    });
                });
                document.querySelectorAll('.discard-stock-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('🗑️ Form discarded');
                    });
                });

                // Driver actions
                document.querySelectorAll('.start-delivery-btn').forEach(btn => {

                document.querySelectorAll('.mark-delivered-btn').forEach(btn => {

                // Tabs (buyer)

                        showToast(`📂 Showing: ${this.textContent.trim()}`);
                    });
                });

                // Custom request
                document.querySelectorAll('.custom-request-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        showToast('📸 Upload a photo or describe the product');
                    });
                });

                // Fulfillment toggle
                document.querySelectorAll('.fulfillment-toggle .pill').forEach(pill => {
                    pill.addEventListener('click', function() {
                        document.querySelectorAll('.fulfillment-toggle .pill').forEach(p => p.style
                            .background = 'white');
                        this.style.background = '#d4af37';
                        this.style.color = '#1a150f';
                        showToast(`📦 ${this.textContent.trim()} selected`);
                    });
                });

                // ─── QR SCAN BUTTON (Telegram native) ───
                document.querySelectorAll('.scan-qr-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (tgWebApp && typeof tgWebApp.requestScanQrPopup === 'function') {
                            tgWebApp.requestScanQrPopup({
                                text: 'Scan product QR or order code'
                            }, function(result) {
                                if (result) {
                                    showToast(`📷 QR scanned: ${result}`);
                                    // Here you would send result to backend
                                } else {
                                    showToast('Scan cancelled');
                                }
                            });
                        } else {
                            // Fallback for browser
                            showToast('📷 QR scan only works inside Telegram app');
                            // Simulate scan result
                            setTimeout(() => {
                                showToast('📷 Simulated QR: PRODUCT-123');
                            }, 1000);
                        }
                    });
                });
            }

            // ─── TOAST ───
            function showToast(msg) {
                const container = document.getElementById('portalContainer');
                const existing = container.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = msg;
                container.appendChild(toast);
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
            }

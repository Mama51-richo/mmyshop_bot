<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>soYam Cosmo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== ROOT VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #D4AF37;
            --primary-dark: #B8962E;
            --secondary: #6B2FA0;
            --cream: #FFF8F0;
            --gold-shimmer: #FFD700;
            --warm-gray: #8C7A6B;
            --dark: #1A1A2E;
            --white: #FFFFFF;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius: 20px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --bg-primary: #FFF8F0;
            --bg-card: #FFFFFF;
            --text-primary: #1A1A2E;
            --text-secondary: #5A5A6E;
            --border-color: rgba(212, 175, 55, 0.2);
        }
        body.dark-theme {
            --bg-primary: #12121F;
            --bg-card: #1E1E32;
            --text-primary: #F5F0EB;
            --text-secondary: #B5B0AB;
            --border-color: rgba(212, 175, 55, 0.15);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding-bottom: 80px;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* ===== HEADER ===== */
        #main-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 248, 240, 0.85);
            backdrop-filter: blur(16px);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.3s;
        }
        body.dark-theme #main-header {
            background: rgba(18, 18, 31, 0.85);
        }
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo-icon {
            font-size: 24px;
            background: linear-gradient(135deg, var(--primary), var(--gold-shimmer));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--gold-shimmer));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text span {
            font-weight: 300;
            color: var(--warm-gray);
            -webkit-text-fill-color: var(--warm-gray);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .role-badge-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Poppins', sans-serif;
        }
        .role-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .role-dot.buyer {
            background: #2196F3;
        }
        .role-dot.seller {
            background: #4CAF50;
        }
        .role-dot.owner {
            background: #FF6F00;
        }
        .lang-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Poppins', sans-serif;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            position: relative;
            padding: 3px;
        }
        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--secondary);
            color: white;
            font-size: 9px;
            font-weight: 700;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .badge.hidden {
            display: none;
        }

        /* ===== BOTTOM NAV ===== */
        #bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 12px;
            border-top: 1px solid var(--border-color);
            z-index: 200;
        }
        body.dark-theme #bottom-nav {
            background: rgba(18, 18, 31, 0.92);
        }
        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            padding: 3px 10px;
            opacity: 0.5;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }
        .nav-item .nav-icon {
            font-size: 20px;
        }
        .nav-item .nav-label {
            font-size: 9px;
            font-weight: 600;
            color: var(--warm-gray);
        }
        .nav-item.active {
            opacity: 1;
        }
        .nav-item.active .nav-label {
            color: var(--primary);
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            top: -4px;
            width: 16px;
            height: 2px;
            background: var(--primary);
            border-radius: 4px;
        }

        /* ===== PAGE ===== */
        #page-container {
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
        }
        .page {
            display: none;
            animation: fadeSlideUp 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== HERO ===== */
        .hero-banner {
            background: linear-gradient(145deg, var(--secondary), var(--primary-dark));
            border-radius: var(--radius);
            padding: 18px 16px;
            color: white;
            margin-bottom: 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero-banner::before {
            content: '✨';
            position: absolute;
            right: 12px;
            top: 6px;
            font-size: 32px;
            opacity: 0.12;
        }
        .hero-banner .hero-logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFF8E1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-banner .hero-logo-sub {
            font-size: 11px;
            font-weight: 300;
            opacity: 0.8;
            letter-spacing: 4px;
            color: #FFF8E1;
            -webkit-text-fill-color: #FFF8E1;
        }
        .hero-banner .hero-tagline {
            font-size: 12px;
            font-weight: 500;
            margin-top: 2px;
            opacity: 0.9;
            font-style: italic;
        }
        .hero-banner .hero-details {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 12px;
            font-size: 10px;
            opacity: 0.8;
        }
        .hero-banner .hero-details span {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 10px;
            border-radius: 30px;
        }
        .hero-banner .hero-actions {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .hero-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            font-size: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: 'Poppins', sans-serif;
        }
        .hero-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .hero-btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--dark);
        }
        .hero-btn-call {
            background: #2E7D32;
            border-color: #2E7D32;
        }
        .hero-btn-chat {
            background: #0088CC;
            border-color: #0088CC;
        }

        /* ===== PRODUCTS ===== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 0 8px;
        }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 700;
        }
        .section-title .highlight {
            color: var(--primary);
        }
        .category-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 0 10px;
            scrollbar-width: none;
        }
        .category-scroll::-webkit-scrollbar {
            display: none;
        }
        .category-chip {
            flex-shrink: 0;
            background: var(--bg-card);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            cursor: pointer;
            white-space: nowrap;
            font-family: 'Poppins', sans-serif;
        }
        .category-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .product-image {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background: #f0ebe4;
        }
        .product-info {
            padding: 4px 6px 6px;
        }
        .product-name {
            font-size: 9px;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.1;
        }
        .product-price {
            font-size: 10px;
            font-weight: 700;
            color: var(--primary);
        }
        .product-stock {
            font-size: 8px;
            font-weight: 500;
        }
        .stock-in {
            color: #2E7D32;
        }
        .stock-low {
            color: #E65100;
        }
        .stock-out {
            color: #C62828;
        }
        .product-badge {
            position: absolute;
            top: 3px;
            left: 3px;
            font-size: 6px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 30px;
            text-transform: uppercase;
        }
        .badge-new {
            background: var(--primary);
            color: white;
        }
        .badge-best {
            background: #E53935;
            color: white;
        }
        .badge-low {
            background: #FB8C00;
            color: white;
        }
        .image-wrapper {
            position: relative;
        }
        .product-quick-actions {
            display: flex;
            gap: 3px;
            margin-top: 3px;
        }
        .product-quick-actions button {
            flex: 1;
            padding: 2px 0;
            border: none;
            border-radius: 10px;
            font-size: 7px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .btn-scan-order {
            background: var(--secondary);
            color: white;
        }
        .btn-wish {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--gold-shimmer));
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            font-family: 'Poppins', sans-serif;
        }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .btn-success {
            background: #2E7D32;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .btn-danger {
            background: #C62828;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }

        /* ===== MODALS ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.visible {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius) var(--radius) 0 0;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 16px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-primary);
        }
        .modal.visible .modal-content {
            transform: translateY(0);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 17px;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--warm-gray);
        }

        /* ===== QR SCANNER ===== */
        .scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .scanner-overlay.hidden {
            display: none;
        }
        .scanner-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #qrVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scanner-frame {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 2px solid var(--primary);
            border-radius: 16px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
            animation: pulse-border 1.5s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%,
            100% {
                border-color: var(--primary);
            }
            50% {
                border-color: var(--gold-shimmer);
            }
        }
        .scanner-overlay-ui {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            padding: 0 20px;
        }
        .scanner-overlay-ui p {
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: 500;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }
        .scanner-overlay-ui .btn-secondary {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            font-size: 11px;
        }
        .scanner-overlay-ui .btn-gallery {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            margin-top: 4px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            border-radius: 30px;
            font-weight: 600;
            font-size: 11px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--dark);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 11px;
            z-index: 500;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #2E7D32;
        }
        .toast.error {
            background: #C62828;
        }
        .toast.warning {
            background: #E65100;
        }
        .toast.info {
            background: #0D47A1;
        }

        /* ===== ORDER CARDS ===== */
        .order-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            margin-bottom: 6px;
            box-shadow: var(--shadow);
            border-left: 3px solid var(--primary);
        }
        .order-card .order-top {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }
        .order-card .order-product {
            font-weight: 600;
            font-size: 12px;
        }
        .order-card .order-meta {
            font-size: 10px;
            color: var(--warm-gray);
        }
        .order-card .order-price {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
        }
        .order-card .order-actions {
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .order-card .order-actions button {
            padding: 3px 10px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 9px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 8px;
            font-weight: 600;
        }
        .status-pending {
            background: #FFF3CD;
            color: #856404;
        }
        .status-approved {
            background: #D4EDDA;
            color: #155724;
        }
        .status-delivering {
            background: #CCE5FF;
            color: #004085;
        }
        .status-delivered {
            background: #D1ECF1;
            color: #0C5460;
        }
        .status-cancelled {
            background: #F8D7DA;
            color: #721C24;
        }
        .status-waiting-payment {
            background: #FFF3E0;
            color: #E65100;
        }

        /* ===== ADMIN PANEL ===== */
        .admin-panel {
            margin-top: 14px;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .admin-panel .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            margin-bottom: 8px;
        }
        .admin-panel .panel-title .highlight {
            color: var(--primary);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin: 6px 0 10px;
        }
        .stat-card {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .stat-card .stat-number {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-card .stat-label {
            font-size: 9px;
            color: var(--warm-gray);
            font-weight: 500;
        }

        /* ===== NOTIFICATION ITEMS ===== */
        .notif-item {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            margin-bottom: 4px;
            border-left: 3px solid var(--primary);
            font-size: 11px;
        }
        .notif-item .notif-id {
            font-weight: 700;
            color: var(--primary);
            font-size: 9px;
        }
        .notif-item .notif-detail {
            font-size: 10px;
            color: var(--warm-gray);
        }

        /* ===== STOCK TABLE ===== */
        .stock-table {
            width: 100%;
            font-size: 10px;
            border-collapse: collapse;
            margin-top: 6px;
        }
        .stock-table th {
            text-align: left;
            padding: 4px 3px;
            border-bottom: 2px solid var(--border-color);
            font-weight: 700;
            font-size: 9px;
        }
        .stock-table td {
            padding: 3px 3px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .stock-table .stock-total {
            font-weight: 700;
            color: var(--primary);
            font-size: 11px;
        }

        /* ===== PROFILE ===== */
        .profile-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            text-align: center;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .profile-card .avatar {
            font-size: 40px;
        }
        .profile-card .name {
            font-size: 16px;
            font-weight: 700;
        }
        .profile-card .role {
            font-size: 11px;
            color: var(--warm-gray);
        }
        .profile-card .phone {

        // ============================================================
        // NAVIGATION
        // ============================================================
        function navigateTo(pageName) {
            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.classList.toggle('active', item.dataset.page === pageName);
            });
            const container = document.getElementById('page-container');
            container.querySelectorAll('.page').forEach(function(p) { p.remove(); });
            const page = document.createElement('div');
            page.className = 'page active';
            page.id = 'page-' + pageName;

            if (pageName === 'seller' && currentUser.role !== 'seller' && currentUser.role !== 'owner') {
                page.innerHTML = renderAccessDenied('Seller Dashboard', 'Only sellers can access this page.');
            } else if (pageName === 'admin' && currentUser.role !== 'owner') {
                page.innerHTML = renderAccessDenied('Owner Dashboard', 'Only the owner can access this page.');
            } else {
                switch (pageName) {
                    case 'home':
                        page.innerHTML = renderHome();
                        break;
                    case 'search':
                        page.innerHTML = renderSearch();
                        break;
                    case 'orders':
                        page.innerHTML = renderOrders();
                        break;
                    case 'wishlist':
                        page.innerHTML = renderWishlist();
                        break;
                    case 'profile':
                        page.innerHTML = renderProfile();
                        break;
                    default:
                        page.innerHTML = '<p>Page not found</p>';
                }
            }

            container.appendChild(page);
            document.querySelectorAll('[data-key]').forEach(function(el) {
                const key = el.dataset.key;
                if (TRANSLATIONS[currentLanguage] && TRANSLATIONS[currentLanguage][key]) {
                    el.textContent = TRANSLATIONS[currentLanguage][key];
                }
            });
        }

        function renderAccessDenied(title, message) {
            return `

                    <button class="btn-primary" style="margin-top:10px;width:auto;padding:6px 16px;font-size:11px;" onclick="navigateTo('home')">🏠 Go Home</button>

        // ============================================================
        // OWNER: ADD STOCK WITH PHOTO
        // ============================================================
        function openOwnerAddStock() {
            const productNames = products.map(p => `${p.id}: ${p.name}`).join('\n');
            const productId = prompt('📦 Add Stock\n\n' + productNames + '\n\nEnter product ID:');
            if (!productId) return;
            const product = products.find(p => p.id == productId);
            if (!product) {
                showToast('❌ Product not found', 'error');
                return;
            }

            const buyPrice = parseInt(prompt('💰 Enter buying price for: ' + product.name + '\nCurrent: ' + product.buyPrice +
                ' ETB'));
            if (buyPrice > 0) product.buyPrice = buyPrice;

            const quantity = parseInt(prompt('📦 Enter quantity to add:'));
            if (quantity > 0) {
                product.stock += quantity;
                const notifId = generateUniqueId('NOTIF');
                showToast('✅ Stock updated: ' + product.name + ' (+' + quantity + ')', 'success');
                addNotification('📦 Stock added: ' + product.name + ' (+' + quantity + ') (🆔 ' + notifId + ')', 'success');

                // Ask for photo
                const addPhoto = confirm('📷 Add product photo?');
                if (addPhoto) {
                    document.getElementById('galleryInput').click();
                    document.getElementById('galleryInput').onchange = function(e) {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function(ev) {
                                product.image = ev.target.result;
                                showToast('📷 Photo added for ' + product.name, 'success');
                                addNotification('📷 Photo updated: ' + product.name, 'info');
                            };
                            reader.readAsDataURL(file);
                        }
                        this.value = '';
                    };
                }
                navigateTo('home');
            } else {
                showToast('⚠️ Invalid quantity', 'error');
            }
        }

        // ============================================================
        // ORDER WORKFLOW
        // ============================================================
        function startOrderWorkflow(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            if (product.stock <= 0) {
                showToast('❌ Out of stock!', 'error');
                return;
            }
            pendingOrder = { product, step: 1 };
            openModal('orderWorkflowModal');
            renderWorkflowStep();
        }

        function renderWorkflowStep() {
            if (!pendingOrder) return;
            const container = document.getElementById('workflowContent');
            const step = pendingOrder.step;
            const product = pendingOrder.product;

            const steps = ['Select', 'Scan', 'Pay', 'Confirm'];
            let stepHtml = `
                <div class="workflow-steps">
                    ${steps.map((s, i) => `
                        <div class="workflow-step ${i + 1 < step ? 'done' : i + 1 === step ? 'active' : ''}">
                            <div class="step-circle">${i + 1}</div>
                            <div class="step-label">${s}</div>
                        </div>
                    `).join('')}
                </div>
            `;

            let contentHtml = '';
            switch (step) {
                case 1:
                    contentHtml = `
                        <div style="text-align:center;">
                            <img src="${product.image}" style="width:80px;height:80px;border-radius:10px;object-fit:cover;margin-bottom:6px;" />
                            <h3 style="font-size:15px;">${product.name}</h3>
                            <p style="font-size:16px;font-weight:700;color:var(--primary);">${product.price}</p>
                            <p style="font-size:11px;color:var(--warm-gray);">Stock: ${product.stock}</p>
                            <div style="display:flex;gap:6px;margin-top:10px;">
                                <button class="btn-secondary" style="flex:1;font-size:11px;padding:6px;" onclick="closeOrderWorkflow()">Cancel</button>
                                <button class="btn-primary" style="flex:2;font-size:11px;padding:6px;" onclick="pendingOrder.step=2;renderWorkflowStep();">📷 Scan QR →</button>
                            </div>
                        </div>
                    `;
                    break;
                case 2:
                    contentHtml = `
                        <div style="text-align:center;">
                            <div style="background:var(--bg-primary);border-radius:var(--radius);padding:16px;margin-bottom:10px;border:2px dashed var(--border-color);">
                                <div style="font-size:40px;">📷</div>
                                <p style="font-weight:600;font-size:13px;">Scan Product QR Code</p>
                                <p style="font-size:10px;color:var(--warm-gray);">Use camera or upload image</p>
                            </div>
                            <button class="btn-primary" onclick="openRealScanner()" style="font-size:11px;padding:8px;">📷 Open Camera</button>
                            <button class="btn-secondary" style="margin-top:4px;width:100%;font-size:11px;padding:6px;" onclick="openGallery()">🖼️ Choose from Gallery</button>
                            <button class="btn-secondary" style="margin-top:4px;font-size:10px;padding:4px;" onclick="pendingOrder.step=1;renderWorkflowStep();">← Back</button>
                        </div>
                    `;
                    break;
                case 3:
                    contentHtml = `
                        <div style="text-align:center;">
                            <div style="background:var(--bg-primary);border-radius:var(--radius);padding:12px;margin-bottom:10px;">
                                <p style="font-weight:600;font-size:12px;">💳 Payment Details</p>
                                <p style="font-size:18px;font-weight:700;color:var(--primary);">${product.price}</p>
                                <p style="font-size:10px;color:var(--warm-gray);">Pay via Telebirr, CBE, or Cash</p>
                                <div style="margin-top:4px;font-size:10px;color:var(--warm-gray);">
                                    <p>📱 Telebirr: +${OWNER_PHONE}</p>
                                    <p>🏦 CBE: 1000123456789</p>
                                </div>
                            </div>
                            <div class="payment-ref-input">
                                <input type="text" id="paymentRefInput" placeholder="Enter payment reference" />
                                <button onclick="submitPaymentReference()">Submit</button>
                            </div>
                            <button class="btn-secondary" style="margin-top:4px;font-size:10px;padding:4px;" onclick="pendingOrder.step=2;renderWorkflowStep();">← Back</button>
                        </div>
                    `;
                    break;
                case 4:
                    contentHtml = `
                        <div style="text-align:center;">
                            <div style="font-size:40px;">✅</div>
                            <h3 style="font-size:15px;">Order Placed!</h3>
                            <p style="font-size:11px;color:var(--warm-gray);">Your order has been submitted.</p>
                            <div style="background:var(--bg-primary);border-radius:var(--radius-sm);padding:10px;margin:8px 0;text-align:left;font-size:11px;">
                                <p><strong>Product:</strong> ${product.name}</p>
                                <p><strong>Price:</strong> ${product.price}</p>
                                <p><strong>Status:</strong> ⏳ Awaiting Approval</p>
                                <p><strong>🆔 Order ID:</strong> ${pendingOrder.orderId || 'PENDING'}</p>
                            </div>
                            <button class="btn-primary" onclick="closeOrderWorkflow();navigateTo('orders');" style="font-size:11px;padding:8px;">📦 View Orders</button>
                        </div>
                    `;
                    break;
            }

            container.innerHTML = stepHtml + contentHtml;
            document.getElementById('workflowTitle').textContent = '🛒 ' + (step === 4 ? 'Order Confirmed' : 'Place Order');
        }

        function submitPaymentReference() {
            const ref = document.getElementById('paymentRefInput').value.trim();
            if (!ref) {
                showToast('⚠️ Please enter payment reference', 'error');
                return;
            }
            const orderId = generateUniqueId('ORD');
            pendingOrder.orderId = orderId;
            pendingOrder.paymentRef = ref;
            pendingOrder.step = 4;

            const product = pendingOrder.product;
            const newOrder = {
                id: orderId,
                product: product.name,
                price: product.price,
                status: 'waiting-payment',
                date: new Date().toISOString().split('T')[0],
                type: 'Delivery',
                tracking: 'SOYAM-' + String(Math.floor(1000 + Math.random() * 9000)),
                qrCode: product.qrCode,
                paymentRef: ref,
                customer: currentUser.username || 'Customer',
                notifId: generateUniqueId('NOTIF')
            };
            orders.unshift(newOrder);
            product.stock--;

            addNotification('💰 Payment pending: ' + product.name + ' (🆔 ' + orderId + ')', 'warning');
            addNotification('📦 New order: ' + product.name + ' (🆔 ' + orderId + ')', 'info');
            addCustomerRequest(product.name, currentUser.username || 'Customer', 'Order #' + orderId, product.qrCode);

            renderWorkflowStep();
            showToast('✅ Order placed! (🆔 ' + orderId + ')', 'success');
        }

        function closeOrderWorkflow() {
            pendingOrder = null;
            closeModal('orderWorkflowModal');
        }

        // ============================================================
        // QR SCANNER
        // ============================================================
        function openRealScanner() {
            const scanner = document.getElementById('qrScanner');
            scanner.classList.remove('hidden');

            const video = document.getElementById('qrVideo');
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                    .then(function(stream) {
                        video.srcObject = stream;
                        video.play();
                        setTimeout(function() {
                            const scannedQR = 'SOYAM-P001';
                            handleQRScanned(scannedQR);
                            closeScanner();
                        }, 2500);
                    })
                    .catch(function(err) {
                        showToast('❌ Camera access denied.', 'error');
                        closeScanner();
                    });
            } else {
                showToast('❌ Camera not supported.', 'error');
                closeScanner();
            }
        }

        function handleQRScanned(qrData) {
            const product = products.find(p => p.qrCode === qrData);
            if (product) {
                showToast('✅ Product found: ' + product.name + ' | ' + product.price, 'success');
                if (pendingOrder) {
                    pendingOrder.product = product;
                    pendingOrder.step = 3;
                    renderWorkflowStep();
                }
                addNotification('📷 QR Scanned: ' + product.name + ' (🆔 ' + product.qrCode + ')', 'info');
            } else {
                showToast('❌ Product not found for QR: ' + qrData, 'error');
            }
        }

        function openGallery() {
            document.getElementById('galleryInput').click();
        }

        function handleGalleryImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            showToast('📷 Image uploaded! Analyzing...', 'info');
            setTimeout(function() {
                const randomProduct = products[Math.floor(Math.random() * products.length)];
                handleQRScanned(randomProduct.qrCode);
                closeScanner();
            }, 1500);
            event.target.value = '';
        }

        function closeScanner() {
            document.getElementById('qrScanner').classList.add('hidden');
            const video = document.getElementById('qrVideo');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
        }

        // ============================================================
        // SELLER QR SCANNER
        // ============================================================
        function openSellerQRScanner() {
            const scanner = document.getElementById('qrScanner');
            scanner.classList.remove('hidden');

            const video = document.getElementById('qrVideo');
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                    .then(function(stream) {
                        video.srcObject = stream;
                        video.play();
                        setTimeout(function() {
                            const scannedQR = 'SOYAM-P001';
                            const product = products.find(p => p.qrCode === scannedQR);
                            if (product) {
                                const stockToAdd = parseInt(prompt('📦 Stock registration for: ' + product.name +
                                    '\nCurrent stock: ' + product.stock +
                                    '\nEnter quantity to add:'));
                                if (stockToAdd > 0) {
                                    product.stock += stockToAdd;
                                    const notifId = generateUniqueId('NOTIF');
                                    showToast('✅ Stock updated: ' + product.name + ' (+' + stockToAdd + ')', 'success');
                                    addNotification('📦 Stock registered: ' + product.name + ' (+' + stockToAdd +
                                        ') (🆔 ' + notifId + ')', 'success');
                                } else {
                                    showToast('⚠️ Invalid quantity', 'error');
                                }
                            }
                            closeScanner();
                        }, 3000);
                    })
                    .catch(function(err) {
                        showToast('❌ Camera access denied.', 'error');
                        closeScanner();
                    });
            } else {
                showToast('❌ Camera not supported.', 'error');
                closeScanner();
            }
        }

        // ============================================================
        // OWNER PAYMENT ACTIONS
        // ============================================================
        function ownerConfirmPayment(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'approved';
                showToast('✅ Payment confirmed for ' + order.product, 'success');
                addNotification('💰 Payment confirmed: ' + order.product + ' (🆔 ' + orderId + ')', 'success');
                const p = products.find(pr => pr.name === order.product);
                if (p) {
                    p.stock = Math.max(0, p.stock - 1);
                }
                navigateTo('home');
            }
        }

        function ownerRejectPayment(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'cancelled';
                showToast('❌ Payment rejected for ' + order.product, 'error');
                addNotification('❌ Payment rejected: ' + order.product + ' (🆔 ' + orderId + ')', 'error');
                const p = products.find(pr => pr.name === order.product);
                if (p) p.stock++;
                navigateTo('home');
            }
        }

        // ============================================================
        // SEARCH
        // ============================================================
        function renderSearch() {
            return `
                <div style="position:sticky;top:0;background:var(--bg-primary);padding:4px 0 10px;z-index:10;">
                    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search products..." oninput="performSearch(this.value)" />
                </div>
                <div id="searchResults">
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h3>Search Products</h3>
                        <p>Find your perfect beauty match ✨</p>
                    </div>
                </div>
            `;
        }

        function performSearch(query) {
            const container = document.getElementById('searchResults');
            if (!query.trim()) {
                container.innerHTML =
                    `<div class="empty-state"><div class="empty-icon">🔍</div><h3>Search Products</h3><p>Find your perfect beauty match ✨</p></div>`;
                return;
            }
            const results = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()) || p.category
                .toLowerCase().includes(query.toLowerCase()));
            if (results.length === 0) {
                container.innerHTML =
                    `<div class="empty-state"><div class="empty-icon">😕</div><h3>No results found</h3><p>Try a different search term</p></div>`;
                return;
            }
            container.innerHTML =
                `<h3 style="margin:6px 0;font-size:13px;">${results.length} results found</h3><div class="product-grid">${results.slice(0,6).map(p => renderProductCard(p)).join('')}</div>`;
        }

        // ============================================================
        // ORDERS
        // ============================================================
        function renderOrders() {
            if (orders.length === 0) {
                return `
                    <div class="section-header"><div class="section-title">📦 <span class="highlight">My Orders</span></div></div>
                    <div class="empty-state"><div class="empty-icon">📭</div><h3>No orders yet. Start shopping!</h3></div>
                `;
            }
            const statusMap = {
                pending: 'status-pending',
                approved: 'status-approved',
                delivering: 'status-delivering',
                delivered: 'status-delivered',
                cancelled: 'status-cancelled',
                'waiting-payment': 'status-waiting-payment'
            };
            const statusLabels = {
                pending: '⏳ Pending',
                approved: '✅ Approved',
                delivering: '🚚 Delivering',
                delivered: '✅ Delivered',
                cancelled: '❌ Cancelled',
                'waiting-payment': '💳 Waiting Payment'
            };
            return `
                <div class="section-header"><div class="section-title">📦 <span class="highlight">My Orders</span></div></div>
                <div style="display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px;">
                    <button class="category-chip active" onclick="filterOrders('all')">All</button>
                    <button class="category-chip" onclick="filterOrders('waiting-payment')">💳 Payment</button>
                    <button class="category-chip" onclick="filterOrders('pending')">⏳ Pending</button>
                    <button class="category-chip" onclick="filterOrders('delivering')">🚚 Delivering</button>
                </div>
                <div id="ordersList">
                    ${orders.map(o => `
                        <div class="order-card" style="border-left-color:${o.status === 'waiting-payment' ? '#FF6F00' : o.status === 'delivered' ? '#2E7D32' : 'var(--primary)'};">
                            <div class="order-top">
                                <div>
                                    <div class="order-product">${o.product}</div>
                                    <div class="order-meta">${o.type} • ${o.date} • 🆔 ${o.id}</div>
                                    ${o.qrCode ? `<div class="order-meta" style="font-size:8px;">QR: ${o.qrCode}</div>` : ''}
                                    ${o.paymentRef ? `<div class="order-meta" style="font-size:8px;color:var(--primary);">Ref: ${o.paymentRef}</div>` : ''}
                                </div>
                                <span class="status-badge ${statusMap[o.status] || 'status-pending'}">${statusLabels[o.status] || o.status}</span>
                            </div>
                            <div class="order-price">${o.price}</div>
                            ${o.tracking ? `
                                <div style="margin-top:3px;font-size:10px;color:var(--primary);">
                                    📦 Tracking: ${o.tracking}
                                    <button class="btn-secondary" style="padding:2px 8px;font-size:8px;margin-left:4px;" onclick="showToast('📍 Tracking: ${o.tracking}', 'info')">Track</button>
                                </div>
                            ` : ''}
                            <div class="order-actions">
                                ${o.status === 'waiting-payment' ? `
                                    <button class="btn-success" onclick="showToast('✅ Payment confirmed!', 'success')">Confirm</button>
                                    <button style="background:#FF6F00;color:white;" onclick="showToast('⏳ Awaiting owner...', 'warning')">⏳ Owner</button>
                                ` : ''}
                                ${o.status === 'pending' ? `<button class="btn-success" onclick="showToast('✅ Payment confirmed!', 'success')">Confirm</button>` : ''}
                                ${o.status === 'approved' ? `<button class="btn-primary" style="padding:3px 10px;font-size:9px;" onclick="showToast('🚚 Delivery started!', 'success')">Start Delivery</button>` : ''}
                                ${o.status === 'delivering' ? `
                                    <button class="btn-success" onclick="showToast('✅ Delivery completed!', 'success')">Complete</button>
                                    <button class="btn-secondary" style="padding:3px 10px;font-size:9px;" onclick="showToast('📍 Location shared', 'info')">Share Location</button>
                                ` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function filterOrders(status) {
            const items = document.querySelectorAll('#ordersList > .order-card');
            items.forEach(item => {
                const badge = item.querySelector('.status-badge');
                if (status === 'all' || (badge && badge.textContent.includes(status))) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
            showToast('📋 Filtered: ' + status, 'info');
        }

        // ============================================================
        // WISHLIST
        // ============================================================
        function renderWishlist() {
            if (wishlist.length === 0) {
                return `
                    <div class="section-header"><div class="section-title">❤️ <span class="highlight">Wishlist</span></div></div>
                    <div class="empty-state"><div class="empty-icon">❤️</div><h3>Your wishlist is empty.</h3></div>
                `;
            }
            return `
                <div class="section-header"><div class="section-title">❤️ <span class="highlight">Wishlist</span></div></div>
                <div class="product-grid">${wishlist.slice(0,6).map(p => renderProductCard(p)).join('')}</div>
            `;
        }

        function addToWishlist(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            if (wishlist.find(p => p.id === productId)) {
                showToast('❤️ Already in wishlist!', 'info');
                return;
            }
            wishlist.push(product);
            showToast('❤️ Added to wishlist!', 'success');
            addNotification('❤️ Wishlist: ' + product.name, 'info');
        }

        // ============================================================
        // REQUEST MODAL
        // ============================================================
        function openRequestModal() {
            closeModal('productModal');
            openModal('requestModal');
        }

        function submitRequest() {
            const name = document.getElementById('reqName').value.trim();
            const qty = document.getElementById('reqQty').value.trim();
            const notes = document.getElementById('reqNotes').value.trim();
            const fileInput = document.getElementById('reqImageInput');
            const file = fileInput.files[0];

            if (!name || !qty) {
                showToast('⚠️ Please fill in product name and quantity', 'error');
                return;
            }

            let imageInfo = '';
            if (file) {
                imageInfo = ' 📷 Image attached';
            }

            const reqId = generateUniqueId('REQ');
            showToast('✅ Request submitted! (🆔 ' + reqId + ')', 'success');
            addNotification('📝 New request: ' + name + ' (Qty: ' + qty + ') (🆔 ' + reqId + ')' + imageInfo, 'info');
            addCustomerRequest(name, currentUser.username || 'Customer', 'Qty: ' + qty + (notes ? ' • ' + notes : '') +
                imageInfo, 'N/A');

            closeModal('requestModal');
            document.getElementById('reqName').value = '';
            document.getElementById('reqQty').value = '';
            document.getElementById('reqNotes').value = '';
            document.getElementById('reqImageInput').value = '';
        }

        // ============================================================
        // PRODUCT DETAIL
        // ============================================================
        function openProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            const modal = document.getElementById('productModal');
            const detail = document.getElementById('productDetail');
            const stockClass = product.stock > 5 ? 'stock-in' : product.stock > 0 ? 'stock-low' : 'stock-out';
            const stockText = product.stock > 5 ? '✅ In Stock' : product.stock > 0 ? '⚠️ Low Stock' : '❌ Out of Stock';
            detail.innerHTML = `
                <img src="${product.image}" style="width:100%;border-radius:10px;margin-bottom:10px;aspect-ratio:1/1;object-fit:cover;" />
                <h2 style="font-size:17px;">${product.name}</h2>
                <p style="font-size:18px;font-weight:700;color:var(--primary);">${product.price}</p>
                <p style="font-size:11px;color:var(--warm-gray);">Category: ${product.category}</p>
                <p style="font-weight:500;${stockClass};font-size:11px;">${stockText} (${product.stock})</p>
                <p style="font-size:10px;color:var(--warm-gray);">QR: ${product.qrCode}</p>
                <div style="display:flex;gap:6px;margin:10px 0;">
                    <button class="btn-secondary" style="flex:1;font-size:10px;padding:5px;" onclick="addToWishlist(${product.id})">❤️ Wishlist</button>
                    <button class="btn-secondary" style="flex:1;font-size:10px;padding:5px;" onclick="openRequestModal()">📝 Request</button>
                </div>
                <button class="btn-primary" onclick="startOrderWorkflow(${product.id})" style="font-size:12px;padding:8px;">📷 Scan & Order</button>
                <div style="margin-top:8px;font-size:10px;color:var(--warm-gray);text-align:center;">
                    <p>📍 ${BUSINESS_ADDRESS}</p>
                    <p>📞 +${SELLER_PHONE}</p>
                    <div style="display:flex;gap:6px;justify-content:center;margin-top:2px;">
                        <a href="tel:+${SELLER_PHONE}" style="color:var(--primary);text-decoration:none;font-size:10px;">📞 Call</a>
                        <a href="https://t.me/${SELLER_USERNAME}" target="_blank" style="color:var(--primary);text-decoration:none;font-size:10px;">💬 Chat</a>
                    </div>
                </div>
            `;
            modal.classList.add('visible');
        }

        // ============================================================
        // PROFILE
        // ============================================================
        function renderProfile() {
            const roleLabels = { buyer: '👤 Customer', seller: '🛍️ Seller', owner: '👑 Owner' };
            const roleBadgeClass = { buyer: 'buyer', seller: 'seller', owner: 'owner' };

            let contactActions = `
                <div class="contact-actions">
                    <a href="tel:+${SELLER_PHONE}" class="call-btn">📞 Call Seller</a>
                    <a href="https://t.me/${SELLER_USERNAME}" target="_blank" class="chat-btn">💬 Chat Seller</a>
                    <a href="${BUSINESS_LOCATION}" target="_blank" class="map-btn">📍 Map</a>
                    ${currentUser.role === 'owner' ? `<a href="https://t.me/${OWNER_USERNAME}" target="_blank" class="chat-btn" style="background:#FF6F00;">👑 Owner</a>` : ''}
                </div>
            `;

            return `
                <div class="profile-card">
                    <div class="avatar">${currentUser.role === 'owner' ? '👑' : currentUser.role === 'seller' ? '🛍️' : '👤'}</div>
                    <div class="name">${currentUser.username || currentUser.firstName || 'Guest'}</div>
                    <div class="role">${roleLabels[currentUser.role] || 'Customer'} <span class="role-badge ${roleBadgeClass[currentUser.role] || 'buyer'}">${currentUser.role.toUpperCase()}</span></div>
                    <div class="phone">📞 +${SELLER_PHONE}</div>
                    <div style="font-size:11px;color:var(--warm-gray);">📍 ${BUSINESS_ADDRESS}</div>
                    ${contactActions}
                </div>
                <div style="background:var(--bg-card);border-radius:var(--radius);padding:0 12px;box-shadow:var(--shadow);border:1px solid var(--border-color);">
                    <div class="profile-menu-item" onclick="openRequestModal()">
                        <span class="menu-left"><span class="menu-icon">📝</span>Request a Product</span>
                        <span>→</span>
                    </div>
                    <div class="profile-menu-item" onclick="navigateTo('orders')">
                        <span class="menu-left"><span class="menu-icon">📦</span>Order History</span>
                        <span>→</span>
                    </div>
                    <div class="profile-menu-item" onclick="navigateTo('wishlist')">
                        <span class="menu-left"><span class="menu-icon">❤️</span>Wishlist</span>
                        <span>→</span>
                    </div>
                    <div class="profile-menu-item" onclick="window.open('${BUSINESS_LOCATION}', '_blank')">
                        <span class="menu-left"><span class="menu-icon">📍</span>Location</span>
                        <span>→</span>
                    </div>
                    <div class="profile-menu-item" onclick="window.location.href='tel:+${SELLER_PHONE}'">
                        <span class="menu-left"><span class="menu-icon">📞</span>Call Seller</span>
                        <span>→</span>
                    </div>
                    <div class="profile-menu-item" onclick="window.open('https://t.me/${SELLER_USERNAME}', '_blank')">
                        <span class="menu-left"><span class="menu-icon">💬</span>Chat Seller</span>
                        <span>→</span>
                    </div>
                    <div class="profile-menu-item" onclick="toggleDarkMode()">
                        <span class="menu-left"><span class="menu-icon">🌙</span>Dark Mode</span>
                        <span>${document.body.classList.contains('dark-theme') ? '✅ On' : 'Off'}</span>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // CATEGORY FILTER
        // ============================================================
        function filterCategory(category) {
            const container = document.getElementById('allProducts');
            if (!container) return;
            const filtered = category === 'all' ? products : products.filter(p => p.category === category);
            container.innerHTML = filtered.slice(0, 6).map(p => renderProductCard(p)).join('');
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.category-chip').forEach(c => {
                if (c.textContent === category || (category === 'all' && c.textContent === '✨ All')) {
                    c.classList.add('active');
                }
            });
            showToast('📂 Showing: ' + (category === 'all' ? 'All Products' : category), 'info');
        }

        // ============================================================
        // NOTIFICATIONS
        // ============================================================
        function addNotification(message, type) {
            const id = generateUniqueId('NOTIF');
            notifications.unshift({
                id: id,
                message: message,
                type: type || 'info',
                time: new Date().toLocaleTimeString(),
                read: false
            });
            updateNotifBadge();
        }

        function updateNotifBadge() {
            const badge = document.getElementById('notifBadge');
            const count = notifications.filter(n => !n.read).length;
            if (count > 0) {
                badge.textContent = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleNotifications() {
            const modal = document.getElementById('notifModal');
            modal.classList.toggle('visible');
            if (modal.classList.contains('visible')) {
                const container = document.getElementById('notifList');
                if (notifications.length === 0) {
                    container.innerHTML =
                        `<div class="empty-state"><div class="empty-icon">🔔</div><h3>No notifications</h3></div>`;
                } else {
                    container.innerHTML = notifications.map(n =>
                        `<div class="notif-item">
                            <div class="notif-id">🆔 ${n.id}</div>
                            <div>${n.message}</div>
                            <div class="notif-detail">${n.time}</div>
                        </div>`
                    ).join('');
                }
                notifications.forEach(n => n.read = true);
                updateNotifBadge();
            }
        }

        // ============================================================
        // DARK MODE
        // ============================================================
        function toggleDarkMode() {
            document.body.classList.toggle('dark-theme');
            showToast('🌙 Dark mode ' + (document.body.classList.contains('dark-theme') ? 'enabled' : 'disabled'), 'info');
            const currentPage = document.querySelector('.nav-item.active');
            if (currentPage) navigateTo(currentPage.dataset.page);
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast visible ' + (type || 'info');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        // ============================================================
        // MODAL HELPERS
        // ============================================================
        function openModal(id) {
            document.getElementById(id).classList.add('visible');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('visible');
        }

        // ============================================================
        // INIT LOG
        // ============================================================
        console.log('✨ soYam Cosmo Mini App loaded!');
        console.log('👤 User:', currentUser);
        console.log('👑 Owner:', OWNER_USERNAME, '📞 +' + OWNER_PHONE);
        console.log('🛍️ Seller:', SELLER_USERNAME, '📞 +' + SELLER_PHONE);
        console.log('📦 Products:', products.length);
        console.log('📋 Orders:', orders.length);
        console.log('📝 Requests:', customerRequests.length);
        console.log('💡 TEMPORARY: @mama51R has Owner access');
    </script>

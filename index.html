<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>soYam cosmo · Mini App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0d0b09;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        /* ─── PHONE FRAME ─── */
        .app-frame {
            max-width: 420px;
            width: 100%;
            background: #f6f1eb;
            border-radius: 44px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px #d4af37 inset;
            overflow: hidden;
            padding: 18px 14px 22px;
            transition: background 0.2s;
            position: relative;
        }

        /* ─── BRAND CROWN ─── */
        .brand-crown {
            text-align: center;
            margin-bottom: 8px;
            position: relative;
        }
        .brand-crown .logo-symbol {
            font-size: 44px;
            font-weight: 700;
            font-family: 'Cormorant Garamond', serif;
            color: #1e1a16;
            letter-spacing: 0.18em;
            background: linear-gradient(145deg, #d4af37, #b8952a, #a07d2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 12px rgba(212, 175, 55, 0.25);
            line-height: 1;
        }
        .brand-crown .sub-brand {
            font-size: 15px;
            font-weight: 600;
            color: #3d2e1b;
            letter-spacing: 2.5px;
            margin-top: -4px;
            background: #e8dccc;
            display: inline-block;
            padding: 0 16px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            -webkit-text-fill-color: #3d2e1b;
            text-transform: uppercase;
            font-size: 13px;
        }
        .brand-crown .amharic {
            font-size: 17px;
            font-weight: 400;
            color: #5a4a34;
            margin-top: 2px;
            letter-spacing: 1.5px;
            font-family: 'Segoe UI', 'Noto Sans Ethiopic', sans-serif;
        }
        .brand-crown .address-mini {
            font-size: 9px;
            font-weight: 400;
            color: #6f5e48;
            letter-spacing: 0.4px;
            background: rgba(255, 248, 235, 0.7);
            padding: 3px 14px;
            border-radius: 40px;
            display: inline-block;
            margin-top: 5px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .brand-crown .address-mini i {
            color: #b8952a;
            margin: 0 2px;
        }

        /* ─── LANGUAGE ROW ─── */
        .lang-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3px 6px;
            background: #2b241d;
            padding: 5px 8px;
            border-radius: 60px;
            margin: 8px 0 10px;
        }
        .lang-chip {
            font-size: 8.5px;
            font-weight: 600;
            color: #e6dccb;
            background: #3f352b;
            padding: 3px 10px;
            border-radius: 40px;
            letter-spacing: 0.2px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: 0.2s;
            cursor: default;
            white-space: nowrap;
        }
        .lang-chip.active {
            background: #d4af37;
            color: #1a150f;
            border-color: #d4af37;
        }

        /* ─── SOCIAL ROW ─── */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin: 4px 0 14px;
        }
        .social-icon {
            color: #3d2e1b;
            font-size: 22px;
            transition: 0.2s;
            opacity: 0.75;
            text-decoration: none;
        }
        .social-icon:hover {
            opacity: 1;
            transform: scale(1.08);
        }

        /* ─── PORTAL CONTAINER ─── */
        .portal-container {
            background: #fcf9f5;
            border-radius: 28px;
            padding: 16px 12px;
            box-shadow: inset 0 1px 8px rgba(0, 0, 0, 0.03);
            min-height: 380px;
            transition: all 0.2s;
            border: 1px solid #e9dfd1;
        }

        /* ─── ROLE SWITCHER (Owner only) ─── */
        .role-switcher {
            display: flex;
            gap: 8px;
            background: #eaddd0;
            padding: 6px 8px;
            border-radius: 60px;
            margin-bottom: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .role-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 11px;
            font-family: 'Montserrat', sans-serif;
            color: #2d241c;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .role-btn.active {
            background: #1a150f;
            color: #f0e6d8;
            border-color: #d4af37;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .role-btn:hover:not(.active) {
            background: rgba(26, 21, 15, 0.08);
        }

        /* ─── NAV TABS ─── */
        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e2d4c2;
            padding-bottom: 10px;
        }
        .nav-tab {
            font-size: 10px;
            font-weight: 600;
            background: transparent;
            border: none;
            padding: 5px 12px;
            border-radius: 40px;
            color: #5c4b35;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.3px;
            font-family: 'Montserrat', sans-serif;
        }
        .nav-tab.active {
            background: #d4af37;
            color: #1f1a14;
        }
        .nav-tab i {
            margin-right: 4px;
        }

        /* ─── PRODUCT GRID ─── */
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 4px;
        }
        .product-card {
            background: white;
            border-radius: 20px;
            padding: 10px 8px 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
            border: 1px solid #ede5d8;
            transition: 0.15s;
            text-align: center;
        }
        .product-card .img-placeholder {
            background: #e9dfd1;
            border-radius: 16px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6f5e48;
            font-size: 26px;
            margin-bottom: 6px;
        }
        .product-card .p-name {
            font-size: 11px;
            font-weight: 600;
            color: #1e1710;
            letter-spacing: 0.2px;
        }
        .product-card .p-price {
            font-size: 13px;
            font-weight: 700;
            color: #b8952a;
            margin: 2px 0 6px;
        }
        .btn-add {
            background: #1a150f;
            border: none;
            color: #f0e6d8;
            font-size: 10px;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Montserrat', sans-serif;
        }
        .btn-add:hover {
            background: #d4af37;
            color: #1a150f;
        }

        /* ─── STAT CARDS ─── */
        .stat-card {
            background: #f3ede6;
            border-radius: 20px;
            padding: 12px 14px;
            margin-bottom: 12px;
            border-left: 4px solid #d4af37;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .stat-card h4 {
            font-size: 12px;
            font-weight: 600;
            color: #2d241c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-card .badge {
            background: #1a150f;
            color: #f0e6d8;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 9px;
            font-weight: 600;
        }
        .flex-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .flex-row .pill {
            background: white;
            border-radius: 60px;
            padding: 4px 12px;
            font-size: 10px;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        /* ─── ACTION BUTTONS ─── */
        .action-btn {
            background: #d4af37;
            border: none;
            padding: 10px 18px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 12px;
            color: #1a150f;
            width: 100%;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Montserrat', sans-serif;
            margin-top: 6px;
            letter-spacing: 0.4px;
            text-align: center;
        }
        .action-btn:hover {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .action-btn.secondary {
            background: #2b241d;
            color: #f0e6d8;
        }
        .action-btn.danger {
            background: #9f3a2b;
            color: white;
        }
        .action-btn.success {
            background: #1a8a4a;
            color: white;
        }
        .action-btn.small {
            padding: 4px 14px;
            width: auto;
            font-size: 10px;
            margin-top: 0;
        }

        /* ─── MANAGEMENT ROW ─── */
        .mgmt-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .mgmt-row input,
        .mgmt-row select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 60px;
            border: 1px solid #d0c0ac;
            background: white;
            font-size: 10px;
            font-family: 'Montserrat', sans-serif;
            min-width: 70px;
            outline: none;
        }
        .mgmt-row input:focus,
        .mgmt-row select:focus {
            border-color: #d4af37;
        }
        .mgmt-row button {
            background: #1a150f;
            border: none;
            color: #f0e6d8;
            padding: 8px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: 0.15s;
        }
        .mgmt-row button:hover {
            background: #d4af37;
            color: #1a150f;
        }

        /* ─── METRIC TILES ─── */
        .metric-tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .metric-tile {
            background: #1a150f;
            padding: 12px 14px;
            border-radius: 20px;
            color: #f0e6d8;
        }
        .metric-tile .label {
            font-size: 9px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-tile .value {
            font-size: 18px;
            font-weight: 700;
            margin-top: 2px;
            color: #d4af37;
        }

        /* ─── STAFF LIST ─── */
        .staff-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 40px;
            padding: 6px 14px;
            margin-bottom: 5px;
            font-size: 11px;
            border: 1px solid #ede5d8;
        }
        .staff-item .status {
            font-size: 9px;
            font-weight: 600;
        }
        .staff-item .status.active {
            color: #1a8a4a;
        }
        .staff-item .status.suspended {
            color: #9f3a2b;
        }
        .staff-item .actions button {
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            color: #6f5e48;
            margin-left: 6px;
            transition: 0.15s;
        }
        .staff-item .actions button:hover {
            color: #9f3a2b;
        }

        /* ─── ADD STOCK FORM ─── */
        .stock-form {
            background: #f3ede6;
            border-radius: 20px;
            padding: 14px;
            margin-top: 10px;
        }
        .stock-form .form-group {
            margin-bottom: 10px;
        }
        .stock-form label {
            font-size: 10px;
            font-weight: 600;
            color: #2d241c;
            display: block;
            margin-bottom: 3px;
        }
        .stock-form input,
        .stock-form select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 60px;
            border: 1px solid #d0c0ac;
            background: white;
            font-size: 11px;
            font-family: 'Montserrat', sans-serif;
            outline: none;
        }
        .stock-form input:focus,
        .stock-form select:focus {
            border-color: #d4af37;
        }
        .stock-form .media-row {
            display: flex;
            gap: 8px;
        }
        .stock-form .media-row button {
            flex: 1;
            padding: 8px;
            border-radius: 60px;
            border: 1px solid #d0c0ac;
            background: white;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: 0.15s;
        }
        .stock-form .media-row button:hover {
            border-color: #d4af37;
            background: #fcf9f5;
        }
        .stock-form .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .stock-form .form-actions button {
            flex: 1;
            padding: 8px;
            border-radius: 60px;
            border: none;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: 0.15s;
        }
        .stock-form .form-actions .save-btn {
            background: #d4af37;
            color: #1a150f;
        }
        .stock-form .form-actions .edit-btn {
            background: #2b241d;
            color: #f0e6d8;
        }
        .stock-form .form-actions .discard-btn {
            background: #9f3a2b;
            color: white;
        }

        /* ─── DRIVER SPECIFIC ─── */
        .delivery-card {
            background: white;
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #ede5d8;
            margin-bottom: 8px;
        }
        .delivery-card .d-title {
            font-weight: 600;
            font-size: 12px;
            color: #1a150f;
        }
        .delivery-card .d-detail {
            font-size: 10px;
            color: #6f5e48;
            margin: 2px 0;
        }

        /* ─── MISC ─── */
        .hidden {
            display: none !important;
        }
        .mt-2 {
            margin-top: 12px;
        }
        .text-gold {
            color: #b8952a;
        }
        .bg-dark {
            background: #1a150f;
            color: #f0e6d8;
            border-radius: 60px;
            padding: 3px 12px;
            font-size: 9px;
            font-weight: 600;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gap-1 {
            gap: 6px;
        }
        .w-full {
            width: 100%;
        }
        .text-center {
            text-align: center;
        }
        .mt-1 {
            margin-top: 8px;
        }
        .mb-1 {
            margin-bottom: 8px;
        }

        .footer-note {
            font-size: 8px;
            color: #6f5e48;
            text-align: center;
            margin-top: 14px;
            opacity: 0.5;
            letter-spacing: 0.4px;
        }

        /* ─── TOAST / ALERT ─── */
        .toast {
            background: #1a150f;
            color: #f0e6d8;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            margin-top: 10px;
            border-left: 4px solid #d4af37;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 440px) {
            .app-frame {
                border-radius: 28px;
                padding: 12px 10px 16px;
            }
            .brand-crown .logo-symbol {
                font-size: 36px;
            }
            .brand-crown .sub-brand {
                font-size: 12px;
                padding: 0 12px;
            }
            .product-grid {
                gap: 8px;
            }
            .product-card .img-placeholder {
                height: 56px;
                font-size: 20px;
            }
            .metric-tiles {
                grid-template-columns: 1fr 1fr;
            }
            .role-btn {
                font-size: 10px;
                padding: 4px 12px;
            }
        }

        /* scrollable content */
        .scroll-content {
            max-height: 460px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .scroll-content::-webkit-scrollbar {
            width: 3px;
        }
        .scroll-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .scroll-content::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 10px;
        }
    </style>
</head>

            let activePortal = 'OWNER'; // 'OWNER' | 'SELLER' | 'BUYER' | 'DRIVER'

            function getUserByTelegramId(tgId) {
                return DB.users.find(u => u.telegram_user_id === tgId) || null;
            }

            function getSession(tgId) {
                const user = getUserByTelegramId(tgId);
                if (!user) {
                    return { authorized_roles: ['BUYER'], active_portal: 'BUYER', user: null, store_id: null };
                }
                let roles = user.roles || ['BUYER'];
                let defaultPortal = roles.includes('OWNER') ? 'OWNER' :
                    roles.includes('SELLER') ? 'SELLER' :
                    roles.includes('DRIVER') ? 'DRIVER' : 'BUYER';
                return { authorized_roles: roles, active_portal: defaultPortal, user, store_id: user.store_id };
            }

            function getProductsByCategory(cat) {
                if (cat === 'All') return DB.products;
                return DB.products.filter(p => p.category === cat);

            function renderApp() {
                const container = document.getElementById('portalContent');
                const tgId = currentTelegramUser.id;
                const session = getSession(tgId);
                const roles = session.authorized_roles;
                const isOwner = roles.includes('OWNER');
                const isSeller = roles.includes('SELLER');
                const isDriver = roles.includes('DRIVER');

                // determine which portal to show
                let displayPortal = activePortal;
                if (isOwner && activePortal === 'OWNER') displayPortal = 'OWNER';
                else if (isOwner && activePortal === 'SELLER') displayPortal = 'SELLER';
                else if (isSeller && !isOwner) displayPortal = 'SELLER';
                else if (isDriver && !isOwner && !isSeller) displayPortal = 'DRIVER';
                else if (!isOwner && !isSeller && !isDriver) displayPortal = 'BUYER';
                else if (isOwner && !['OWNER', 'SELLER'].includes(activePortal)) displayPortal = 'OWNER';
                else if (isSeller && !['SELLER'].includes(activePortal) && !isOwner) displayPortal = 'SELLER';
                else if (isDriver && !['DRIVER'].includes(activePortal) && !isOwner && !isSeller) displayPortal = 'DRIVER';

                // If owner, but activePortal is not set, default to OWNER
                if (isOwner && !['OWNER', 'SELLER'].includes(activePortal)) displayPortal = 'OWNER';

                let html = '';

                // ─── ROLE SWITCHER (Owner only) ───
                if (isOwner) {
                    const isActiveOwner = (displayPortal === 'OWNER');
                    const isActiveSeller = (displayPortal === 'SELLER');
                    html += `<div class="role-switcher">
                        <button class="role-btn ${isActiveOwner ? 'active' : ''}" data-portal="OWNER">👑 Owner Portal</button>
                        <button class="role-btn ${isActiveSeller ? 'active' : ''}" data-portal="SELLER">🏪 Seller Portal</button>
                    </div>`;
                }

                // ─── PORTAL CONTENT ───
                if (displayPortal === 'OWNER') {
                    html += renderOwnerPortal();
                } else if (displayPortal === 'SELLER') {
                    html += renderSellerPortal();
                } else if (displayPortal === 'DRIVER') {
                    html += renderDriverPortal();
                } else {
                    html += renderBuyerPortal();
                }

                container.innerHTML = html;

                // Role switcher

                    btn.addEventListener('click', function(e) {
                        const newPortal = this.dataset.portal;
                        const sess = getSession(currentTelegramUser.id);
                        if (sess.authorized_roles.includes('OWNER') && (newPortal === 'OWNER' || newPortal ===
                                'SELLER')) {
                            activePortal = newPortal;
                            renderApp();
                        }
                    });

                // Product add buttons
                document.querySelectorAll('.btn-add[data-product-id]').forEach(btn => {

            function showToast(msg) {
                const container = document.getElementById('portalContainer');
                const existing = container.querySelector('.toast');
                if (existing) existing.remove();

                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = msg;
                container.appendChild(toast);

                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 3000);
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 7. USER SWITCHER (for demo)
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            window.switchUser = function(tgId) {
                const user = getUserByTelegramId(tgId);
                if (user) {
                    currentTelegramUser.id = tgId;
                    currentTelegramUser.username = user.telegram_username;
                    currentTelegramUser.first_name = user.first_name || '';
                    const sess = getSession(tgId);
                    activePortal = sess.active_portal;
                    renderApp();
                    showToast(`👤 Switched to @${user.telegram_username} (${user.roles.join(', ')})`);
                } else {
                    // treat as buyer
                    currentTelegramUser.id = tgId;
                    currentTelegramUser.username = 'guest_' + tgId.slice(-4);
                    activePortal = 'BUYER';
                    renderApp();
                    showToast(`👤 Guest buyer (${tgId})`);
                }
            };

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // 8. INIT
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // Set initial active portal based on user
            const initSession = getSession(currentTelegramUser.id);
            activePortal = initSession.active_portal;
            renderApp();

            // Expose for console testing
            window.DB = DB;
            window.currentUser = currentTelegramUser;
            window.switchUser = switchUser;

            console.log('🔐 soYam cosmo Mini App loaded');
            console.log('📌 Switch roles: switchUser("999999999")  [Owner]');
            console.log('   switchUser("888888888")  [Seller]');
            console.log('   switchUser("777777777")  [Driver]');
            console.log('   switchUser("111111111")  [Buyer]');
            console.log('   switchUser("123456789")  [Guest Buyer]');

        })();
    </script>
</body>
</html>

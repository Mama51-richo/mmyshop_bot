const IDB_NAME="soyam_cosmo_persistent_v1",IDB_STORE="state";
function loadDB(){try{const raw=localStorage.getItem(DB_KEY);return raw?JSON.parse(raw):structuredClone(seed)}catch(e){return structuredClone(seed)}}
let db=loadDB();
function openPersistentDB(){
 return new Promise((resolve,reject)=>{
  if(!window.indexedDB)return resolve(null);
  const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(IDB_STORE))r.result.createObjectStore(IDB_STORE)};
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
}
async function persistSnapshot(snapshot){
 try{const idb=await openPersistentDB();if(idb){await new Promise((res,rej)=>{const tx=idb.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).put(snapshot,"db");tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});idb.close()}}catch(e){}
}
function saveDB(){
 const snapshot=JSON.stringify(db);
 localStorage.setItem(DB_KEY,snapshot);
 localStorage.setItem("soyam_sync_tick",String(Date.now()));
 persistSnapshot(snapshot);
 window.dispatchEvent(new CustomEvent("soyam:data-updated"));
}
async function hydratePersistentData(){
 try{
  const idb=await openPersistentDB();
  if(!idb)return;
  const snapshot=await new Promise((res,rej)=>{const tx=idb.transaction(IDB_STORE,"readonly");const r=tx.objectStore(IDB_STORE).get("db");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  idb.close();
  if(snapshot){
   const parsed=typeof snapshot==="string"?JSON.parse(snapshot):snapshot;
   if(parsed&&typeof parsed==="object"){
    db=parsed;
    localStorage.setItem(DB_KEY,JSON.stringify(db));
   }
  }else{
   await persistSnapshot(JSON.stringify(db));
  }
 }catch(e){}
}

async function startScanner(){
 const v=document.getElementById("scanVideo"),st=document.getElementById("scanStatus");
 if(!v)return;
 try{
  scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=scannerStream; st.textContent="Point the camera at a QR code or barcode";
  if("BarcodeDetector" in window){
   const detector=new BarcodeDetector({formats:["qr_code","ean_13","ean_8","code_128","code_39","upc_a","upc_e"]});
   const tick=async()=>{
    if(!scannerStream||!v.videoWidth)return;
    try{
     const codes=await detector.detect(v);
     if(codes.length&&codes[0].rawValue){document.getElementById("barcode").value=codes[0].rawValue;st.textContent="Code detected: "+codes[0].rawValue;lookupBarcode();stopScanner();return;}
    }catch(e){}
    scannerLoop=requestAnimationFrame(tick);
   };tick();
  }else st.textContent="Camera active. Use Scan Image on browsers without BarcodeDetector.";
 }catch(e){st.textContent="Camera permission unavailable. Use Scan Image or enter the code.";toast("Camera permission was not granted")}
}
function stopScanner(){if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}if(scannerLoop)cancelAnimationFrame(scannerLoop);scannerLoop=null}
function pickScanImage(){document.getElementById("scanImageInput")?.click()}
async function decodeImageFile(e){
 const f=e.target.files?.[0];if(!f)return;
 if("BarcodeDetector" in window){
  try{
   const d=new BarcodeDetector({formats:["qr_code","ean_13","ean_8","code_128","code_39","upc_a","upc_e"]}),codes=await d.detect(await createImageBitmap(f));
   if(codes[0]?.rawValue){document.getElementById("barcode").value=codes[0].rawValue;lookupBarcode();return}
  }catch(err){}
 }
 toast("Code could not be decoded on this browser. Enter the code manually.");
}

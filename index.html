<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#24150f" />
  <title>soYam cosmo — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ===== RESET & VARIABLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg: #f8f5f0;
      --card: #ffffff;
      --ink: #251a15;
      --muted: #766b64;
      --gold: #c7a45a;
      --brown: #2b1a13;
      --brown2: #45271b;
      --line: #eadfd5;
      --green: #198754;
      --amber: #b98214;
      --red: #a62b35;
      --shadow: 0 10px 30px rgba(50, 30, 20, 0.08);
      --radius: 20px;
      --radius-sm: 12px;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: 0;
    }
    .app {
      max-width: 1100px;
      margin: auto;
      padding-bottom: 92px;
      position: relative;
    }
    .hidden {
      display: none !important;
    }

    /* ===== HEADER / HERO ===== */
    header.hero {
      background: linear-gradient(135deg, #24150f, #51301f);
      color: #fff;
      padding: 28px 20px 24px;
      text-align: center;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .logo {
      width: 72px;
      height: 72px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 10px;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: 700;
    }
    .brand {
      font: 700 28px/1.2 Georgia, serif;
      letter-spacing: 0.15em;
    }
    .amharic {
      font-size: 16px;
      margin-top: 5px;
      color: #f1dcaa;
    }
    .tagline {
      color: #eadfca;
      margin: 8px auto 10px;
      max-width: 620px;
      font-size: 14px;
    }
    .address {
      font-size: 12px;
      color: #e9ded5;
      line-height: 1.6;
    }
    .address a {
      color: #f1dcaa;
      text-decoration: none;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.3);
    }
    .socials {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .socials a {
      color: #fff;
      text-decoration: none;
      border: 1px solid #765542;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      transition: 0.2s;
    }
    .socials a:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--gold);
    }

    /* ===== LANGUAGE BAR ===== */
    .langs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .langs::-webkit-scrollbar {
      display: none;
    }
    .langs button {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      white-space: nowrap;
      color: var(--ink);
      font-size: 13px;
      transition: 0.2s;
    }
    .langs button.active {
      background: var(--brown);
      color: #fff;
      border-color: var(--brown);
    }

    /* ===== MAIN LAYOUT ===== */
    main {
      padding: 16px;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 14px;
    }
    .section-title h2 {
      margin: 0;
      font: 700 22px/1.2 Georgia, serif;
    }

    /* ===== CARDS & COMPONENTS ===== */
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .promo {
      background: linear-gradient(135deg, #3a2116, #21140f);
      color: #fff;
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .promo strong {
      color: #f1d38a;
      display: block;
      font-size: 18px;
    }
    .promo span {
      font-size: 14px;
      opacity: 0.9;
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tabs button {
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 13px;
      transition: 0.2s;
    }
    .tabs button.active {
      background: var(--brown);
      color: #fff;
      border-color: var(--brown);
    }

    /* ===== PRODUCT GRID ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .product {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: 0.2s;
    }
    .product:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
    }
    .product-img {
      height: 145px;
      background: linear-gradient(145deg, #efe4d8, #fff);
      display: grid;
      place-items: center;
      font-size: 52px;
    }
    .product-body {
      padding: 14px;
    }
    .product h3 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 700;
    }
    .product .meta {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .price {
      font-weight: 800;
      font-size: 16px;
      color: var(--brown);
    }
    .add {
      background: var(--brown);
      color: #fff;
      border-radius: 10px;
      padding: 10px 0;
      width: 100%;
      margin-top: 10px;
      font-weight: 600;
      transition: 0.2s;
    }
    .add:hover {
      background: var(--brown2);
    }

    /* ===== METRICS ===== */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .metric {
      padding: 16px;
      border-radius: 16px;
      background: #f8f3ed;
      border: 1px solid var(--line);
    }
    .metric small {
      color: var(--muted);
      font-size: 12px;
    }
    .metric strong {
      display: block;
      font-size: 24px;
      margin-top: 4px;
    }

    /* ===== BUTTONS ===== */
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
    }
    .btn {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background: var(--brown);
      color: #fff;
      font-weight: 600;
      text-align: center;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }
    .btn.alt {
      background: #f3ece4;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn.green {
      background: var(--green);
    }
    .btn.red {
      background: var(--red);
    }
    .btn.gold {
      background: #a77b25;
    }
    .btn.outline {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    /* ===== FORMS ===== */
    label {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin: 12px 0 4px;
      font-weight: 600;
    }
    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--ink);
      font-size: 15px;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .row>* {
      flex: 1;
      min-width: 100px;
    }

    /* ===== BADGES ===== */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .badge.active {
      background: #e5f6ed;
      color: var(--green);
    }
    .badge.pending {
      background: #fff2d2;
      color: var(--amber);
    }
    .badge.danger {
      background: #fde8ea;
      color: var(--red);
    }
    .badge.muted {
      background: #f0ece8;
      color: var(--muted);
    }

    /* ===== LISTS ===== */
    .list {
      display: grid;
      gap: 10px;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fcfaf8;
      flex-wrap: wrap;
    }
    .list-item .info {
      flex: 1;
      min-width: 120px;
    }
    .list-item .info strong {
      display: block;
      font-size: 15px;
    }
    .list-item .info small {
      color: var(--muted);
      font-size: 12px;
    }

    /* ===== BOTTOM NAV ===== */
    .bottom {
      position: fixed;
      z-index: 20;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(1100px, 100%);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-around;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    .bottom button {
      background: none;
      color: var(--muted);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 12px;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 56px;
    }
    .bottom button b {
      font-size: 20px;
      display: block;
      font-weight: 400;
    }
    .bottom button.sel {
      color: var(--brown);
      background: #f3ece4;
    }
    .bottom button .badge-dot {
      background: var(--red);
      color: #fff;
      border-radius: 50%;
      padding: 0 6px;
      font-size: 10px;
      line-height: 18px;
      min-width: 18px;
      text-align: center;
    }

    /* ===== PORTAL SCREENS ===== */
    .portal-screen {
      min-height: 100vh;
      background: linear-gradient(135deg, #24150f, #51301f);
      color: #fff;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .portal-screen .logo {
      width: 80px;
      height: 80px;
      font-size: 32px;
    }
    .portal-card {
      background: #fff;
      color: var(--ink);
      max-width: 560px;
      width: 100%;
      margin: 25px auto;
      padding: 24px;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .portal-choice {
      display: block;
      width: 100%;
      text-align: left;
      padding: 18px 20px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 16px;
      margin: 10px 0;
      transition: 0.2s;
      cursor: pointer;
    }
    .portal-choice:hover {
      border-color: var(--gold);
      background: #fcf9f5;
    }
    .portal-choice strong {
      display: block;
      font-size: 17px;
    }
    .portal-choice span {
      font-size: 13px;
      color: var(--muted);
    }

    /* ===== SCANNER ===== */
    .scanner {
      border: 2px dashed #cbb49b;
      border-radius: 18px;
      padding: 35px 20px;
      text-align: center;
      background: #fbf7f2;
    }
    .scanner .qr {
      font-size: 55px;
      display: block;
      margin-bottom: 10px;
    }

    /* ===== TABLE ===== */
    .table-wrap {
      overflow-x: auto;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .table th,
    .table td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
    }
    .table th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .table tr:last-child td {
      border-bottom: 0;
    }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 700px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
      .metric-grid {
        grid-template-columns: repeat(4, 1fr);
      }
      main {
        padding: 22px 30px;
      }
      .actions {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    @media (max-width: 480px) {
      .brand {
        font-size: 22px;
        letter-spacing: 0.1em;
      }
      .grid {
        gap: 10px;
      }
      .product-img {
        height: 120px;
      }
      .bottom button {
        font-size: 10px;
        min-width: 48px;
      }
      .bottom button b {
        font-size: 17px;
      }
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #24150f;
      color: #fff;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      z-index: 100;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      animation: fadeUp 0.3s ease;
      max-width: 90%;
      text-align: center;
      pointer-events: none;
    }
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    /* ================================================================
       SoYam Cosmo — Telegram Mini App (Production‑ready)
       ================================================================
       SECURITY NOTE:
       - This frontend demonstrates the user interface.
       - In production, the backend MUST verify Telegram.WebApp.initData
         and return the user's authorized roles and permissions.
       - Never trust client‑side role decisions for sensitive actions.
       ================================================================ */

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready();
      tg.expand(); }

    /* ===== STORE DATA (backend integration point) ===== */
    const STORE = {
      name: "soYam cosmo",
      am: "ሶያም ኮስሞቲክስ",
      owner: "Rahel Mulatu",
      address: "Betel Building, Ground Floor, Addis Ababa, Ethiopia",
      phone: "+251919096451",
      maps: "https://maps.app.goo.gl/FMJMrTvD2wDPGJUv8",
      products: [
        { id: 1, name: "Luxury Face Cream", cat: "Skincare", price: 850, stock: 24, icon: "🧴" },
        { id: 2, name: "Vitamin C Serum", cat: "Skincare", price: 1200, stock: 18, icon: "✨" },
        { id: 3, name: "Body Lotion", cat: "Skincare", price: 650, stock: 42, icon: "🧴" },
        { id: 4, name: "Beauty Fragrance", cat: "Fragrance", price: 1450, stock: 11, icon: "🌸" },
        { id: 5, name: "Hair Care Oil", cat: "Haircare", price: 700, stock: 27, icon: "💧" },
        { id: 6, name: "Liquid Detergent", cat: "Detergent", price: 390, stock: 65, icon: "🫧" },
        { id: 7, name: "Laundry Soap", cat: "Detergent", price: 250, stock: 53, icon: "🧼" },
        { id: 8, name: "Makeup Set", cat: "Makeup", price: 1850, stock: 8, icon: "💄" }
      ],
      sellers: [
        { username: "@silencer01m", phone: "+251948479301", status: "ACTIVE", store: "SoYam Cosmetics" }
      ],
      orders: [
        { id: "#1024", customer: "Telegram Buyer", total: 2850, status: "PAYMENT_PENDING", date: "Today" },
        { id: "#1023", customer: "Telegram Buyer", total: 1450, status: "DELIVERY", date: "Today" },
        { id: "#1022", customer: "Telegram Buyer", total: 850, status: "OWNER_PENDING", date: "Yesterday" }
      ]
    };

    /* ===== APPLICATION STATE ===== */
    let state = {
      portal: null, // 'BUYER' | 'SELLER' | 'OWNER' | 'DRIVER'
      tab: 'home',
      category: 'All',
      cart: [],
      lang: 'English',
      delivery: 'delivery',
      orders: [...STORE.orders],
      user: null,
      roles: []
    };

    /* ===== TELEGRAM USER ===== */
    function getTelegramUser() {
      const u = tg?.initDataUnsafe?.user;
      if (u) return u;
      return { id: "demo-buyer", first_name: "Telegram", last_name: "User", username: "demo" };
    }

    /* ===== ROLE RESOLVER (Production: replace with backend call) ===== */
    function resolveRoles() {
      const u = getTelegramUser();
      state.user = u;
      const userId = String(u.id);

      // In production, fetch from backend: /api/me returns { roles: ['BUYER', ...] }
      // For demo, we simulate using hardcoded owner IDs or query param.
      const ownerIds = window.SOYAM_OWNER_IDS || [];
      if (ownerIds.includes(userId)) return ['OWNER', 'SELLER'];
      if (window.SOYAM_DEMO_ROLE === 'SELLER') return ['SELLER'];
      if (window.SOYAM_DEMO_ROLE === 'DRIVER') return ['DRIVER'];
      // Default: everyone is a buyer
      return ['BUYER'];
    }

    /* ===== HELPERS ===== */
    function money(n) { return new Intl.NumberFormat('en-US').format(n) + ' ETB'; }

    function esc(s) { return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
        "'": '&#039;' } [m])); }

    function toast(msg) {
      const old = document.querySelector('.toast');
      if (old) old.remove();
      const d = document.createElement('div');
      d.className = 'toast';
      d.textContent = msg;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 2200);
    }

    /* ===== RENDER ENGINE ===== */
    function render() {
      state.roles = resolveRoles();
      if (!state.portal) {
        // If user is only a buyer, go directly to buyer portal.
        if (state.roles.length === 1 && state.roles[0] === 'BUYER') {
          state.portal = 'BUYER';
        } else if (state.roles.includes('OWNER')) {
          return renderPortalSelector();
        } else {
          state.portal = state.roles[0] || 'BUYER';
        }
      }

      // If portal is not allowed, fallback to buyer
      if (!state.roles.includes(state.portal) && state.portal !== 'BUYER') {
        state.portal = 'BUYER';
      }

      switch (state.portal) {
        case 'OWNER':
          return renderOwner();
        case 'SELLER':
          return renderSeller();
        case 'DRIVER':
          return renderDriver();
        default:
          return renderBuyer();
      }
    }

    /* ===== PORTAL SELECTOR (for multi‑role users) ===== */
    function renderPortalSelector() {
      document.getElementById('app').innerHTML = `
        <div class="portal-screen">
          <div class="logo">SY</div>
          <h1 style="font-family:Georgia,serif;margin-top:12px;">Welcome back, ${state.user?.first_name || 'Owner'}</h1>
          <p style="opacity:0.8;max-width:400px;">How would you like to continue?</p>
          <div class="portal-card">
            <button class="portal-choice" onclick="setPortal('OWNER')">
              <strong>👑 Owner Portal</strong>
              <span>Manage SoYam, inventory, sellers, orders and financial controls.</span>
            </button>
            <button class="portal-choice" onclick="setPortal('SELLER')">
              <strong>🏪 Seller Portal</strong>
              <span>Manage your store, orders, payments and delivery operations.</span>
            </button>
            <button class="portal-choice" onclick="setPortal('BUYER')">
              <strong>🛍️ Buyer Portal</strong>
              <span>Shop the collection, place orders and track deliveries.</span>
            </button>
          </div>
        </div>
      `;
    }

    function setPortal(p) {
      state.portal = p;
      state.tab = 'home';
      render();
    }

    /* ===== SWITCH PORTAL (quick toggle for owner/seller) ===== */
    function switchPortal() {
      if (state.portal === 'OWNER' && state.roles.includes('SELLER')) {
        state.portal = 'SELLER';
      } else if (state.portal === 'SELLER' && state.roles.includes('OWNER')) {
        state.portal = 'OWNER';
      } else if (state.roles.length > 1) {
        // cycle through roles
        const idx = state.roles.indexOf(state.portal);
        state.portal = state.roles[(idx + 1) % state.roles.length];
      } else {
        toast('Only one role available');
        return;
      }
      state.tab = 'home';
      render();
    }

    /* ============================================================
       BUYER PORTAL
       ============================================================ */
    function renderBuyer() {
      const products = STORE.products.filter(p => state.category === 'All' || p.cat === state.category);
      let content = '';

      if (state.tab === 'home') {
        content = `
          <div class="promo">
            <strong>✨ New Arrivals This Week!</strong>
            <span>Premium skincare, beauty & detergent essentials — discover the collection.</span>
          </div>
          <div class="section-title"><h2>Collections</h2></div>
          <div class="tabs">
            ${['All','Skincare','Makeup','Fragrance','Haircare','Detergent'].map(c =>
              `<button class="${state.category===c?'active':''}" onclick="state.category='${c}';render()">${c}</button>`
            ).join('')}
          </div>
          <div class="grid">
            ${products.map(p => `
              <article class="product">
                <div class="product-img">${p.icon}</div>
                <div class="product-body">
                  <h3>${esc(p.name)}</h3>
                  <div class="meta">${p.cat} · Stock ${p.stock}</div>
                  <span class="price">${money(p.price)}</span>
                  <button class="add" onclick="addToCart(${p.id})">+ Add to basket</button>
                </div>
              </article>
            `).join('')}
          </div>
          <div class="card" style="margin-top:20px;">
            <h3>🔍 Can't find a product?</h3>
            <p style="color:var(--muted);font-size:13px;margin:6px 0 12px;">Upload a photo or tell us the product name and we'll find it for you.</p>
            <button class="btn alt" onclick="requestProduct()">📷 Upload Photo / Name</button>
          </div>
        `;
      } else if (state.tab === 'orders') {
        content = `
          <div class="section-title"><h2>📋 My Orders</h2></div>
          <div class="list">
            ${state.orders.map(o => `
              <div class="list-item">
                <div class="info">
                  <strong>Order ${o.id}</strong>
                  <small>${o.date} · ${money(o.total)}</small>
                </div>
                <span class="badge ${o.status==='DELIVERY'?'active':o.status==='PAYMENT_PENDING'?'pending':'muted'}">${o.status.replaceAll('_',' ')}</span>
              </div>
            `).join('')}
          </div>
        `;
      } else if (state.tab === 'cart') {
        content = renderCart();
      }

      document.getElementById('app').innerHTML = `
        <div class="app">
          ${renderHero()}
          <main>${content}</main>
          ${renderBottom('buyer')}
        </div>
      `;
    }

    function renderHero() {
      return `
        <header class="hero">
          <div class="logo">SY</div>
          <div class="brand">soYam cosmo</div>
          <div class="amharic">${STORE.am}</div>
          <div class="tagline">✦ Premium beauty essentials: detergents, soaps, creams & more!</div>
          <div class="address">
            📍 ${STORE.address}<br>
            📞 <a href="tel:${STORE.phone}">${STORE.phone}</a>
          </div>
          <div class="socials">
            <a href="#" target="_blank">TikTok</a>
            <a href="#" target="_blank">Facebook</a>
            <a href="https://wa.me/${STORE.phone.replace('+','')}" target="_blank">WhatsApp</a>
          </div>
        </header>
        <div class="langs">
          ${['English','አማርኛ','ትግርኛ','Oromiffa','Gurage','Soomaali'].map(l =>
            `<button class="${state.lang===l?'active':''}" onclick="state.lang='${l}';render()">${l}</button>`
          ).join('')}
        </div>
      `;
    }

    function renderCart() {
      const items = state.cart.map(x => ({ ...STORE.products.find(p => p.id === x.id), qty: x.qty }));
      const total = items.reduce((a, x) => a + x.price * x.qty, 0);
      if (!items.length) {
        return `
          <div class="card" style="text-align:center;padding:40px;">
            <div style="font-size:48px;">🛒</div>
            <h3>Your basket is empty</h3>
            <button class="btn" onclick="state.tab='home';render()">Browse products</button>
          </div>
        `;
      }
      return `
        <div class="section-title"><h2>🛒 Your Basket</h2></div>
        <div class="list">
          ${items.map(x => `
            <div class="list-item">
              <div class="info">
                <strong>${esc(x.name)}</strong>
                <small>${x.qty} × ${money(x.price)}</small>
              </div>
              <strong>${money(x.qty * x.price)}</strong>
            </div>
          `).join('')}
        </div>
        <div class="card">
          <h3>📦 Fulfillment</h3>
          <div class="actions" style="grid-template-columns:1fr 1fr;">
            <button class="btn ${state.delivery==='pickup'?'gold':'alt'}" onclick="state.delivery='pickup';render()">🏪 Store Collection</button>
            <button class="btn ${state.delivery==='delivery'?'gold':'alt'}" onclick="state.delivery='delivery';render()">🛵 Delivery</button>
          </div>
          ${state.delivery === 'delivery' ? `
            <label>Full Name</label>
            <input id="cname" placeholder="Your full name" />
            <label>Phone</label>
            <input id="cphone" placeholder="${STORE.phone}" />
            <label>Drop‑off Address</label>
            <textarea id="caddr" placeholder="Enter delivery address"></textarea>
          ` : ''}
          <h3 style="margin-top:16px;">Total: ${money(total)}</h3>
          <button class="btn green" onclick="checkout(${total})">Continue to payment</button>
        </div>
      `;
    }

    function addToCart(id) {
      const existing = state.cart.find(x => x.id === id);
      if (existing) existing.qty++;
      else state.cart.push({ id, qty: 1 });
      toast('Added to cart');
      render();
    }

    function checkout(total) {
      if (!state.cart.length) return;
      document.getElementById('app').innerHTML = `
        <div class="app">
          ${renderHero()}
          <main>
            <div class="section-title"><h2>💳 Payment</h2></div>
            <div class="card">
              <div class="notice" style="background:#fff8e8;padding:12px;border-radius:12px;border:1px solid #eed59d;font-size:13px;margin-bottom:16px;">
                Upload your payment proof. The seller will verify and confirm your order.
              </div>
              <label>Payment Method</label>
              <select id="payMethod">
                <option>Bank Transfer</option>
                <option>Telebirr</option>
                <option>Cash on Collection</option>
              </select>
              <label>Payment Proof (screenshot)</label>
              <input id="proof" type="file" accept="image/*" />
              <h3 style="margin:16px 0 8px;">Total: ${money(total)}</h3>
              <button class="btn green" onclick="submitOrder(${total})">Submit Order</button>
            </div>
          </main>
          ${renderBottom('buyer')}
        </div>
      `;
    }

    function submitOrder(total) {
      const id = '#' + (1025 + state.orders.length);
      state.orders.unshift({ id, customer: 'Telegram Buyer', total, status: 'PAYMENT_PENDING', date: 'Today' });
      state.cart = [];
      state.tab = 'orders';
      toast('✅ Order submitted!');
      render();
    }

    function requestProduct() {
      toast('📸 Product request sent — seller will respond.');
    }

    /* ============================================================
       SELLER PORTAL
       ============================================================ */
    function renderSeller() {
      const pending = state.orders.filter(o => o.status === 'PAYMENT_PENDING').length;
      document.getElementById('app').innerHTML = `
        <div class="app">
          <header class="hero">
            <div class="logo">SY</div>
            <div class="brand">🏪 SELLER HUB</div>
            <div class="amharic">${STORE.am}</div>
            <div class="address">${STORE.address}</div>
          </header>
          <main>
            <div class="section-title">
              <h2>Seller Operations</h2>
              <span class="badge active">ACTIVE</span>
            </div>
            <div class="metric-grid">
              <div class="metric"><small>Pending Orders</small><strong>${pending}</strong></div>
              <div class="metric"><small>In-Store Picks</small><strong>7</strong></div>
              <div class="metric"><small>Deliveries</small><strong>3</strong></div>
              <div class="metric"><small>Low Stock</small><strong>${STORE.products.filter(p=>p.stock<10).length}</strong></div>
            </div>
            <div class="card">
              <h3>🧾 Payment Verification</h3>
              ${state.orders.filter(o=>o.status==='PAYMENT_PENDING').map(o => `
                <div class="list-item">
                  <div class="info">
                    <strong>Order ${o.id}</strong>
                    <small>${money(o.total)} · Payment proof uploaded</small>
                  </div>
                  <button class="btn green" onclick="verifyOrder('${o.id}')">✓ Verify</button>
                </div>
              `).join('') || '<p style="color:var(--muted);margin:4px 0;">No pending payment proofs.</p>'}
            </div>
            <div class="card">
              <h3>⚡ Quick Actions</h3>
              <div class="actions">
                <button class="btn gold" onclick="scanQR()">📷 Scan Item QR</button>
                <button class="btn" onclick="deliveryQueue()">🚛 Delivery Queue</button>
                <button class="btn alt" onclick="sellerInventory()">📦 Inventory</button>
                ${state.roles.includes('OWNER') ? `<button class="btn alt" onclick="switchPortal()">👑 Owner</button>` : ''}
              </div>
            </div>
          </main>
          ${renderBottom('seller')}
        </div>
      `;
    }

    function verifyOrder(id) {
      const o = state.orders.find(x => x.id === id);
      if (o) { o.status = 'DELIVERY';
        toast('✅ Payment verified — order set for delivery'); }
      render();
    }

    function scanQR() { toast('📷 QR scanner activated (demo)'); }

    function deliveryQueue() { toast('🚛 Delivery queue opened (demo)'); }

    function sellerInventory() {
      toast('📦 Inventory view (demo)');
      // In production, show only products assigned to this seller's store.
    }

    /* ============================================================
       DRIVER PORTAL
       ============================================================ */
    function renderDriver() {
      document.getElementById('app').innerHTML = `
        <div class="app">
          <header class="hero">
            <div class="logo">SY</div>
            <div class="brand">🚚 DRIVER PORTAL</div>
            <div class="address">${STORE.address}</div>
          </header>
          <main>
            <div class="section-title">
              <h2>Assigned Deliveries</h2>
              <span class="badge active">ACTIVE</span>
            </div>
            <div class="card">
              <div class="list">
                <div class="list-item">
                  <div class="info">
                    <strong>Order #1023</strong>
                    <small>Drop‑off: Addis Ababa · Customer contact protected</small>
                  </div>
                  <span class="badge pending">ASSIGNED</span>
                </div>
              </div>
              <div class="actions" style="margin-top:14px;">
                <button class="btn alt" onclick="openMaps()">📍 Navigate</button>
                <button class="btn green" onclick="toast('✅ Delivery started')">Start Delivery</button>
              </div>
            </div>
          </main>
          ${renderBottom('driver')}
        </div>
      `;
    }

    function openMaps() {
      window.open('https://www.google.com/maps/search/?api=1&query=Addis+Ababa', '_blank');
    }

    /* ============================================================
       OWNER PORTAL
       ============================================================ */
    function renderOwner() {
      const stockValue = STORE.products.reduce((a, p) => a + p.stock * p.price, 0);
      const revenue = STORE.orders.reduce((a, o) => a + o.total, 0);
      document.getElementById('app').innerHTML = `
        <div class="app">
          <header class="hero">
            <div class="logo">SY</div>
            <div class="brand">👑 OWNER COMMAND</div>
            <div class="amharic">${STORE.am}</div>
            <div class="address">Secure administration · ${STORE.owner}</div>
          </header>
          <main>
            <div class="section-title">
              <h2>Executive Dashboard</h2>
              ${state.roles.includes('SELLER') ? `<button class="btn alt" style="padding:8px 16px;" onclick="switchPortal()">🏪 Seller</button>` : ''}
            </div>
            <div class="metric-grid">
              <div class="metric"><small>Total Revenue</small><strong>${money(revenue)}</strong></div>
              <div class="metric"><small>Stock Capital</small><strong>${money(stockValue)}</strong></div>
              <div class="metric"><small>Products</small><strong>${STORE.products.length}</strong></div>
              <div class="metric"><small>Pending Audit</small><strong>${STORE.orders.filter(o=>o.status==='OWNER_PENDING').length}</strong></div>
            </div>
            <div class="card">
              <h3>📋 Operations</h3>
              <div class="actions">
                <button class="btn" onclick="ownerInventory()">📦 Inventory</button>
                <button class="btn" onclick="ownerStaff()">👥 Staff</button>
                <button class="btn" onclick="ownerOrders()">🧾 Orders</button>
                <button class="btn gold" onclick="addStock()">➕ Add Stock</button>
              </div>
            </div>
            <div class="card">
              <h3>🔒 Daily Financial Lock</h3>
              <p style="font-size:13px;color:var(--muted);margin:4px 0 12px;">Reconcile physical cash and mobile banking balances against digital sales before closing.</p>
              <button class="btn green" onclick="closeDay()">🔒 Close Daily Transactions</button>
            </div>
            <div class="card">
              <h3>📊 Recent Transactions</h3>
              <div class="list">
                ${state.orders.map(o => `
                  <div class="list-item">
                    <div class="info">
                      <strong>${o.id}</strong>
                      <small>${money(o.total)} · ${o.date}</small>
                    </div>
                    <span class="badge ${o.status==='OWNER_PENDING'?'pending':o.status==='DELIVERY'?'active':'muted'}">${o.status.replaceAll('_',' ')}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </main>
          ${renderBottom('owner')}
        </div>
      `;
    }

    /* ===== OWNER SUB‑VIEWS ===== */
    function ownerInventory() {
      document.getElementById('app').innerHTML = `
        <div class="app">
          <header class="hero"><div class="brand">📦 INVENTORY CONTROL</div></header>
          <main>
            <div class="card">
              <div class="row"><h2 style="margin:0;">Products</h2><button class="btn gold" onclick="addStock()">+ Add</button></div>
              <div class="table-wrap">
                <table class="table">
                  <thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Price</th><th>Action</th></tr></thead>
                  <tbody>
                    ${STORE.products.map(p => `
                      <tr>
                        <td>${p.icon} ${esc(p.name)}</td>
                        <td>${p.cat}</td>
                        <td><span class="badge ${p.stock<10?'danger':'active'}">${p.stock}</span></td>
                        <td>${money(p.price)}</td>
                        <td><button class="btn alt" style="padding:6px 12px;" onclick="editPrice(${p.id})">Edit</button></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
            <button class="btn alt" onclick="render()">← Dashboard</button>
          </main>
        </div>
      `;
    }

    function editPrice(id) {
      const p = STORE.products.find(x => x.id === id);
      const n = prompt('New retail price (ETB)', p.price);
      if (n && Number(n) > 0) { p.price = Number(n);
        toast('Price updated');
        ownerInventory(); }
    }

    function ownerStaff() {
      document.getElementById('app').innerHTML = `
        <div class="app">
          <header class="hero"><div class="brand">👥 AUTHORIZED USERS</div></header>
          <main>
            <div class="card">
              <button class="btn" onclick="addSeller()">+ Add Authorized Seller</button>
              <div class="list" style="margin-top:14px;">
                ${STORE.sellers.map((s, i) => `
                  <div class="list-item">
                    <div class="info">
                      <strong>${esc(s.username)}</strong>
                      <small>${s.phone} · ${s.store}</small>
                    </div>
                    <div>
                      <span class="badge active">${s.status}</span>
                      <button class="btn red" style="padding:6px 12px;margin-left:6px;" onclick="revokeSeller(${i})">Revoke</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            <button class="btn alt" onclick="render()">← Dashboard</button>
          </main>
        </div>
      `;
    }

    function addSeller() {
      const username = prompt('Telegram Username (e.g. @username)');
      if (!username) return;
      const phone = prompt('Phone Number') || '';
      STORE.sellers.push({ username, phone, status: 'ACTIVE', store: 'SoYam Cosmetics' });
      toast('Seller added');
      ownerStaff();
    }

    function revokeSeller(i) {
      if (confirm('Revoke this seller?')) { STORE.sellers.splice(i, 1);
        toast('Seller revoked');
        ownerStaff(); }
    }

    function ownerOrders() {
      document.getElementById('app').innerHTML = `
        <div class="app">
          <header class="hero"><div class="brand">🧾 ORDER AUDIT</div></header>
          <main>
            <div class="card">
              <div class="list">
                ${state.orders.map(o => `
                  <div class="list-item">
                    <div class="info">
                      <strong>${o.id}</strong>
                      <small>${money(o.total)} · ${o.customer}</small>
                    </div>
                    <span class="badge ${o.status==='OWNER_PENDING'?'pending':o.status==='DELIVERY'?'active':'muted'}">${o.status.replaceAll('_',' ')}</span>
                  </div>
                `).join('')}
              </div>
            </div>
            <button class="btn alt" onclick="render()">← Dashboard</button>
          </main>
        </div>
      `;
    }

    function addStock() {
      document.getElementById('app').innerHTML = `
        <div class="app">
          <header class="hero"><div class="brand">➕ ADD NEW STOCK ITEM</div></header>
          <main>
            <div class="card">
              <label>Item Category</label>
              <select id="scat">
                <option>Skincare</option><option>Makeup</option><option>Fragrance</option>
                <option>Haircare</option><option>Detergent</option><option>Cosmetics & Beauty</option>
              </select>
              <label>Product Name</label>
              <input id="sname" placeholder="Enter product name" />
              <label>Product Media</label>
              <div class="actions" style="grid-template-columns:1fr 1fr;">
                <button class="btn alt" onclick="document.getElementById('simg').click()">🖼️ Gallery Upload</button>
                <button class="btn gold" onclick="scanQR()">📸 Camera / Scanner</button>
              </div>
              <input id="simg" type="file" accept="image/*" style="margin-top:8px;" />
              <label>Single Buying Unit Price (ETB)</label>
              <input id="scost" type="number" placeholder="0" />
              <label>Total Number of Items</label>
              <input id="sqty" type="number" placeholder="Quantity" />
              <div class="actions" style="margin-top:16px;grid-template-columns:1fr 1fr;">
                <button class="btn green" onclick="saveStock()">💾 SAVE</button>
                <button class="btn alt" onclick="render()">DISCARD</button>
              </div>
            </div>
          </main>
        </div>
      `;
    }

    function saveStock() {
      const name = document.getElementById('sname').value.trim();
      const cat = document.getElementById('scat').value;
      const cost = Number(document.getElementById('scost').value);
      const qty = Number(document.getElementById('sqty').value);
      if (!name || !qty) return toast('Product name and quantity are required.');
      STORE.products.push({ id: Date.now(), name, cat, price: cost || 0, stock: qty, icon: '📦' });
      toast('✅ Stock item saved');
      render();
    }

    function closeDay() {
      if (confirm('Close and lock today\'s transactions?')) {
        toast('🔒 Daily ledger closed (demo) — production backend must atomically lock the ledger.');
      }
    }

    /* ============================================================
       BOTTOM NAVIGATION
       ============================================================ */
    function renderBottom(activePortal) {
      const cartCount = state.cart.reduce((a, x) => a + x.qty, 0);
      const isBuyer = activePortal === 'buyer';
      const isSeller = activePortal === 'seller';
      const isDriver = activePortal === 'driver';
      const isOwner = activePortal === 'owner';

      let tabs = [];

      if (isBuyer) {
        tabs = [
          { id: 'home', label: 'Home', icon: '⌂' },
          { id: 'orders', label: 'Orders', icon: '🧾' },
          { id: 'cart', label: 'Cart', icon: '🛒', badge: cartCount || '' }
        ];
      } else if (isSeller) {
        tabs = [
          { id: 'home', label: 'Dashboard', icon: '📋' },
          { id: 'orders', label: 'Orders', icon: '🧾' },
          { id: 'scan', label: 'Scan', icon: '📷' }
        ];
      } else if (isDriver) {
        tabs = [
          { id: 'home', label: 'Route', icon: '🗺️' },
          { id: 'orders', label: 'Deliveries', icon: '📦' },
          { id: 'scan', label: 'Scan', icon: '📷' }
        ];
      } else if (isOwner) {
        tabs = [
          { id: 'home', label: 'Dashboard', icon: '👑' },
          { id: 'inventory', label: 'Stock', icon: '📦' },
          { id: 'staff', label: 'Staff', icon: '👥' },
          { id: 'orders', label: 'Orders', icon: '🧾' }
        ];
      }

      // Map tab IDs to actions
      const tabActions = {
        'home': () => { state.tab = 'home';
          render(); },
        'orders': () => { state.tab = 'orders';
          render(); },
        'cart': () => { state.tab = 'cart';
          render(); },
        'inventory': () => ownerInventory(),
        'staff': () => ownerStaff(),
        'scan': () => { if (isSeller) scanQR();
          else toast('📷 Scanner activated'); },
        'default': () => toast('Feature coming soon')
      };

      return `
        <nav class="bottom">
          ${tabs.map(t => {
            const isActive = state.tab === t.id;
            const action = tabActions[t.id] || tabActions['default'];
            const badgeHtml = t.badge ? `<span class="badge-dot">${t.badge}</span>` : '';
            return `
              <button class="${isActive ? 'sel' : ''}" onclick="(${action.toString()})()">
                <b>${t.icon}</b> ${t.label} ${badgeHtml}
              </button>
            `;
          }).join('')}
          <button onclick="contactSupport()"><b>💬</b>Contact</button>
        </nav>
      `;
    }

    function contactSupport() {
      window.open('https://wa.me/' + STORE.phone.replace('+', ''), '_blank');
    }

    /* ================================================================
       INIT
       ================================================================ */
    render();

    // Simulate real‑time stock updates (demo only)
    setInterval(() => {
      const idx = Math.floor(Math.random() * STORE.products.length);
      if (Math.random() > 0.6 && STORE.products[idx].stock > 0) {
        STORE.products[idx].stock = Math.max(0, STORE.products[idx].stock - 1);
        // Re‑render only if current view shows inventory (owner/seller)
        if (state.portal === 'OWNER' && document.querySelector('.inventory-table')) {
          // simple refresh: just re‑render owner inventory if active
          const activeView = document.querySelector('.brand');
          if (activeView && activeView.textContent.includes('INVENTORY')) {
            ownerInventory();
          }
        }
      }
    }, 15000);

    console.log('🚀 soYam cosmo · Telegram Mini App ready');
    console.log('👑 Owner: Rahel Mulatu | 📞 ' + STORE.phone);
    console.log('🔐 Production: Verify initData on backend for role/permission decisions.');
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>soYam Cosmo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           ROOT VARIABLES & RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #D4AF37;
            --primary-light: #E8D08A;
            --primary-dark: #B8962E;
            --secondary: #6B2FA0;
            --cream: #FFF8F0;
            --gold-shimmer: #FFD700;
            --warm-gray: #8C7A6B;
            --dark: #1A1A2E;
            --white: #FFFFFF;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius: 24px;
            --radius-sm: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --bg-primary: #FFF8F0;
            --bg-card: #FFFFFF;
            --text-primary: #1A1A2E;
            --text-secondary: #5A5A6E;
            --border-color: rgba(212, 175, 55, 0.2);
        }

        body.dark-theme {
            --bg-primary: #12121F;
            --bg-card: #1E1E32;
            --text-primary: #F5F0EB;
            --text-secondary: #B5B0AB;
            --border-color: rgba(212, 175, 55, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding-bottom: 80px;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        #main-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 248, 240, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.3s;
        }
        body.dark-theme #main-header {
            background: rgba(18, 18, 31, 0.85);
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-icon {
            font-size: 30px;
            background: linear-gradient(135deg, var(--primary), var(--gold-shimmer));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--gold-shimmer));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        .logo-text span {
            font-weight: 300;
            color: var(--warm-gray);
            -webkit-text-fill-color: var(--warm-gray);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .role-badge-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Poppins', sans-serif;
        }
        .role-badge-header .role-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .role-dot.buyer {
            background: #2196F3;
        }
        .role-dot.seller {
            background: #4CAF50;
        }
        .role-dot.owner {
            background: #FF6F00;
        }

        .lang-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
        }
        .lang-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 12px rgba(212, 175, 55, 0.2);
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            position: relative;
            padding: 4px;
            transition: var(--transition);
        }
        .icon-btn:hover {
            transform: scale(1.1);
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--secondary);
            color: white;
            font-size: 10px;
            font-weight: 700;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }
        .badge.hidden {
            display: none;
        }

        /* ============================================================
           BOTTOM NAVIGATION
           ============================================================ */
        #bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 14px;
            border-top: 1px solid var(--border-color);
            z-index: 200;
            transition: background 0.3s;
        }
        body.dark-theme #bottom-nav {
            background: rgba(18, 18, 31, 0.92);
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 4px 12px;
            transition: var(--transition);
            opacity: 0.5;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }
        .nav-item .nav-icon {
            font-size: 22px;
            transition: var(--transition);
        }
        .nav-item .nav-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--warm-gray);
            transition: var(--transition);
        }
        .nav-item.active {
            opacity: 1;
        }
        .nav-item.active .nav-label {
            color: var(--primary);
        }
        .nav-item.active .nav-icon {
            transform: scale(1.1);
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            top: -4px;
            width: 20px;
            height: 3px;
            background: var(--primary);
            border-radius: 4px;
        }

        /* ============================================================
           PAGE CONTAINER
           ============================================================ */
        #page-container {
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        .page {
            display: none;
            animation: fadeSlideUp 0.4s ease;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           HERO BANNER
           ============================================================ */
        .hero-banner {
            background: linear-gradient(145deg, var(--secondary), var(--primary-dark));
            border-radius: var(--radius);
            padding: 32px 24px 28px;
            color: white;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 8px 32px rgba(107, 47, 160, 0.3);
        }
        .hero-banner::before {
            content: '✨';
            position: absolute;
            right: 16px;
            top: 10px;
            font-size: 52px;
            opacity: 0.15;
        }
        .hero-banner::after {
            content: '🌹';
            position: absolute;
            bottom: -10px;
            right: 60px;
            font-size: 72px;
            opacity: 0.1;
        }
        .hero-banner .hero-logo {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #FFD700, #FFF8E1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }
        .hero-banner .hero-logo-sub {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 300;
            opacity: 0.85;
            margin-top: -4px;
            letter-spacing: 6px;
            color: #FFF8E1;
            -webkit-text-fill-color: #FFF8E1;
        }
        .hero-banner .hero-tagline {
            font-size: 16px;
            font-weight: 500;
            margin-top: 8px;
            opacity: 0.95;
            font-style: italic;
        }
        .hero-banner .hero-details {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 20px;
            font-size: 13px;
            opacity: 0.85;
        }
        .hero-banner .hero-details span {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 14px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }
        .hero-banner .hero-actions {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .hero-banner .hero-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            backdrop-filter: blur(4px);
            transition: var(--transition);
            font-size: 13px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .hero-banner .hero-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
        .hero-banner .hero-btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--dark);
        }
        .hero-banner .hero-btn-primary:hover {
            background: var(--gold-shimmer);
            border-color: var(--gold-shimmer);
        }
        .hero-banner .hero-btn-call {
            background: #2E7D32;
            border-color: #2E7D32;
        }
        .hero-banner .hero-btn-call:hover {
            background: #1B5E20;
        }
        .hero-banner .hero-btn-chat {
            background: #0088CC;
            border-color: #0088CC;
        }
        .hero-banner .hero-btn-chat:hover {
            background: #006699;
        }

        /* ============================================================
           SECTION TITLES
           ============================================================ */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 22px 0 12px;
        }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .section-title .highlight {
            color: var(--primary);
        }

        /* ============================================================
           CATEGORY SCROLL
           ============================================================ */
        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0 16px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            flex-shrink: 0;
            background: var(--bg-card);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }
        .category-chip:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }
        .category-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
        }

        /* ============================================================
           PRODUCT GRID
           ============================================================ */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 4px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid var(--border-color);
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background: #f0ebe4;
        }

        .product-info {
            padding: 12px 14px 14px;
        }
        .product-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-primary);
        }
        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }
        .product-stock {
            font-size: 12px;
            font-weight: 500;
            margin-top: 4px;
        }
        .stock-in {
            color: #2E7D32;
        }
        .stock-low {
            color: #E65100;
        }
        .stock-out {
            color: #C62828;
        }

        .product-card .image-wrapper {
            position: relative;
        }

        .product-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-new {
            background: var(--primary);
            color: white;
        }
        .badge-best {
            background: #E53935;
            color: white;
        }
        .badge-low {
            background: #FB8C00;
            color: white;
        }

        .product-quick-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .product-quick-actions button {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
            min-width: 50px;
        }
        .btn-scan-order {
            background: var(--secondary);
            color: white;
            flex: 2;
        }
        .btn-scan-order:hover {
            background: #5A258A;
        }
        .btn-wish {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            flex: 1;
        }
        .btn-wish:hover {
            border-color: var(--primary);
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--gold-shimmer));
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(212, 175, 55, 0.4);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
        }
        .btn-secondary:hover {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.04);
        }

        .btn-success {
            background: #2E7D32;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
        }
        .btn-success:hover {
            background: #1B5E20;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #C62828;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
        }
        .btn-danger:hover {
            background: #B71C1C;
            transform: translateY(-2px);
        }

        /* ============================================================
           MODALS
           ============================================================ */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .modal.visible {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius) var(--radius) 0 0;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px 20px 28px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-primary);
        }
        .modal.visible .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: var(--warm-gray);
            padding: 4px 8px;
            transition: var(--transition);
        }
        .close-modal:hover {
            transform: rotate(90deg);
        }

        .close-modal-top {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--warm-gray);
            float: right;
            padding: 4px 8px;
            transition: var(--transition);
        }
        .close-modal-top:hover {
            transform: rotate(90deg);
        }

        /* ============================================================
           LANGUAGE LIST
           ============================================================ */
        .lang-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
            border-radius: var(--radius-sm);
        }
        .lang-item:hover {
            background: rgba(212, 175, 55, 0.06);
        }
        .lang-item .lang-flag {
            font-size: 28px;
        }
        .lang-item .lang-name {
            font-weight: 600;
            font-size: 15px;
        }
        .lang-item .lang-native {
            font-size: 13px;
            color: var(--warm-gray);
        }
        .lang-item .lang-check {
            margin-left: auto;
            color: var(--primary);
            font-size: 18px;
        }

        /* ============================================================
           QR SCANNER OVERLAY — REAL CAMERA
           ============================================================ */
        .scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .scanner-overlay.hidden {
            display: none;
        }

        .scanner-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #qrVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-frame {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 3px solid var(--primary);
            border-radius: 24px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
            animation: pulse-border 1.5s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%,
            100% {
                border-color: var(--primary);
                box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
            }
            50% {
                border-color: var(--gold-shimmer);
                box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.6);
            }
        }

        .scanner-overlay-ui {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            padding: 0 20px;
        }
        .scanner-overlay-ui p {
            font-size: 16px;
            margin-bottom: 16px;
            font-weight: 500;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }
        .scanner-overlay-ui .btn-secondary {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 10px 28px;
        }
        .scanner-overlay-ui .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .scanner-overlay-ui .btn-gallery {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 10px 28px;
            margin-top: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
        }
        .scanner-overlay-ui .btn-gallery:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ============================================================
           TOAST NOTIFICATION
           ============================================================ */
        .toast {
            position: fixed;

            const fullName = (firstName + ' ' + lastName).trim();

            if (username === OWNER_USERNAME || username.toLowerCase() === OWNER_USERNAME.toLowerCase()) {
                isOwner = true;
                isSeller = false;
                return 'owner';
            }

            // Check if user is Seller
            if (username === SELLER_USERNAME || username.toLowerCase() === SELLER_USERNAME.toLowerCase()) {
                isSeller = true;
                isOwner = false;
                return 'seller';

            // Default: Buyer

        function setLanguage(code) {
            currentLanguage = code;

            const langData = LANGUAGES.find(l => l.code === code);
            if (langData) {
                document.getElementById('currentFlag').textContent = langData.flag;
                document.getElementById('currentLang').textContent = langData.name.substring(0, 2).toUpperCase();
            }
            document.querySelectorAll('[data-key]').forEach(function(el) {
                const key = el.dataset.key;
                if (TRANSLATIONS[code] && TRANSLATIONS[code][key]) {
                    el.textContent = TRANSLATIONS[code][key];
                }
            });
        }

        function selectLanguage(code) {
            setLanguage(code);
            closeModal('languageModal');
            showToast('🌍 Language: ' + LANGUAGES.find(l => l.code === code).name, 'success');
            const currentPage = document.querySelector('.nav-item.active');
            if (currentPage) navigateTo(currentPage.dataset.page);

            const container = document.getElementById('workflowContent');
            const t = TRANSLATIONS[currentLanguage] || TRANSLATIONS.en;
            const step = pendingOrder.step;
            const product = pendingOrder.product;

            const steps = [

                { key: 'step_scan', label: t.step_scan || 'Scan' },
                { key: 'step_pay', label: t.step_pay || 'Pay' },
                { key: 'step_confirm', label: t.step_confirm || 'Confirm' }

            let stepHtml = `

                                <div class="workflow-step ${i + 1 < step ? 'done' : i + 1 === step ? 'active' : ''}">

                                    <div class="step-label">${s.label}</div>
                                </div>
                            `).join('')}

                    `;

            let contentHtml = '';

            switch (step) {
                case 1:
                    contentHtml = `

                                    </div>
                                </div>
                            `;
                    break;

                case 2:
                    contentHtml = `
                                <div style="text-align:center;padding:8px 0;">
                                    <div style="background:var(--bg-primary);border-radius:var(--radius);padding:30px;margin-bottom:16px;border:2px dashed var(--border-color);">

        function submitPaymentReference() {
            const ref = document.getElementById('paymentRefInput').value.trim();
            if (!ref) {
                showToast('⚠️ Please enter payment reference', 'error');
                return;
            }
            pendingOrder.paymentRef = ref;
            pendingOrder.step = 4;

            const product = pendingOrder.product;
            const orderId = 'ORD-' + String(Math.floor(100 + Math.random() * 900));
            const newOrder = {
                id: orderId,
                product: product.name,
                price: product.price,
                status: 'waiting-payment',
                date: new Date().toISOString().split('T')[0],
                type: 'Delivery',
                tracking: 'SOYAM-' + String(Math.floor(1000 + Math.random() * 9000)),
                qrCode: product.qrCode,
                paymentRef: ref
            };
            orders.unshift(newOrder);
            product.stock--;

            addNotification('💰 Payment pending: ' + product.name + ' (' + ref + ')', 'warning');
            addNotification('📦 New order: ' + product.name + ' (#' + orderId + ')', 'info');

            renderWorkflowStep();
            showToast('✅ Order placed! Awaiting owner approval.', 'success');

            // Notify Owner via Telegram (simulated)
            if (tg && tg.sendData) {
                tg.sendData(JSON.stringify({
                    type: 'new_order',
                    orderId: orderId,
                    product: product.name,
                    ref: ref
                }));
            }
        }

        function closeOrderWorkflow() {
            pendingOrder = null;
            closeModal('orderWorkflowModal');
        }

        // ============================================================
        // REAL QR SCANNER — Camera + Gallery
        // ============================================================
        function openRealScanner() {
            const scanner = document.getElementById('qrScanner');
            scanner.classList.remove('hidden');

            const video = document.getElementById('qrVideo');
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                    .then(function(stream) {
                        video.srcObject = stream;
                        video.play();
                        // Start QR code detection (simplified)
                        startQRDetection();
                    })
                    .catch(function(err) {
                        showToast('❌ Camera access denied. Please allow camera permission.', 'error');
                        closeScanner();
                    });
            } else {
                showToast('❌ Camera not supported on this device.', 'error');
                closeScanner();
            }
        }

        function startQRDetection() {
            // Simulate QR detection after 3 seconds
            // In production, use a QR scanning library like jsQR
            let attempts = 0;
            const interval = setInterval(() => {
                attempts++;
                if (attempts > 5) {
                    clearInterval(interval);
                    // Simulate successful scan
                    showToast('📷 QR Code Detected!', 'success');
                    handleQRScanned('SOYAM-P001');
                    closeScanner();
                }
            }, 1500);
        }

        function handleQRScanned(qrData) {
            // Find product by QR code
            const product = products.find(p => p.qrCode === qrData);
            if (product) {
                showToast('✅ Product found: ' + product.name, 'success');
                if (pendingOrder) {
                    pendingOrder.product = product;
                    pendingOrder.step = 3;
                    renderWorkflowStep();
                }
                addNotification('📷 QR Scanned: ' + product.name, 'info');
            } else {
                showToast('❌ Product not found for QR: ' + qrData, 'error');
            }
        }

        function openGalleryForQR() {
            document.getElementById('galleryInput').click();
        }

        function handleGalleryImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                // Simulate QR detection from image
                showToast('📷 Image uploaded! Analyzing...', 'info');
                setTimeout(() => {
                    // Simulate QR detection
                    const qrData = 'SOYAM-P001';
                    handleQRScanned(qrData);
                    closeScanner();
                }, 1500);
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function openGallery() {
            document.getElementById('galleryInput').click();
        }

        function closeScanner() {
            document.getElementById('qrScanner').classList.add('hidden');
            const video = document.getElementById('qrVideo');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
        }

            return `
                        <div class="admin-panel">
                            <div class="panel-title">🛍️ <span class="highlight">Seller Dashboard</span></div>
                            <div class="stats-grid">
                                <div class="stat-card"><div class="stat-number">${activeOrders.length}</div><div class="stat-label">Active Orders</div></div>
                                <div class="stat-card"><div class="stat-number">${orders.filter(o => o.status === 'delivering').length}</div><div class="stat-label">Delivering</div></div>
                            </div>

                            <button class="btn-primary" onclick="openSellerQRScanner()" style="margin:8px 0;padding:12px;font-size:14px;">📷 Scan Product QR</button>

                            <h4 style="margin:16px 0 8px;">📋 Active Orders</h4>
                            ${activeOrders.length === 0 ? '<p style="color:var(--warm-gray);">No active orders.</p>' :
                                activeOrders.map(o => `
                                    <div class="order-card" style="border-left-color:${o.status === 'pending' ? '#FF6F00' : o.status === 'approved' ? '#2E7D32' : 'var(--primary)'};">
                                        <div class="order-top">
                                            <div>
                                                <div class="order-product">${o.product}</div>
                                                <div class="order-meta">${o.type} • ${o.date}</div>
                                                ${o.qrCode ? `<div class="order-meta" style="font-size:11px;">QR: ${o.qrCode}</div>` : ''}
                                            </div>
                                            <span class="status-badge ${o.status === 'pending' ? 'status-pending' : o.status === 'approved' ? 'status-approved' : 'status-delivering'}">${o.status === 'pending' ? '⏳ Pending' : o.status === 'approved' ? '✅ Approved' : '🚚 Delivering'}</span>
                                        </div>
                                        <div class="order-price">${o.price}</div>
                                        <div class="order-actions">
                                            ${o.status === 'pending' ? `
                                                <button class="btn-success" onclick="showToast('✅ Payment confirmed! Ready for delivery.', 'success')">Confirm Payment</button>
                                            ` : ''}
                                            ${o.status === 'approved' ? `
                                                <button class="btn-primary" style="padding:6px 16px;font-size:12px;" onclick="showToast('🚚 Delivery started!', 'success')">Start Delivery</button>
                                            ` : ''}
                                            ${o.status === 'delivering' ? `
                                                <button class="btn-success" onclick="showToast('✅ Delivery completed! Stock deducted.', 'success')">Complete Delivery</button>
                                                <button class="btn-secondary" onclick="showToast('📍 Location shared with customer', 'info')">Share Location</button>
                                            ` : ''}
                                        </div>
                                        ${o.tracking ? `
                                            <div style="margin-top:6px;font-size:13px;color:var(--primary);">
                                                📦 Tracking: <strong>${o.tracking}</strong>
                                            </div>
                                        ` : ''}
                                    </div>
                                `).join('')
                            }
                        </div>
                    `;
        }

        // ============================================================
        // PRODUCT DETAIL
        // ============================================================
        function openProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            const modal = document.getElementById('productModal');
            const detail = document.getElementById('productDetail');
            const stockClass = product.stock > 5 ? 'stock-in' : product.stock > 0 ? 'stock-low' : 'stock-out';
            const stockText = product.stock > 5 ? '✅ In Stock' : product.stock > 0 ? '⚠️ Low Stock' : '❌ Out of Stock';
            detail.innerHTML = `
                        <img src="${product.image}" style="width:100%;border-radius:16px;margin-bottom:16px;aspect-ratio:1/1;object-fit:cover;" />
                        <h2 style="font-family:'Playfair Display',serif;">${product.name}</h2>
                        <p style="font-size:24px;font-weight:700;color:var(--primary);">${product.price}</p>
                        <p style="color:var(--warm-gray);margin:4px 0 8px;">Category: ${product.category}</p>
                        <p style="font-weight:500;${stockClass}">${stockText} (${product.stock} available)</p>
                        <p style="font-size:13px;color:var(--warm-gray);">QR Code: ${product.qrCode}</p>
                        <div style="display:flex;gap:10px;margin:16px 0;">
                            <button class="btn-secondary" style="flex:1;" onclick="addToWishlist(${product.id})">❤️ Wishlist</button>
                            <button class="btn-secondary" style="flex:1;" onclick="openRequestModal()">📝 Request</button>
                        </div>
                        <button class="btn-primary" onclick="startOrderWorkflow(${product.id})">📷 Scan & Order</button>
                        <div style="margin-top:12px;font-size:13px;color:var(--warm-gray);text-align:center;">
                            <p>📍 ${BUSINESS_ADDRESS}</p>
                            <p>📞 +${OWNER_PHONE}</p>
                            <div style="display:flex;gap:10px;justify-content:center;margin-top:6px;">
                                <a href="tel:+${SELLER_PHONE}" style="color:var(--primary);text-decoration:none;">📞 Call Seller</a>
                                <a href="https://t.me/${SELLER_USERNAME}" target="_blank" style="color:var(--primary);text-decoration:none;">💬 Chat Seller</a>
                            </div>
                        </div>
                    `;
            modal.classList.add('visible');
        }

        // ============================================================
        // WISHLIST
        // ============================================================
        function addToWishlist(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            if (wishlist.find(p => p.id === productId)) {
                showToast('❤️ Already in wishlist!', 'info');
                return;
            }
            wishlist.push(product);
            showToast('❤️ Added to wishlist!', 'success');
            addNotification('❤️ Wishlist: ' + product.name, 'info');
        }

        // ============================================================
        // REQUEST MODAL
        // ============================================================
        function openRequestModal() {
            closeModal('productModal');
            openModal('requestModal');
        }

        function submitRequest() {
            const name = document.getElementById('reqName').value.trim();
            const qty = document.getElementById('reqQty').value.trim();
            const notes = document.getElementById('reqNotes').value.trim();
            if (!name || !qty) {
                showToast('⚠️ Please fill in product name and quantity', 'error');
                return;
            }
            showToast('✅ Request for "' + name + '" (Qty: ' + qty + ') sent to admin!', 'success');
            addNotification('📝 New request: ' + name + ' (Qty: ' + qty + ')', 'info');
            closeModal('requestModal');
            document.getElementById('reqName').value = '';
            document.getElementById('reqQty').value = '';
            document.getElementById('reqNotes').value = '';
        }

        // ============================================================
        // PAYMENT / REQUEST ACTIONS
        // ============================================================
        function approveRequest(btn) {
            const parent = btn.closest('div[style*="background:var(--bg-primary)"]') || btn.closest('.admin-panel > div');
            if (parent) {
                parent.innerHTML = '<span style="color:#2E7D32;font-weight:600;">✅ Approved</span>';
                showToast('✅ Request approved! Customer notified.', 'success');
                addNotification('📝 Product request approved!', 'success');
            }
        }

        function rejectRequest(btn) {
            const parent = btn.closest('div[style*="background:var(--bg-primary)"]') || btn.closest('.admin-panel > div');
            if (parent) {
                parent.innerHTML = '<span style="color:#C62828;font-weight:600;">❌ Rejected</span>';
                showToast('❌ Request rejected.', 'error');
            }
        }

        // ============================================================
        // CATEGORY FILTER
        // ============================================================
        function filterCategory(category) {
            const container = document.getElementById('allProducts');
            if (!container) return;
            const filtered = category === 'all' ? products : products.filter(p => p.category === category);
            container.innerHTML = filtered.map(p => renderProductCard(p)).join('');
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            const chips = document.querySelectorAll('.category-chip');
            chips.forEach(c => {
                if (c.textContent === category || (category === 'all' && c.textContent === '✨ All')) c.classList
                    .add('active');
            });
            showToast('📂 Showing: ' + (category === 'all' ? 'All Products' : category), 'info');
        }

        // ============================================================
        // NOTIFICATIONS
        // ============================================================
        function addNotification(message, type) {
            notifications.unshift({ message, type, time: new Date().toLocaleTimeString(), read: false });
            updateNotifBadge();
        }

        function updateNotifBadge() {
            const badge = document.getElementById('notifBadge');
            const count = notifications.filter(n => !n.read).length;
            if (count > 0) {
                badge.textContent = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleNotifications() {
            const modal = document.getElementById('notifModal');
            modal.classList.toggle('visible');
            if (modal.classList.contains('visible')) {
                const container = document.getElementById('notifList');
                if (notifications.length === 0) {
                    container.innerHTML =
                        `<div class="empty-state"><div class="empty-icon">🔔</div><h3 data-key="no_notifications">No notifications</h3></div>`;
                } else {
                    container.innerHTML = notifications.map(n =>
                        `<div style="padding:12px;border-bottom:1px solid var(--border-color);"><div style="font-weight:500;">${n.message}</div><div style="font-size:12px;color:var(--warm-gray);">${n.time}</div></div>`
                        ).join('');
                }
                notifications.forEach(n => n.read = true);
                updateNotifBadge();
            }
        }

        // ============================================================
        // DARK MODE
        // ============================================================
        function toggleDarkMode() {
            document.body.classList.toggle('dark-theme');
            showToast('🌙 Dark mode ' + (document.body.classList.contains('dark-theme') ? 'enabled' : 'disabled'), 'info');
            const currentPage = document.querySelector('.nav-item.active');
            if (currentPage) navigateTo(currentPage.dataset.page);
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast visible ' + (type || 'info');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        // ============================================================
        // MODAL HELPERS
        // ============================================================
        function openModal(id) {
            document.getElementById(id).classList.add('visible');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('visible');
        }

        // ============================================================
        // COUNTDOWN TIMERS
        // ============================================================
        setInterval(() => {
            document.querySelectorAll('.order-card .order-meta').forEach(el => {
                if (el.textContent.includes('Reservation')) {
                    const order = orders.find(o => o.type === 'Reservation' && o.status === 'pending');
                    if (order && order.timer !== undefined && order.timer > 0) {
                        order.timer--;
                    }
                }
            });
        }, 1000);

        console.log('✨ soYam Cosmo Mini App loaded successfully!');
        console.log('👤 User:', currentUser);
        console.log('👑 Owner:', OWNER_USERNAME);
        console.log('🛍️ Seller:', SELLER_USERNAME);
        console.log('📦 Products:', products.length);
        console.log('📋 Orders:', orders.length);
    </script>

</body>
</html>
